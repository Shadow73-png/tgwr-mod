 #Ideas
 GER_berlin_baghdad_railway_construction: "Baghdadbahn Construction"

 #Events
 ww1_berlin_baghdad.1.t: "[GER.GetName] Wants to Extend the Baghdadbahn"
 ww1_berlin_baghdad.1.d: "The [GER.GetName] has asked us for the permission to continue the construction of the Berlin-Baghdad Railway. They are willing to foot the entire bill, and the railway would benefit us greatly by connecting the southern vilayets and the Persian Gulf area with the rest of the empire. However, this would push us further in the direction of an alliance with the Germans, and threaten Russian and British spheres of influence in Persia and the Persian gulf. We have to be careful and decide, whether potentially angering two great powers is the price we're ready to pay for modernization of our infrastructure."
 ww1_berlin_baghdad.1.a: "We welcome this investment, of course."
 ww1_berlin_baghdad.1.b: "We don't want it, actually."
 ww1_berlin_baghdad.2.t: "[TUR.GetName] Grants Us the Permission for Construction"
 ww1_berlin_baghdad.2.d: "As expected, the Turks couldn't resist our generous proposal, meaning now we have to pay the entire expense of the project and send our experts in the Middle East. Hopefully, the Russians and the British don't  the construction."
 ww1_berlin_baghdad.2.a: "Proceed immediately"
 ww1_berlin_baghdad.3.t: "[TUR.GetName] Refuses the Construction"
 ww1_berlin_baghdad.3.d: "Unexpectedly, the Turks refused to grant us the permission for construction, even though we offered to pay the entire expense. Perhaps, they'd rather be friends with Russia and Britain, who want to take their territory for themselves."
 ww1_berlin_baghdad.3.a: "Ungrateful Turks."
 ww1_berlin_baghdad.4.t: "[FROM.GetName] is Expanding the Berlin-Baghdad Railway"
 ww1_berlin_baghdad.4.d: "The Germans have decided to start another stage of the Berlin-Baghdad Railway construction, threatening our influence in the region. Should we issue a protest to get them to back down!"
 ww1_berlin_baghdad.4.a: "Of course we protest!"
 ww1_berlin_baghdad.4.b: "We don't need a conflict with them right now."
 ww1_berlin_baghdad.5.t: "[FROM.GetName] Protests the Berlin-Baghdad Railway"
 ww1_berlin_baghdad.5.d: "[FROM.GetName] apparently thinks that that our dealings with Turks concern them and issued a formal protest against the construction of the Baghdadbahn. Should we even consider their opinion on the matter?"
 ww1_berlin_baghdad.5.a: "This is none of their concern."
 ww1_berlin_baghdad.5.b: "Don't care, didn't ask."
 ww1_berlin_baghdad.6.t: "[FROM.GetName] Refuses to Back Down"
 ww1_berlin_baghdad.6.d: "[FROM.GetName] believes that the deal they made with the [TUR.GetName] only concerns them as sovereign states, and that our demands have no grounds. Should we respond?"
 ww1_berlin_baghdad.6.a: "We have a right not to trade with them then."
 ww1_berlin_baghdad.6.b: "Let's not overplay our hand here."
 ww1_berlin_baghdad.7.t: "[FROM.GetName] Threatens Us with an Embargo"
 ww1_berlin_baghdad.7.d: "[FROM.GetName] are still at it, threatening to cut off trade between our countries, unless we stop the Baghdadbahn construction this instant. A bold move, should we find out whether they really are ready to try it?"
 ww1_berlin_baghdad.7.a: "They can try."
 ww1_berlin_baghdad.7.b: "We have to back down."
 ww1_berlin_baghdad.8.t: "[FROM.GetName] Stands Defiant"
 ww1_berlin_baghdad.8.d: "It appears that our threats fall on deaf ears, as the [FROM.GetName] still refuses to back down and stop the project. Are we prepared for a full on trade war to kill the Baghdadbahn?"
 ww1_berlin_baghdad.8.a: "Mamma didn't raise no quitter."
 ww1_berlin_baghdad.8.b: "No, this is madness."
 ww1_berlin_baghdad.9.t: "[FROM.GetName] Issues Trade Embargo"
 ww1_berlin_baghdad.9.d: "In a stunning move, [FROM.GetName] actually followed through with their threats and officially seized all trade with us. This is the last opportunity for us to save relations between our countries."
 ww1_berlin_baghdad.9.a: "You know what? We kinda like it."
 ww1_berlin_baghdad.9.b: "It's not fun anymore."
 ww1_berlin_baghdad.10.t: "Baghdadbahn Causes Trade Embargo"
 ww1_berlin_baghdad.10.d: "It appears that the Berlin-Baghdad Railway project irritated [FROM.GetName] so much, they're ready to take drastic actions to stop it. Should we tell Germans that enough is enough?"
 ww1_berlin_baghdad.10.a: "We need the railway more than we need trade."
 ww1_berlin_baghdad.10.b: "What are we, a German colony? Revoke the permit."
 ww1_berlin_baghdad.11.t: "[FROM.GetName] Backs Down"
 ww1_berlin_baghdad.11.d: "Our pressure on the Germans has been fruitful, as it appears that they've halted the construction of the Berlin-Baghdad Railway. This calls for a celebration of our diplomatic victory."
 ww1_berlin_baghdad.11.a: "Good news, everyone!"
 ww1_berlin_baghdad.12.t: "[FROM.GetName] Lifts the Embargo"
 ww1_berlin_baghdad.12.d: "It appears that the trade embargo has been lifted there are no longer any obstacles to our trade with the [FROM.GetName]. The conflict between our nations has been averted and we can continue business as usual."
 ww1_berlin_baghdad.12.a: "Glad they came to their senses."
 ww1_berlin_baghdad.13.t: "[FROM.GetName] Backs Down"
 ww1_berlin_baghdad.13.d: "To our surprise, after all their threats and protests, the [FROM.GetName] decided not to follow through on any of them, and the Baghdadbahn construction can proceed without any issues."
 ww1_berlin_baghdad.13.a: "Shouldn't have started this in the first place."
 ww1_berlin_baghdad.14.t: "Construction Ended Prematurely"
 ww1_berlin_baghdad.14.d: "As a result of circumstances outside of our control, our construction efforts have been halted. We were able to gather what remained of our assets, but we won't be able to resume construction for some time."
 ww1_berlin_baghdad.14.a: "Unfortunate."
 ww1_berlin_baghdad.15.t: "[FROM.GetName] Revokes Our Permit"
 ww1_berlin_baghdad.15.d: "Our permission for the Baghdadbahn construction has suddenly been revoked by the Turkish government. We were able to gather what remained of our assets, but we won't be able to resume construction for some time."
 ww1_berlin_baghdad.15.a: "What is this, some sort of Backstab?"
 ww1_berlin_baghdad.16.t: "[FROM.GetName] Kills the Baghdadbahn"
 ww1_berlin_baghdad.16.d: "To our surprise [FROM.GetName] has decided to end the German construction permission. A welcome development, as it creates between their governments and makes our assets in the region safer."
 ww1_berlin_baghdad.16.a: "Reward them with lifting the embargo."

