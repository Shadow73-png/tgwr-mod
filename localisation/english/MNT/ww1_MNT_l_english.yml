ww1_montenegro.15.t: "Kingdom of Montenegro Is Proclaimed"
ww1_montenegro.15.d: "Prince Nicholas of Montenegro proclaimed the Kingdom of Montenegro in Cetinje on today, elevating the country from the rank of Principality. Since 1860, the Prince had ruled the country and had initiated several modernising reforms."
ww1_montenegro.15.a: "Long May He Reign"

ww1_montenegro.16.t: "Montenegro Ascends to Kingdom"
ww1_montenegro.16.d: "Montenegrin prince Nikola had unilaterally declared his nation's ascension to the level of kingdom. The move was obviously supported by every patriotic Serb in both Serbia and Montenegro. There was a major celebration in that occassion, and numerous monarchs and foreign officials visited the celebration. The celebration was so large and overshadowed the credit taken for that occasion, namely the credit is so large that it would have to be paid for the next decade at the very least. Among other things, it confirms the ambitions of now king Nikola I even more now."
ww1_montenegro.16.a: "Let them enjoy and send our congratulations"

ww1_montenegro.17.t: "Kingdom of Montenegro Proclaimed"
ww1_montenegro.17.desc: "The former Prince, now King, Nikola I has announced a Kingdom during the celebration of his jubilee and a petition from the Montenegrin Parliament. Montenegro continues to progress on the world stage, following a decade of reforms, such as establishment of a constitution and an independent currency. This news is warmly received in Russia and France, but causes mixed feelings in Austria and the Sublime Porte..."
ww1_montenegro.17.a: "Onamo 'namo!"
ww1_montenegro.17.b: "Careful now..."
ww1_montenegro.17.c: "Ha! Alright fella"
ww1_montenegro.17.d: "They go with our blessing!"
ww1_montenegro.17.e: "A sign of ego or maturation?"



