MNT_nikola: "Nikola"
MNT_nikola_desc: "§YBy the Grace of God, Prince and Lord of Montenegro.§!\n\n§LNikola Petrović Njegoš ascended to the throne in 1860, following the assassination of his uncle Danilo. He has been the ruler of Montenegro for over 50 years, and has seen Serbia change rulers four times since his ascension. A staunch patriot and fighter for his people, he has led successes against Ottomans ever since his ascension to the Cetinje throne, fighting Turks in wars of 1876-1878 and establishing sovereignty after centuries of struggle.\n\nFor his entire rule he has tried to present himself as the true ruler of all Serbs, regardless of the existance of a larger Serbian state. With his advancing age his ambitions have also increased, from claims of expansion to claim of leading future Yugoslav state himself. These ambitions have made him the target of several attacks ranging from blood feuds to the Bomb Affair of 1907. Almost forced, in 1905, he has given his country a constitution, but he remains the true ruler of Montenegro with the assembly being rigged in his favor and serving only as a rubber stamp to his ambitions\n\nIt remains to be seen how long will Nikola be able to keep his throne, especially in the face of the inevitable unification with Serbia, internal strife and incoming final liberation from Ottomans!§!"
MNT_nikola_i: "Nikola I"
MNT_nikola_i_desc: "§YBy the Grace of God, King and Sovereign of Montenegro.§!\n\n§LNikola Petrović Njegoš ascended to the throne in 1860, following the assassination of his uncle Danilo. He has been the ruler of Montenegro for over 50 years, and has seen Serbia change rulers four times since his ascension. A staunch patriot and fighter for his people, he has led successes against Ottomans ever since his ascension to the Cetinje throne, fighting Turks in wars of 1876-1878 and establishing sovereignty after centuries of struggle.\n\nFor his entire rule he has tried to present himself as the true ruler of all Serbs, regardless of the existance of a larger Serbian state. With his advancing age his ambitions have also increased, from claims of expansion to claim of leading future Yugoslav state himself. These ambitions have made him the target of several attacks ranging from blood feuds to the Bomb Affair of 1907. Almost forced, in 1905, he has given his country a constitution, but he remains the true ruler of Montenegro with the assembly being rigged in his favor and serving only as a rubber stamp to his ambitions\n\nIt remains to be seen how long will Nikola be able to keep his throne, especially in the face of the inevitable unification with Serbia, internal strife and incoming final liberation from Ottomans!§!"
