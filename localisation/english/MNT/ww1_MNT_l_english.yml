serbian_sparta_desc: "Montenegro is often called Serbian Sparta after the famous heroism of Serbian Spartans-Montenegrins in the fight against the Turks for centuries."
MNT_bomb_affair: "Anti-Serbian paranoia"
MNT_bomb_affair_desc: "A plot to kill king Nikola was barely managed to uncover in 1908 from the hands of the Montenegrin army officers. The plot was organized by the Black Hand. King Nikola is now paranoid of similar attempts on his life."




############EVENTS
#event

ww1_montenegro.1.t: "Treaty With Serbia"
ww1_montenegro.1.d: "Serbia guaranteed us that we would get Eastern Montenegro under control after the capitulation of the Ottoman Empire."
ww1_montenegro.1.a: "Wonderful!"

ww1_montenegro.2.t: "Treaty With Serbia"
ww1_montenegro.2.d: "Serbia has put us at a great disadvantage. They made claims on Eastern Montenegro and denied us other territorial concessions."
ww1_montenegro.2.a: "Traitors."

ww1_montenegro.3.t: "Montenegrin Supreme Command"
ww1_montenegro.3.d: "Montenegro, our ally has no high command. They never had officers, and this might doom them. We have to send them someone to help organize their defense, since they have nobody experienced enough to organize their fight. Can we send them one of our more experienced generals?"
ww1_montenegro.3.a: "Yes, we can send them general Janković, we are not without generals."
ww1_montenegro.3.b: "No, we are already on our last legs."

ww1_montenegro.4.t: "Podgorica Assembly"
ww1_montenegro.4.d: "After the Great War, an ad hoc popular assembly was convened in Podgorica, Montenegro, while King Nikola I had not yet returned to his homeland. Their goal was to force Nikola to abdicate and push unconditional union with Serbia. The Whites, who support unification, and the Greens, who oppose the Whites, favoring independence or union with Serbia as an equal partner. Theyn amed after the color of the paper used to print Podgorica Assembly candidate lists. As a result of the vote, the Whites secured a majority in the assembly."
ww1_montenegro.4.a: "Present the resolution to Serbia!"

ww1_montenegro.5.t: "The Podgorica Assembly Decides to Union With Serbia"
ww1_montenegro.5.d: "The Podgorica Assembly in Montenegro sent a fifteen-member delegation led by Bishop of the Serbian Orthodox Church Gavrilo Dožić, which now are presenting the resolution of union with Serbia and Montenegro."
ww1_montenegro.5.a: "Wonderful!"

ww1_montenegro.6.t: "The Greens Uprising"
ww1_montenegro.6.d: "Dissatisfied with annexation of Montenegro, the Greens led an uprising in Montenegro. Pro-annexation Whites and our troops joined forces to stop them, leading to fighting near Cetinje and Podgorica."
ww1_montenegro.6.a: "What a lamentable fratricide."
ww1_montenegro.6.b: "Slava Crnoj Gori!\n(Play as [MNT.GetFlag]Montenegro)"

ww1_montenegro.15.t: "Kingdom of Montenegro Is Proclaimed"
ww1_montenegro.15.d: "Prince Nicholas of Montenegro proclaimed the Kingdom of Montenegro in Cetinje on today, elevating the country from the rank of Principality. Since 1860, the Prince had ruled the country and had initiated several modernising reforms."
ww1_montenegro.15.a: "Long May He Reign"

ww1_montenegro.16.t: "Montenegro Ascends to Kingdom"
ww1_montenegro.16.d: "Montenegrin prince Nikola had unilaterally declared his nation's ascension to the level of kingdom. The move was obviously supported by every patriotic Serb in both Serbia and Montenegro. There was a major celebration in that occassion, and numerous monarchs and foreign officials visited the celebration. The celebration was so large and overshadowed the credit taken for that occasion, namely the credit is so large that it would have to be paid for the next decade at the very least. Among other things, it confirms the ambitions of now king Nikola I even more now."
ww1_montenegro.16.a: "Let them enjoy and send our congratulations"

ww1_montenegro.17.t: "Kingdom of Montenegro Proclaimed"
ww1_montenegro.17.desc: "The former Prince, now King, Nikola I has announced a Kingdom during the celebration of his jubilee and a petition from the Montenegrin Parliament. Montenegro continues to progress on the world stage, following a decade of reforms, such as establishment of a constitution and an independent currency. This news is warmly received in Russia and France, but causes mixed feelings in Austria and the Sublime Porte..."
ww1_montenegro.17.a: "Onamo 'namo!"
ww1_montenegro.17.b: "Careful now..."
ww1_montenegro.17.c: "Ha! Alright fella"
ww1_montenegro.17.d: "They go with our blessing!"
ww1_montenegro.17.e: "A sign of ego or maturation?"



