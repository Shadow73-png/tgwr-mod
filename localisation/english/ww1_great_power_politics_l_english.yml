 great_power_politics_default_tt: "Great Power Politics"
 great_power_politics_default_tt_desc: "Engaging in great power politics allows us to pressure weaker countries and bring them in our sphere of influence, or to contend with other great powers over their possessions.\n\nSelect a §Ycategory§! to see §Gavailable§! decisions, or to monitor the situation."
 great_power_politics_misc_tt: "Minor Actions"
 great_power_politics_misc_tt_desc: "Various decisions unrelated to a particular theatre"
 great_power_politics_misc_desc: "Not every action we take concerns other nations, and sometimes we can make decisions without being afraid of great powers retaliating against us.\n\nUse this §Ycategory§! to prepare for the §YGreat War§! or to conduct §Yminor interventions§!."
 great_power_politics_great_war_tt: "The Great War"
 great_power_politics_great_war_tt_desc: "Decisions related to the Great War"
 great_power_politics_great_war_desc: "The sixth angel has sounded, proclaiming the beginning of the war to end all wars. The great powers have decided to resolve their differences with the sword, not diplomacy, and God have mercy on the rest of us.\n\n§GVictorious Faction will get claimed states and cores after the Conference§!."
