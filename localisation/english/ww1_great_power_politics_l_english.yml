l_english:

 # Scripted GUIs
 great_power_politics_crisis_tt: "[GetCrisisTitle]"
 great_power_politics_crisis_tt_desc: "[GetCrisisDesc]"
 great_power_politics_default_tt: "Great Power Politics"
 great_power_politics_default_tt_desc: "Engaging in great power politics allows us to pressure weaker countries and bring them in our sphere of influence, or to contend with other great powers over their possessions.\n\nSelect a §Ycategory§! to see §Gavailable§! decisions, or to monitor the situation."
 great_power_politics_misc_tt: "Minor Actions"
 great_power_politics_misc_tt_desc: "Various decisions unrelated to a particular theatre"
 great_power_politics_misc_desc: ""
 great_power_politics_great_war_tt: "The Great War"
 great_power_politics_great_war_tt_desc: "Decisions related to the Great War"
 great_power_politics_great_war_desc: "The sixth angel has sounded, proclaiming the beginning of the war to end all wars. The great powers have decided to resolve their differences with the sword, not diplomacy, and God have mercy on the rest of us.\n\n§GVictorious Faction will get claimed states and cores after the Conference§!."
 great_power_politics_conquest_of_morocco_tt: "The Conquest of Morocco"
 great_power_politics_conquest_of_morocco_tt_desc: "Decisions related to foreign influence in Morocco"
 great_power_politics_conquest_of_morocco_desc: "Great powers wish to carve up [MOR.GetFlag]§L[MOR.GetName]§! between each other."
 great_power_politics_strangling_of_persia_tt: "The Strangling of Persia"
 great_power_politics_strangling_of_persia_tt_desc: "Decisions related to foreign influence in Persia"
 great_power_politics_strangling_of_persia_desc: "Great powers wish to carve up [PER.GetFlag]§6[PER.GetName]§! between each other."
 great_power_politics_berlin_baghdad_tt: "The Berlin-Baghdad Express"
 great_power_politics_berlin_baghdad_tt_desc: "Decisions related to the construction of the Berlin-Baghdad Railway"
 great_power_politics_berlin_baghdad_desc: "[GER.GetFlag]§g[GER.GetName]§! wishes to influence the [TUR.GetFlag]§R[TUR.GetName]§! by funding the construction of the Berlin-Baghdad Railway."
 great_power_politics_sick_man_of_europe_tt: "The Sick Man of Europe"
 great_power_politics_sick_man_of_europe_tt_desc: "Decisions related to partitioning the [TUR.GetFlag]§R[TUR.GetName]§!"
 great_power_politics_sick_man_of_europe_desc: "[TUR.GetFlag]§R[TUR.GetName]§! is not an empire it once was, and other great powers have taken a notice of that, trying to expand their influence within the its borders or outright annex its territories."
 great_power_politics_balkan_powder_keg_tt: "The Balkan Powder Keg"
 great_power_politics_balkan_powder_keg_tt_desc: "Decisions related to territorial and political disputes in the Balkans"
 great_power_politics_balkan_powder_keg_desc: "The Balkans are a gordian knot of local disputes and conflicts of interests of different great powers. One spark could light the entire peninsula on fire, burning the rest of Europe with it."
