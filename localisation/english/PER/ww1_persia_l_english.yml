 PER_ali_reza_khan_regent_desc: "After the overthrow of Mohammad Ali Shah Qajar in 1909, Ali Reza Khan was employed by decision of the [GetPersiaAdj] Parliament as regent for the shah's son, Ahmad Shah Qajar, who was a minor when he ascended the throne after his father was deposed. Ali Reza Khan had no formal schooling. He is regarded as an honest politician."

