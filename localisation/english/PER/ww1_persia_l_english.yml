 PER_continue_with_belgian_advisors: "Continue with Belgian Advisors"
 PER_continue_with_belgian_advisors_desc: ""
 PER_empower_the_treasurer_general: "Empower the Treasurer-General"
 PER_empower_the_treasurer_general_desc: ""
 PER_treasury_gendarmerie: "Treasury Gendarmerie"
 PER_treasury_gendarmerie_desc: "Morgan Schuster propoueses to form an executive military organization called the Treasury Gendarmerie to collect the government's taxes from landowners and nobles."
 PER_elect_new_regent: "Elect the New Regent"
 PER_elect_new_regent_desc: "With the death of Azod-ol-Molk, the post of the Regent became vacant. The Mejlis has to elect the new Regent, which will decide the course of our politics."
 PER_subdue_the_press: "Subdue the Press"
 PER_subdue_the_press_desc: "We need to deal with the press that is abusing freedom, the parliament should grant these pwoers to the Prime Minister."
 PER_stronger_cabinet: "Stonger Cabinet"
 PER_stronger_cabinet_desc: "We need a stronger more decisive cabinet in these critical times."
 PER_regency_dictatorship: "Regency Dictatorship"
 PER_regency_dictatorship_desc: "Exile the opposition, ban the newspaers, refuse to hold parliamentary elections!"
 PER_restore_maku_maliat_payments: "Restore Maku's Maliat Payments"
 PER_restore_maku_maliat_payments_desc: "The Khan of Maku has completely stopped paying the maliat during the revolution of 1905, but he might be more willing to cooperate with the new government."

#Ideas
 PER_anglo_persian_oil_company: "$PER_anglo_persian_oil$"
 PER_ali_reza_khan_regent: "Regent Ali Reza Khan"
 PER_ali_reza_khan_regent_desc: "After the overthrow of Mohammad Ali Shah Qajar in 1909, Ali Reza Khan, tittled "Azod-ol-Molk" (Pillar of the Realm), was employed by decision of the [GetPersiaAdj] Parliament as regent for the shah's son, Ahmad Shah Qajar, who was a minor when he ascended the throne after his father was deposed. Ali Reza Khan had no formal schooling. He is regarded as an honest politician."
 PER_abolqasem_khan_qaragozlu_regent: "Regent $PER_abolqasem_khan_qaragozlu$"
 PER_abolqasem_khan_qaragozlu_regent_desc: "$PER_abolqasem_khan_qaragozlu$, tittled "$PER_naser_al_molk$" (Pillar of the Realm), is the member of the Moderates and holds conservative views."
 PER_mirza_hasan_ashtiani_regent: "Regent $PER_mirza_hasan_ashtiani$"
 PER_mirza_hasan_ashtiani_regent_desc: "$PER_mirza_hasan_ashtiani$, tittled "$PER_mostowfi_ol_mamalek$" (Chancellor of the Realm), is the member of the Democrats and holds progressive views."
