 #Azerbaijan
 AZR_azerbaijani_khanate: "Azerbaijani Khanate"
 AZR_azerbaijani_khanate_desc: "Most Khanates were disestablished in the 19th century. But [ROOT.GetNonIdeologyNameDef] remained, staying in isolation. But with the onset of the Constitutional Revolution and the interference of Great Powers, this might soon change."
 AZR_reactionary_stronhold: "Reactionary Stronhold"
 AZR_reactionary_stronhold_desc: "[ROOT.GetNameDef] held back against the revolution, and doesn't hold loyalties to the new central government."
 MAK_royal_intrigues: "Royal Intrigues"
 MAK_royal_intrigues_desc: "The former Khan, Teymur Pasha, strengthened the khanate. During a raid on Azerbaijan by the Kurds of Sheikh Obaidullah, who wanted to create an independent Kurdistan, Teymur Pasha Khan fought them off, earning him the title of "savior of Azerbaijan". The local people called him "Mākū Pādshāhī". After his death, his five brothers wanted to succeed him. This struggle for power weakened the khanate."

