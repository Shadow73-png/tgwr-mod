#Ideas
 PER_anglo_persian_oil_company: "$PER_anglo_persian_oil$"
 PER_ali_reza_khan_regent: "Regent Ali Reza Khan"
 PER_ali_reza_khan_regent_desc: "After the overthrow of Mohammad Ali Shah Qajar in 1909, Ali Reza Khan, tittled "Azod-ol-Molk" (Pillar of the Realm), was employed by decision of the [GetPersiaAdj] Parliament as regent for the shah's son, Ahmad Shah Qajar, who was a minor when he ascended the throne after his father was deposed. Ali Reza Khan had no formal schooling. He is regarded as an honest politician."
 PER_ali_reza_khan_regent: "Regent Ali Reza Khan"
 PER_abolqasem_khan_qaragozlu_regent: "Regent $PER_abolqasem_khan_qaragozlu$"
 PER_abolqasem_khan_qaragozlu_regent_desc: "$PER_abolqasem_khan_qaragozlu$, tittled "$PER_naser_al_molk$" (Pillar of the Realm), is the member of the Moderates and holds conservative views."
 PER_mirza_hasan_ashtiani_regent: "Regent $PER_mirza_hasan_ashtiani$"
 PER_mirza_hasan_ashtiani_regent_desc: "$PER_mirza_hasan_ashtiani$, tittled "$PER_mostowfi_ol_mamalek$" (Chancellor of the Realm), is the member of the Democrats and holds progressive views."
