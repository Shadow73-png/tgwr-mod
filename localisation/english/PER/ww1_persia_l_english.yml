 #Events
 ww1_persia_rework.1.t: "Regent Azod-ol-Molk Dies"
 ww1_persia_rework.1.d: "Ali-Reza Khan Azod-ol-Molk has died at the age of 62. He was the Regent of [GetPersiaName] for a total of eighteen months. At the end of his life he was known as Dai Khan (honorable uncle)."
 ww1_persia_rework.1.a: "We'll have to elect a new regent."
 ww1_persia_rework.2.t: "Choosing the New Regent"
 ww1_persia_rework.2.d: "With the death of Azod-ol-Molk, the post of the Regent became vacant. The Mejlis has to elect the new Regent, which will decide the course of our politics. The choice is between a conservative Naser al-Molk of the Moderates and a progressive Mostowfi ol-Mamalek from the Democrats."
 ww1_persia_rework.2.a: "We need moderation."
 ww1_persia_rework.2.b: "We need reform."
 ww1_persia_rework.3.t: "Seyyed Abdollah Behbahani Assassinated!"
 ww1_persia_rework.3.d: "In the second parliament, the deputies were divided into two groups: ultra progressive and moderate. Behbahani supported the moderate group and became an influential person when differences of opinion arose between the two groups, causing the ultra progressive deputies led by Sayyed Hasan Taqizadeh to dislike him. On the night of Friday 15 July 1910, four gunmen associated with the Democrats attacked him at his home and killed him. Seyyed Hassan Taghizadeh is suspected to be responsible, and he subsequently fled the capital."
 ww1_persia_rework.3.a: "This violence must be stopped!"
 ww1_persia_rework.4.t: "Violent Confrontation over Disarmament!"
 ww1_persia_rework.4.d: "Sattar Khan and his warriors, who arrived to the Capital in April, camped out in Atabek Park, where they refused to obey the Government's order to disarm. The government's troops and police forces led by Yeprem Khan, launched a brief but violent confrontation, and succeeded in surrounding and disarming Sattar Khan's forces. About 30 warriors were killed and Sattar Khan was wounded in his leg - leaving him disabled."
 ww1_persia_rework.4.a: "In the end it has to be this way."

 #Russian Intervention
 ww1_per_rus_strangling.1.t: "Russian Ultimatum!"
 ww1_per_rus_strangling.1.d: "The Russian Minister, called at the Persian Foreign Offi.ce and made a verbal demand, in the name of his Government, that the Treasury gendarmes should be immediately withdrawn from the park of Shuau's-Saltana, and that Persian Cossacks from the Cossack Brigade should be put in possession of the estate. He also demanded an apology for the "insult" which his Government alleged had been offered to its Consular officers. He refused to pay any attention to Persia's protest against the violation of her sovereignty and the interference with her internal affairs, and actually returned the written protest lodged by the Persian Government, though he had previously received and acknowledged the same.\n\nThe Russian Minister stated that his instructions were to obtain an immediate answer, "yes" or " no," from the Persian Cabinet."
 ww1_per_rus_strangling.1.a: "We shall consult the British."
 ww1_per_rus_strangling.1.b: "We have no other choice..."
 ww1_per_rus_strangling.1.c: "We refuse to humiliate ourselves!"
 ww1_per_rus_strangling.2.t: "Persia Frightened by Russia"
 ww1_per_rus_strangling.2.d: ""
 ww1_per_rus_strangling.2.a: "Tell them to accept the Ultimatum and apologize."
 ww1_per_rus_strangling.3.t: "Britain Advices to Accept the Russian Ultimatum"
 ww1_per_rus_strangling.3.d: ""
 ww1_per_rus_strangling.4.t: "Persia Accepts our Ultimatum..."
 ww1_per_rus_strangling.4.d: ""
 ww1_per_rus_strangling.4.a: "Doesn't matter, start writing a new one!"
 ww1_per_rus_strangling.5.t: "Persia Rejects our Ultimatum!"
 ww1_per_rus_strangling.5.d: ""
 ww1_per_rus_strangling.5.a: "Thanks for the pretext!"
 ww1_per_rus_strangling.6.t: "Another Ultimatum is Being Prepared!"
 ww1_per_rus_strangling.6.d: "The Russian Foreign Minister replied that our agreement to the demands of the ultimatum was accepted but that he was instructed to give notice that in the meantime another ultimatum was being prepared!"
 ww1_per_rus_strangling.6.a: "Excuse me?"

 ww1_per_rus_strangling.7.t: "Second Russian Ultimatum!"
 ww1_per_rus_strangling.7.d: ""
 ww1_per_rus_strangling.7.a: "What do they even want?!"
 ww1_per_rus_strangling.8.t: "The Russians are Near Tehran!"
 ww1_per_rus_strangling.8.d: ""
 ww1_per_rus_strangling.8.a: "Accept the ultimatum..."
 ww1_per_rus_strangling.8.b: "Organise the defenses!"
 ww1_per_rus_strangling.9.t: "Mejlis Rejects the Ultimatum!"
 ww1_per_rus_strangling.9.d: ""
 ww1_per_rus_strangling.9.a: "Shut it down!"
 ww1_per_rus_strangling.10.t: "Persia Accepts the Ultimatum"
 ww1_per_rus_strangling.10.d: ""
 ww1_per_rus_strangling.10.a: "Mission accomplished."
 ww1_per_rus_strangling.11.t: "Restoration of Mohammad Ali Shah"
 ww1_per_rus_strangling.11.d: ""
 ww1_per_rus_strangling.11.a: "Masha'Allah, we're back again."

 ww1_per_generic.1.t: "[FROM.GetNameDefCap] is Asking for a Loan"
 ww1_per_generic.1.d: ""
 ww1_per_generic.1.a: "This will expand our influence."
 ww1_per_generic.1.b: "Persia is not worth a scrap."
 ww1_per_generic.2.t: "[FROM.GetName] Agreed to Issue a Loan"
 ww1_per_generic.2.d: ""
 ww1_per_generic.2.a: "Much obliged."
 ww1_per_generic.3.t: "[FROM.GetName] Refused to Issue a Loan"
 ww1_per_generic.3.d: ""
 ww1_per_generic.3.a: "We have other options."
 ww1_per_generic.4.t: "Russia Formed a Cossack Regiment in [PER_cossack_regiment_station.GetName]"
 ww1_per_generic.4.d: "The Russian government, taking advantage of the weakness of our government, formed a Cossack unit in [PER_cossack_regiment_station.GetName]."
 ww1_per_generic.4.a: "We must tread with caution."


