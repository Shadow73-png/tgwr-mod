 PER_disarm_revolutionaries: "Disarm Revolutionaries"
 PER_disarm_revolutionaries_desc: "Multiple assassinations of political and religious figures occurred during these turbulent times. We need to stop these assassinations and declare that all private citizens turn in their arms"
