#Events
 ww1_persia_rework.1.t: "Regent Azod-ol-Molk Dies"
 ww1_persia_rework.1.d: "Ali-Reza Khan Azod-ol-Molk has died at the age of 62. He was the Regent of [GetPersiaName] for a total of eighteen months. At the end of his life he was known as Dai Khan (honorable uncle)."
 ww1_persia_rework.1.a: "We'll have to elect a new regent."
 ww1_persia_rework.2.t: "Choosing the New Regent"
 ww1_persia_rework.2.d: "With the death of Azod-ol-Molk, the post of the Regent became vacant. The Mejlis has to elect the new Regent, which will decide the course of our politics. The choice is between a conservative Naser al-Molk of the Moderates and a progressive Mostowfi ol-Mamalek from the Democrats."
 ww1_persia_rework.2.a: "We need moderation."
 ww1_persia_rework.2.b: "We need reform."