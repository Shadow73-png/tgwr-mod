l_english:
#focuses
AUS_distribute_cook_books: "Distribute State Cookbooks to the Public"
#army
ww1_austriahungary_war.42.t: "Civilian Governments Lose Independence"
ww1_austriahungary_war.42.d: "Mayors, governors, and parliament members have seen their powers confiscated as the Armeeoberkommer­ando ramps up their demands to elected officials. They're demanding specific persecutions, new laws, and militaristic agendas for their states. It's proving to be frustrating and unpopular amongst many in the civilian government, who see the military as disrespectful and ignorant."
ww1_austriahungary_war.42.a: "They need to relinquish full control for now"
AUS_destroy_the_peace_movement: "Bulldoze the Peace Movement"
AUS_technical_military_committee: "The Technical Military Committee"
AUS_technical_military_committee_desc: "The Technical Military Committee, founded in 1869, is part of the Austrian War Ministry dedicated to following technical development useful to the military, submitting expert opinions, and is split into artillery, engineering, statistics, technology, and automotive sections. With the help of this committee, the Austrian military will be able to lead in the adaptation of new technologies for battlefield use."
AUS_war_requirements_act: "War Requirements Act"
AUS_war_requirements_act_desc: "To prepare ourselves in case of war, we must ensure that the civilian population will be ready to aid us in that war. The War Requirements Act must be passed, allowing, during a war, the placement of factories under military control and requisition of motor vehicles and horses from citizens, while of course compensating them."
AUS_modernize_artillery_equipment: "Modernize Artillery Equipment"
AUS_modernize_artillery_equipment_desc: "The current artillery equipment in our army is badly outdated and must be modernized before it fails us on the battlefield. With the recently expanded army budget, new modernized artillery pieces should be purchased and new ones designed to replace our outdated arsenal."
AUS_work_with_skoda: "Work with Skoda"
AUS_work_with_skoda_desc: "In order to develop technologically further, we will launch widespread investments into artillery. This newfound equipment will provide a good boost during battles, and our techniques shall also improve."
AUS_fund_burstyns_motorgeschutz: "Fund Burstyn's Motorgeschütz"
MGS_makes_austria_more_likely_to_help: "§RExploitation§! related focuses and decisions make §YAustria§! and §YHungary§! more likely to support our efforts to stamp out resistance, and allow us to ask for more extensive help."
AUS_fund_burstyns_motorgeschutz_desc: "Gunther Adolf Burstyn is an Austrian inventor and technician who has managed to produce the technical blueprint for a heavy machine that would do well on the battlefield against our enemies. He named his design the 'Motorgeschütz', meaning 'motor gun'. Funding this project is a big gamble, but it might be the risk we have to take to win the war."
gunther_burstyn_designed_motor_gun: "§YGunther Burstyn§! has designed the §YMotorgeschütz§!"
AUS_expand_rail_funding: "Expand Rail Funding"
AUS_expand_rail_funding_desc: ""
AUS_more_agressive_against_SER: "§RPicking this option will allow you to be more aggressive against [SER.GetNameWithFlag] in future decisions§!\n\n\nNote for testers: if you think there is an event that should have different options because of this aggressiveness, tell daggie"
AUS_approve_extraordinary_army_expenditure: "Approve Extraordinary Military Expenditures"
AUS_approve_extraordinary_army_expenditure_desc: "Tensions across Europe are rising, and so is the possibility of us entering a war too, but our army isn't in the best shape. It is necessary that we approve some extraordinary military funding during this time to help the army purchase modernized equipment."
AUS_expand_the_army_budget: "Expand the Army Budget"
AUS_seized_taslica: "Austria Seized Taslica"
AUS_expand_the_army_budget_desc: "To quickly mobilize and strengthen our troops, we will institute a higher military budget. This might antagonize neighbors and significantly hurt our economic standing, but in the cause of self-defense, it is prioritized."
AUS_bolster_size_of_army: "Bolster the Size of the Army"
AUS_bolster_size_of_army_desc: ""
AUS_revise_the_army_law_1889: "Revise the 1889 Army Law"
AUS_revise_the_army_law_1889_desc: "The army law of 1889 is very outdated, limiting annual recruitment with the parliament at the time rejecting an annual increase in recruitment numbers. With tensions escalating, it is necessary that a new army law is passed, increasing annual recruitment and allowing it to be increased every year."
AUS_approve_new_fortification_projects: "Approve New Fortification Projects"
AUS_approve_new_fortification_projects_desc: "As our relations strain with our former ally Italy, we must check on the border and improve our existing defenses. The Alps, although already good ground for defense, are challenging terrain where forces cannot be placed in larger numbers unless accommodated and properly defended. So, to gain total control over these areas, our fortifications need further expansion before traitorous cowards on our western border enter the fight."
AUS_prioritized_logistics: "Prioritized Logistics"
AUS_rigorous_cohesion: "Rigorous Cohesion"
AUS_rigorous_cohesion_desc: ""
AUS_prepare_supply_hubs: "Prepare Supply Hubs"
AUS_booming_machine_tool: "Maintain Machine Tool Dominance"
AUS_booming_machine_tool_desc: ""
AUS_mountain_training: "Expand the Mountain Troops"
AUS_mountain_training_desc: ""
AUS_debloat_the_military_apparatus: "Debloat the Military Apparatus"
AUS_debloat_the_military_apparatus_desc: ""
AUS_cold_training: "Specialized Winter Training"
AUS_cold_training_desc: ""
AUS_masters_of_cavalry: "Masters of Cavalry"
AUS_masters_of_cavalry_desc: ""
AUS_implement_conrads_army_structure: "Implement Conrad's Army Structure"
AUS_implement_conrads_army_structure_desc: "Conrad von Hötzendorf has some very ambitious plans for the army, making it a large, well-disciplined force ready to attack the enemy. However, the Austrian army budget is currently not large enough to fund such an endeavor. His plans for the army should begin being implemented now, and hopefully the lack of army funding doesn't hold back his plans."
AUS_implement_conrads_army_structure.tt: "[HUN.GetFlag]§YHungarian General Géza Lukachich von Somorja§! will be transferred to the §YLandwehr§!"
AUS_ambitious_planning: "Elaborate Planning"
AUS_ambitious_planning_desc: "Conrad is known by many for the elaborate, heavily detailed, ambitious plans he has drawn up in case of a war with our enemies. These plans should be used across the entire army, as with them following Conrad's precise plans we shall surely win."
AUS_modernize_army_equipment: "Modernize Army Equipment"
AUS_modernize_army_equipment_desc: "One of the biggest problems with the army is the outdated equipment it uses, such as the outdated artillery. However, the army has not had the funds to purchase modern equipment. But now with the new funds granted, they should be put to good use and used to buy modern equipment for the army."
AUS_war_like_training_methods: "War-Like Training Methods"
AUS_war_like_training_methods_desc: ""
AUS_establish_army_reserves: "Establish Army Reserves"
AUS_establish_army_reserves_desc: "Mobilization is a complex topic not just across our realm but across the globe. Our multi-ethnic population often resists conscription, which is an essential cog in the machinery of our army. Therefore, we must establish army reserves sufficient for this impending war, the war of our lifetimes. Army reserves need to be increased at this very moment, because no matter what we do, it's a long and grueling process that must not set us back in any metric behind other great powers."
AUS_end_serbia: "Crush the Slavic Threat"
AUS_end_serbia_desc: "All preparations are finished. All precautions are taken. Our armies are in place and ready. We should have listened to Conrad and marched into Serbia before they caused all this commotion and anguish across the Balkans. The time is nigh to pull out this petty thorn from our backs that exists for no other reason but to be subdued and occupied by our might. Serbia will be no more!"
AUS_politically_isolate_conrad: "Politically Isolate Conrad"
AUS_politically_isolate_conrad_desc: "Conrad von Hötzendorf is a dangerous commander who thinks his plans are the best, while sidelining the ideas of others and constantly proposing pre-emptive invasions of other nations. With his dismissal from the position of chief of staff by the Emperor, it's time to seize the opportunity and isolate him from other leading military figures."
AUS_prepare_for_the_two_front_war: "Prepare for a Two-Front War"
AUS_prepare_for_the_two_front_war_desc: "If any sort of war were to occur, we must be prepared. To the south, Serbia grows more aggressive per day, hiding behind the Russian Bear. Both of these bloodthirsty enemies saw recent combat, which couldn't be said for our forces. We must pick up our pace for this unavoidable two-front war."
AUS_focus_on_the_defense: "Focus on the Defense"
AUS_focus_on_the_defense_desc: "Our army is large; however, it is unorganized and divided. Such an army should not focus on attack, for Conrad's courageous plans of constant attacking are in question due to his tunnel vision and lack of undisputed and reliable knowledge about enemy forces. Besides, the positive effects of defense on the Empire's core territories might bring fervor among some of our low-spirited units recruited from the borderlands. Although we will never doubt that we tower over each and every one of our enemies, a plan to dig in and let them show their cards might prove much more beneficial than blunt attacks."
AUS_cautious_planning: "Cautious Planning"
AUS_cautious_planning_desc: "Our estimates of Russian forces are somewhat inconsistent and too small for their size. On the other hand, the Serbian people feel dread at mention of our Empire, which is a powerful tool for conscription and morale. We can never take too much precaution, and it is without doubt that we should plan safely and prioritize defense of keypoints. After all, a two-front war is incoming, and our army hasn't seen warfare in any recent history. Every step we take must be thought-through and prepared for anything they throw at us."
AUS_adapt_new_infantry_tactics: "Adapt to New Infantry Tactics"
AUS_adapt_new_infantry_tactics_desc: "Infantry tactics have changed a lot since our last conflicts, as modernization of warfare has skyrocketed. Our infantry is in great shape, but to achieve striking victories and to capitalize on our qualities, we need the newest possible tactics to surprise our inferior enemies. Along with modernization, we should continue mending the conscription issue too before there grows a difference in quality between new and current soldiers."
#Wartime focuses
AUS_stop_the_hoarding_of_food: "Stop the Hoarding of Food"
AUS_stop_the_hoarding_of_food_desc: "Consumers are currently panicked by the outbreak of war and are hoarding food out of fear that supplies will run out. This is currently causing actual problems with food supplies, so regulations must be put into place to forbid the hoarding of food."
AUS_patriotic_loans: "Maximize Armament Production"
AUS_patriotic_loans_desc: "."
AUS_state_control_of_industry: "Nationalize the War Effort"
AUS_state_control_of_industry_desc: ""
AUS_roaring_money_printer: "The Roaring Money Printer"
AUS_roaring_money_printer_desc: ""
ww1_austriahungary_war.29.t: "Raising the Tobacco Tax"
ww1_austriahungary_war.29.d: "Tobacco is widely consumed by all in our empire, and with our deficits spiraling, we need to increase the tax on it. By doing so, we can raise crucial revenue for the war effort."
ww1_austriahungary_war.29.a: "Better this than economic collapse"
w1_austriahungary_war.30.t: "Taxes on Alcohol"
w1_austriahungary_war.30.d: "Alcohol presents a great opportunity to try and get our deficits under control, with higher consumption taxes on it unlikely to harm the overall economy too much while giving us more revenue. Thus, higher taxes on alcohol have been approved."
w1_austriahungary_war.30.a: "Maybe more of our people will get sober"
ww1_austriahungary_war.31.t: "Taxation of Gambling"
ww1_austriahungary_war.31.d: "Continuing the trend of raising sin and consumption taxes, taxes on gambling have been dramatically increased to try and raise funds for the war."
ww1_austriahungary_war.31.a: "We're running out of taxes!"
ww1_austriahungary_war.32.t: "Taxing Flint, Match, and Steel"
ww1_austriahungary_war.32.d: "An effective way to raise revenue is by taxing flint, match, and steel. Unfortunately, making these goods more expensive on the market will likely hinder our war industry, but our financial state is so poor we have no other choice."
ww1_austriahungary_war.32.a: "Let's hope this doesn't hurt too much"
ww1_austriahungary_war.33.t: "Taxes on Coal"
ww1_austriahungary_war.33.d: "To raise more funds, we will tax the consumption of all coal. It's a last resort tax, likely to hurt our industry and our people, but these are desperate times."
ww1_austriahungary_war.33.a: "We're running out of measures!"
ww1_austriahungary_war.34.t: "Hiking all Civilian Taxes"
ww1_austriahungary_war.34.d: "Our finances are in an extremely dire state, so we'll have to take desperate measures. Wine and sugar taxes, sin taxes, income and land taxes—all of them are being raised. This is going to hurt our civilian population greatly, but we have no other choice."
ww1_austriahungary_war.34.a: "We can't survive like this!"
ww1_austriahungary_war.35.t: "Direct Taxes on the War Industry"
ww1_austriahungary_war.35.d: "Obviously our last resort, we've begun directly taxing the war industry. Our production is surely going to be hit hard, but we have no good options in these times."
ww1_austriahungary_war.35.a: "We're taxing everything at this point!"
ww1_austriahungary_war.27.t: "War Profits Tax"
ww1_austriahungary_war.27.d: "To raise money for the war, the government has approved a new tax on companies perceived to be profiting from the war without providing enough benefit to the war effort."
ww1_austriahungary_war.27.a: "Natural to tax them"
ww1_austriahungary_war.28.t: "Raising Income Taxes"
ww1_austriahungary_war.28.d: "Unfortunately, Austria's war spending is spiraling, and we need to fund the war with revenue from our citizens. The income tax, being the most effective route, has been hiked through a decree."
ww1_austriahungary_war.28.a: "We need to get our war spending under control!"
ww1_austriahungary_war.26.t: "Cuts to Civilian Spending"
ww1_austriahungary_war.26.d: "To save money for the war, cuts to civilian spending have been approved through a decree. It will decrease funding for several welfare programs and civilian investments such as housing programs."
ww1_austriahungary_war.26.a: "Unfortunate, but necessary"
AUS_convert_war_economy: "Repurposing our Industry"
AUS_convert_war_economy_desc: ""
ww1_austriahungary_war.10.t: "Trial of Ferdinand's Assassins"
ww1_austriahungary_war.10.d: "The men implicated in the assassination of Franz Ferdinand, who were quickly captured after the tragic event, have finally had their day in court. The three main perpetrators were sentenced to twenty years of hard imprisonment, aggravated by a monthly fast and, on June 28th of each year, by solitary confinement in a dark cell. In addition, there was one life sentence and five death sentences, carried out by hanging."
AUS_build_massive_steel_plants: "Cisleithanian Steel Projects"
ww1_austriahungary_war.25.t: "Banning of Luxury Goods"
ww1_austriahungary_war.25.d: "While our financial state isn't unhealthy yet, the war is certainly having its cost. To ensure our citizens are not wasting money, we will ban the import of luxury goods. This will help control inflation slightly by decreasing spending while ensuring our citizens have money saved up if the war continues for a significant period."
ww1_austriahungary_war.25.a: "Who needs these anyway?"
AUS_resourceful_practices: "Resourceful Practices"
ww1_austriahungary_war.10.a: "Justice has been served!"
AUS_draft_exemptions: "Reform the Draft"
AUS_exports_imports_controls: "Exports and Imports Controls"
AUS_exports_imports_controls_desc: "Exports and imports are one of the most important topics now that half of the world is at war with us. Due to the ongoing war, obviously prices will jump, but to prevent uncontrolled escalation we must maintain pristine diplomacy with remaining trading partners to keep the economy and market afloat, for we cannot sustain ourselves alone."
AUS_set_up_the_centrals_system: "Set up the Centrals System"
AUS_set_up_the_centrals_system_desc: "To ensure strategically important goods needed for the war effort are managed correctly, they must be put under state control. To do this, multiple 'centrals' controlled by the government should be set up to manage certain resources such as metals, cotton, animal feeds, and more."
AUS_found_the_war_grain_distribution_institution: "Establish the War Grain Distribution Institution"
AUS_found_the_war_grain_distribution_institution_desc: "With the growing shortages of food across the nation, the rationing of certain goods such as grain should be put into place. To do this, a new institution, the Kriegs-Getreide-Verkehrsanstalt (War Grain Distribution Institution), shall be set up for this purpose."
AUS_expand_the_rationing_system: "Expand the Rationing System"
AUS_expand_the_rationing_system_desc: ""
#Decisions
AUS_put_factory_workers_under_military_control: "Put Factory Workers under Military Control"
AUS_design_modern_artillery_skoda: "Design Modern Artillery with Skoda"
AUS_purchase_modernised_skoda_artillery: "Purchase Modernized Skoda Artillery"
AUS_expand_army_recruitment: "Expand Army Recruitment"
AUS_discipline_soldiers_in_the_attack: "Train Soldiers in Attacking"
AUS_case_r: "Execute Case R"
AUS_reappoint_conrad: "Reappoint Conrad"
#Wartime decisions
ww1_austriahungary_war.14.t: "Pacifists Attempt to Spread Their Message"
ww1_austriahungary_war.14.d: "Pacifist groups and writers such as Alfred Fried, the League of Women's Association, the BÖFV Peace Committee, and more have been shocked by the outbreak of the war and are deeply concerned about the inevitable slaughter of young Austrian boys in a war they see as unnecessary. Already, rallies for peace are being prepared, while writers publish their manifestos against war and for peace. We will likely need to deal with these groups somehow."
ww1_austriahungary_war.14.a: "Their messages are nice, but delusional"
ww1_austriahungary_war.15.t: "The BOFV Peace Committee and the League of Women's Association Rally For Peace"
ww1_austriahungary_war.15.d: "Leading pacifist women have organized a large rally in Vienna, protesting the draft and militarism in general, demanding peace as soon as possible. They speak messages of hopeful optimism for a pacifist future which would allow all peoples to thrive in harmony and prosperity—a message that many dismiss as delusional but some cling to."
ww1_austriahungary_war.15.a: "They don't understand how the real world works"
AUH_great_war_bullshit: "The Ticking Timebomb"
AUH_great_war_bullshit_desc: "Our economy is not built for a long-lasting war of attrition. As this Great War goes on, our economy may buckle under the weight of itself.\n\nThe current £consumer_goods_texticon §NIntensity of Food Shortages§! are: [AUS_food_shortage_intensity] ([?AUS_intensity_of_food_shortages]) \n§LAs food prices increase, the people will get angrier. This cumulates in subtracting 1 loyalty from every minority group for every 5% increase to nominal food price increases.§!"
MGS_no_taking_restore_serbian_economy: "[AUS.GetFlag] §YAustria§! has §Rblocked§! this approach"
AUS_seize_industries_from_serbia: "Transport Assets of Serbian Businesses to Austria"
MGS_revolts_will_happen_tt: "Letting this national spirit get too severe will lead to §Rrevolts§! of §YSerbian Resistance§! movements"
MGS_locks_the_focus_restoring_the_serbian_economy: "§RLocks§! national focus: §YRestoring the Serbian Economy§!"
ww1_austriahungary_war.44.t: "First Food Riots"
ww1_austriahungary_war.44.d: "Food instability is starting to rise greatly in the empire as the war continues. With our efforts to control food shortages failing, people are taking to radical measures, smashing windows in shops, looting, and even rioting. The state of the streets is unacceptable, and we must try and address the cause of this wave of unrest in any way possible."
ww1_austriahungary_war.44.a: "We need peace on the streets!"
AUS_appoint_aehrenthal: "Foreign Minister Alois Lexa von Aehrenthal"
AUS_annexation_of_bosnia: "Annexation of Bosnia"
AUS_pig_war_pre_game: "Pig War Ongoing"
AUS_annexation_of_bosnia_desc: "In 1908, Austria officially annexed Bosnia and Herzegovina into its empire, after de facto occupying it from the Ottoman Empire since 1878."
AUS_oppose_panslavism: "Staunch Opposition to Pan-Slavism"
AUS_concede_the_trade_war: "Concede the Pig War"
AUS_it_unlocked_military: "This is available because we completed the focus §YSupremacy of the Armeeoberkommer­ando§!"
ww1_austriahungary_war.44.b: "The military will deal with these threats"
AUS_events_about_peace_destruction: "We will receive a rapid series of events about §SPacifist§! groups falling apart, providing us with §Gbuffs.§!"
ww1_austriahungary_war.16.t: "Alfred Fried Ceases Publications"
ww1_austriahungary_war.16.d: "Alfred Fried, leader of the Austrian Peace Society, has essentially capitulated to Austria's new anti-pacifist laws. In his last publication, he wrote: 'For decades we have been carrying out dedicated work to achieve this goal, gladly devoting our energies to it. We can say with a clear conscience that we have done our duty. We have not suffered a defeat, as our opponents triumphantly claim.' There's no other way to read it: Fried is throwing in the towel, giving his readers one last message. Although many of his allies are likely to try and continue peace actions, with many of his friends fleeing to Switzerland, this is a major win for us."
ww1_austriahungary_war.21.t: "Copper Shortages"
ww1_austriahungary_war.21.d: "As the war drags on, resources are drying up, and we've reached a critical shortage of copper. Luckily, not the most crucial material, it's unlikely to cause any true national crisis. Still, copper is useful for many industrial processes, and as it continues to dry up, we'll have to find creative ways to run our industry without it. For now, copper from the bells and roofs of churches is being seized to make up for it."
ww1_austriahungary_war.21.a: "Certainly not good"
ww1_austriahungary_war.22.t: "Copper Shortages"
ww1_austriahungary_war.22.d: "As the war drags on, resources are drying up, and we've reached a critical shortage of copper. Luckily, not the most crucial material, it's unlikely to cause any true national crisis. Still, copper is useful for many industrial processes, and as it continues to dry up, we'll have to find creative ways to run our industry without it. For now, copper from the bells and roofs of churches is being seized to make up for it."
ww1_austriahungary_war.22.t: "Rubber Shortages"
ww1_austriahungary_war.22.d: "As rubber previously coming from Africa and Asia dries up, the shortages are getting to the point where civilian cars don't even have tires anymore. Roads and buildings are being damaged as a result, while the military is starting to suffer from the shortage as well."
ww1_austriahungary_war.22.a: "Grueling, but temporary"
ww1_austriahungary_war.23.t: "Lead Shortages"
ww1_austriahungary_war.23.d: "As resources continue to dry up, we're now being hit with a shortage of lead. We're going to have to repurpose our industry to remove the need for lead in as many goods as possible, but removing the need for it entirely will be impossible. There's no other way around it; this is going to hurt us."
ww1_austriahungary_war.23.a: "Everyone has it hard right now"
ww1_austriahungary_war.24.t: "Shortages of Iron"
ww1_austriahungary_war.24.d: "Iron, a basic and crucial mineral for all industrial processes, is starting to dry up. Our industry is going to continue to shut down due to this, and we can only hope the war ends soon."
ww1_austriahungary_war.24.a: "Not good!"
ww1_austriahungary_war.16.a: "He's made the right choice"
ww1_austriahungary_war.17.t: "Collapse of the BOFV Peace Committee"
ww1_austriahungary_war.17.d: "Marianne Hainisch, writing in Der Bund, the BOFV's magazine, has declared the organization 'is deeply shocked and deplores the war, which affects us terribly, but must acknowledge we can do nothing about it. It would be a betrayal of the fatherland and the men defending it if we were now to advocate peace.' With this, another enemy of the war effort has capitulated."
ww1_austriahungary_war.17.a: "She understands the gravity of the situation!"
ww1_austriahungary_war.18.t: "Women's Peace Groups Rapidly Capitulate"
ww1_austriahungary_war.18.d: "Following the fall of the BOFV, the Women's Social Democrat organization, the Catholic Women's Organization of Lower Austria, and the Reich Organization of Austrian Housewives have all abandoned their previous advocacy for peace, instead supporting the war effort. Many of their members seem to be genuinely convinced by war propaganda, while others simply realize the reality of the situation and want to maintain some control over the public narrative."
AUS_hunt_and_destroy_the_media: "Control the Flow of Information"
AUS_uphold_civilian_rights: "Maximize Civilian Liberties"
AUS_soft_authoritarianism: "Soft Authoritarianism"
AUS_seeking_a_national_compromise: "Seeking a National Compromise"
AUS_protect_the_status_of_prague: "Protect the Status of Prague"
AUS_the_language_question: "The Language Question"
AUS_wait_them_out: "Wait Them Out"
AUS_sucessful_talks: "Successful Talks"
AUS_authoritarian_measures: "Authoritarian Measures"
AUS_away_from_imperial_decrees: "Reduce Imperial Decrees"
AUS_social_and_economic_reform: "Social and Economic Reforms"
AUS_reform_tax_collection: "Reform Tax Collection"
AUS_funnel_money_into_disease_control: "Funnel Money Into Disease Control"
AUS_oversight_of_factories: "Oversight of Factories"
AUS_utilize_pow_labor: "Employ Prisoners of War"
AUS_office_for_feeding_the_people: "Office for Feeding the People"
AUS_humanitarian_plead: "Desperate Measure"
AUS_ctfoi: "§YEvents§! and §Ymissions§! relating to §Rpublic outrage§! will have any debuffs slightly §Greduced.§! The §qCensorship Department§! will begin crafting a media strategy..."
ww1_austriahungary_war.18.a: "We welcome their support!"
ww1_austriahungary_war.19.t: "The Frauen-Hilfsaktion im Kriege"
ww1_austriahungary_war.19.d: "The Frauen-Hilfsaktion im Kriege, or the Women's War Aid Action, has been formed by merging several women's associations, the majority of which previously were pro-pacifist, to now support the war. They have condemned peace groups, vowed to cut contact with pro-pacifist women's groups domestic and abroad, and have declared their intentions to support the war effort where possible."
ww1_austriahungary_war.19.a: "All Austrian women should take inspiration from these patriots!"
AUS_introduce_price_caps: "Introduce Price Caps on Food"
ww1_austriahungary_war.43.t: "Military Seizes Equipment From Civilians"
ww1_austriahungary_war.43.d: "Military governors, with no approval from civilian governments, have begun going door to door to civilian populations, taking their weapons for the army and the war effort. They're taking civilian guns and in some cases their vehicles too, angering civilian populations but brutally putting down any resistance."
ww1_austriahungary_war.43.a: "Is this really necessary?"
ww1_austriahungary_war.55.t: "Germany Wants a Separate Peace with Serbia"
ww1_austriahungary_war.55.d: "The entry of Italy into the war against us, the failure of a quick victory over France, and the continued existence of Serbia has led Germany to see the continuation of the Balkan front as a waste of resources. They wish to see a separate peace with Serbia, where we would allow them to unite with Montenegro and annex part of northern Albania, and in exchange they would commit to close political ties to us and Germany, helping root out pan-Slavic groups in the empire. It would be part of a great German ambition in the Balkans to settle disputes between Bulgaria, Romania, and Greece, appeasing all three countries and drawing the entire Balkans into an alliance."
