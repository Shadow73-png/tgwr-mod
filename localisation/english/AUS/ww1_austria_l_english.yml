AUS_attack_regionalist_parties: "Attack Regionalist Parties"
AUS_attack_regionalist_parties_desc: "Divide and conquer. Except that it is us that are divided and consequentially to be conquered if we let loose those foolish regional, self-centered and argumentative parties. Regionalism in our comprehensive Empire sounds like a bureaucratic nightmare of attempting to appease every possible element within our borders. Therefore, regionalism must be opposed and renounced for the betterment of our nation as a whole."
