AUS_delay_the_coronation: "Dismantling the Ausgleich"
AUS_delay_the_coronation_desc: "Delaying the coronation of Franz II as King of Hungary will allow him to take executive decisions in the Hungarian Kingdom without having to abide by the Ausgleich Compromise of 1867. He has voiced his political opinion on what he would do in Hungary after his coronation: he would cause chaos."
