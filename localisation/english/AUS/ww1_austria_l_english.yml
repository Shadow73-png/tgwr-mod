AUS_camarilla_introduction: "The conservative §qCamarilla§! surrounding Franz Joseph are eager to see our government replaced as soon as possible. Although Franz Joseph isn't receptive to their demands yet, if we try anything that could be viewed as a fundemental threat to Austrian national security, he will surely wish to replace us. This is tracked by the variable §YCamarilla sway over the Emperor,§! which starts at §Y1.§! Getting above §Y5§! will result in the Emperor demanding the §YMinister President§! resign, and appointing a conservative autocrat to the position."
AUS_camarailla_influence_army: "Franz Joseph will become more amenable to the §qCamarilla's§! calls for our government to be replaced. This will be even worse if §qConrad§! is in charge of the army!"
AUS_church_stuff_chain: "We will receive an event chain debating the church's rule in §CEducation§! and §CState Registrars.§! Then, we will debate laws on §CMarriage§! and the position of §CReligious Orders§! like the jesuits. Our policies will have drastic effects"
ww1_austriahungary.186.t: "Defunding The Landwehr"
ww1_austriahungary.186.d: "The mass expansion of welfare envisioned by the social democrats in parliament will require trimming somewhere, and the Landwehr is a natural target. Although we have little ability to make cuts to the KuK, the Landwehr is perfectly in our domain. Cutting the budget of the Landwehr, the Austrian local army, will free up money for welfare programs and ensure we don't run massive deficits. It will however likely greatly anger the military, already working under small budgets, who will have to make up for the inevitable decline of the local Austrian army. "
ww1_austriahungary.186.a: "The people need healthcare, not artillery"
