# Events
ww1_occupiedserbia.1.t: "Formation of a New Serbian Administration"
ww1_occupiedserbia.1.d: "We've captured the vast majority of Serbia, and now we must manage the occupation. Since Serbia is particularly hostile to us, we must treat the state of Serbia very specially. A puppet government will be set up by the military and will collaborate with local Serb politicians vetted to not have a past of anti Austrian comments. Due to deep conflicting views between Austria and Hungary, the status for the future of the Serbian state will be decided after the war is won, but for now, the military occupation will have 3 objectives. They must begin the healing of Serbia, currently ridden with famine, disease, and a destroyed economy. They must root out Serbian resistance groups and terrorist groups. Most importantly, they must pillage the country as completely as possible, sending all resources found to the empire to fuel the war economies of Austria and Hungary."
ww1_occupiedserbia.1.a: "Send Johann von Salis-Seewis to form the government"
ww1_occupiedserbia.1.b: "We will take the burden of fufilling these duties (Play as them)"
ww1_occupiedserbia.2.t: "First Shipments From Occupied Serbia Begin Arriving"
ww1_occupiedserbia.2.d: "The general understanding upon the fall of Serbia and the institution of a new governmet was an understanding that the main role of this new government would be in part to aid the Austro-Hungarian war effort as much as possible. This program has offically began, as the military government has started to ship valuables such as gold to us."
ww1_occupiedserbia.3.t: "Economic Policy of the Serbian Military Government"
ww1_occupiedserbia.3.d: "Serbias military government is intending to attempt a recovery of the completely destroyed Serbian economy. While it does benefit us to have Serbia's economy recover somewhat; Serbia is likely to either be annexed or a puppet of the monarchy, and having a recovered Serbian economy will strengthen our realm. We must however, balance a recovery of Serbias economy, with our interests of exploiting them to fuel the war efforts of us and Hungary. If we want, we can demand the Serbian military government prioritize exploitation above all else."
ww1_occupiedserbia.3.a: "Serbia exists only for our benefit!"
ww1_occupiedserbia.3.b: "We shouldn't give any direct orders"
ww1_occupiedserbia.4.t: "Austria Restricts Our Economic Policy"
ww1_occupiedserbia.4.d: "Orders from Vienna are clear: we are to prioritize the economic interests of Austria and Hungary over the recovery of the Serbian economy. This means a focus on economic recovery will be delayed until the end of the war, and for now our policy will be to enrich Austria and Hungary as much as possible."
ww1_occupiedserbia.4.a: "Yes, sir!"
ww1_occupiedserbia.5.t: "Austria Gives us Free Hand in Economic Recovery"
ww1_occupiedserbia.5.d: "While our administration is still expected to help exploit Serbia to benefit Austria and Hungary, efforts to recover the Serbian economy at the same time have been permitted by Vienna. We can attempt this if we wish."
ww1_occupiedserbia.5.a: "Alright"
ww1_occupiedserbia.6.t: "Serbian Military Administration Prepares Transportation of Business Property to Homeland"
ww1_occupiedserbia.6.d: "In line with our exploitation of Serbia, our military government there in collusion with our government has formalized a plan to seize the property of businesses, taking both their tools and assets and bringing them to Austria. We can utilize this to fuel our war effort, although Serbians are likely going to intensify resistance when we implement it."
ww1_occupiedserbia.6.a: "Good stuff from them"
ww1_occupiedserbia.7.t: "Report on the Food Situation"
ww1_occupiedserbia.7.d: "Its been tasked to the military government to give us a report on the food situation in Serbia, and unfortunately they're in ruins. Risk of widespread famine is severe, with food insecurity already being widespread. The military government has thus appealed to us for aid, warning that if food is not shipped to Serbia soon a huge famine will erupt. Not only would this be a humanitarian catastrophe, but it would intensify resistance efforts and be a disaster to our PR on the world stage"
ww1_occupiedserbia.7.a: "We need a plan to get them aid as soon as possible"
ww1_occupiedserbia.7.b: "We don't have spare resources, they need to figure something else out"
ww1_occupiedserbia.7.c: "Whatever little grain they do have will go straight to Vienna!"
ww1_occupiedserbia.9.t: "Risk of Famine"
ww1_occupiedserbia.9.d: ""
ww1_occupiedserbia.9.a: ""
ww1_occupiedserbia.2000.t: "Exploitation Paused"
ww1_occupiedserbia.2000.d: "Our Military Administration reports that partisan activity in Serbia has surged. Exploitation and seizure operations will be paused until security improves."
ww1_occupiedserbia.2000.a: "Understood."
ww1_occupiedserbia.2001.t: "Exploitation Resumed"
ww1_occupiedserbia.2001.d: "Local authorities report that resistance has dropped below dangerous levels. Orders have been given to resume exploitation operations where appropriate."
ww1_occupiedserbia.2001.a: "Reinstate operations."
ww1_occupiedserbia.2002.t: "Forced Labour Begins"
ww1_occupiedserbia.2002.d: "The military government reports a program of forced labour has begun across occupied Serbia. Local workers are being drafted to support industries valuable to the Empire."
ww1_occupiedserbia.2002.a: "Understood."
ww1_occupiedserbia.2003.t: "Requisition Operations Begin"
ww1_occupiedserbia.2003.d: "The military administration has begun requisitioning raw materials and resources from Serbian businesses to be redirected to Austrian factories."
ww1_occupiedserbia.2003.a: "Acknowledge."
ww1_occupiedserbia.2004.t: "Suchdetaschement Deliveries"
ww1_occupiedserbia.2004.d: "Our detachments report regular deliveries of small arms, support equipment and artillery from occupied areas. Supplies will be forwarded to Austrian depots."
ww1_occupiedserbia.2004.a: "Good."
ww1_occupiedserbia.2005.t: "Wahren Verkehrs Zentrale Established"
ww1_occupiedserbia.2005.d: "A central office to coordinate trade and resource flows from Serbia to Austria has been established. This will prioritize Serbian goods for our industry."
ww1_occupiedserbia.2005.a: "Proceed."

MGS_pause_exploitation_due_to_resistance: "Partisans Sabotage — Pause Exploitation"
MGS_pause_exploitation_due_to_resistance_desc: "Resistance in Serbia has reached a critical level. Partisan activity has made continued exploitation too costly; operations will be paused until the situation improves."
MGS_resume_exploitation: "Exploitation Resumed"
MGS_resume_exploitation_desc: "Resistance has fallen to a manageable level. Exploitation operations in Serbia may resume."
MGS_resume_exploitation_when_resistance_falls: "Allow Exploitation to Resume"
MGS_resistance_too_high_to_exploit: "Resistance Too High — Exploitation Paused"

