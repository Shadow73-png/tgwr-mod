AUS_subsidize_skoda_works_desc: ""
AUS_funnel_money_into_landwehr: "Funnel Money into the Landwehr"
AUS_funnel_money_into_landwehr_desc: ""
AUS_reduce_working_regulations: "Reduce the Minimum Resting Period"
AUS_reduce_working_regulations_desc: "Right now, we have strict resting period requirements for low-skilled workers across the country. Although the idea behind the law was righteous, the current standards are improper and need to be renewed. We should reduce them in order to increase productivity."
AUS_galicia_invest: "Investments in Galicia"
AUS_discredit_trade_unions: "Discredit Trade Unions"
AUS_discredit_trade_unions_desc: "The Empire made great strides in reforms for the working class lately, enough to appease any reasonable working man. We should reach out and quell unions, especially in Bohemia, where sentiments disloyal to the Empire sow great divide and mistrust. We must investigate and stiffen our grip because loyalty of our industrial heartland is at stake!"
AUS_HUN_combat_spread_of_rinderpest: "Combat the Spread of Rinderpest"
AUS_italian_university: "Permit Construction of an Italian University"
AUS_new_housing_projects: "Subsidize Housing Construction"
AUS_new_housing_projects_desc: "In order to alleviate rising high costs of living, we must first fix the root of the issue: housing. We cannot let homelessness and impoverishment rise in the Empire! In order to combat the issue, we must take action into our own hands and begin construction of new homes and other public projects immediately!"
AUS_expand_trade: "Promote [AUS.GetAdjectiveCap] Commerce"
AUS_expand_trade_desc: "Trade is a quintessential part of the Empire's economy, and no matter what, we must never neglect it! In the eve of war, commanders and politicians are becoming aware that once war starts, many of the imports we heavily rely on will be extremely limited. So, relations with our trade partners must be immediate and effective to keep them loyal through the grit of war."
AUS_tackle_galician_poverty: "Invest in Galicia"
AUS_realistic_planning: "Reject Overly Ambitious Army Plans"
AUS_prioritize_the_infantry: "Prioritize the Basic Standing Army"
AUS_the_money_printer: "Utilizing the Money Printer"
AUS_worsening_food_shortages: "Worsening Food Shortages"
AUS_endorse_project_1911: "Implementing 'Project 1911'"
AUS_endorse_project_1911_desc: "In 1911, close advisors to Franz Ferdinand, Wiesner and Hoyos, wrote an extensive legal plan to be enacted immediately after Franz Ferdinand is coronated Emperor of Austria. The plan will allow Franz Ferdinand to quickly centralize power and significantly weaken opposition groups to Ferdinand, starting with the Hungarians."
AUH_austrian_military: "Landstreitkräfte"
AUS_reform_intelligence_agency: "Reform Intelligence Operations"
AUS_amend_pigwar_tarrifs: "Normalization of Trade With Serbia"
AUS_amend_pigwar_tarrifs_desc: "We reached an agreement with Serbia a few years ago to abandon our frivolous trade war. While we've dropped most of the tariffs, some still remain. We must continue slowly dropping these tariffs until trade relations are normalized."
AUH_dm_pig_war: "The Aftermath of the Pig War"
AUH_dm_pig_war_desc: "[AUS_pig_war_dm_desc_scripted]"
AUH_dm_pig_war_AUS_desc: "The Schweinekrieg, or the Pig War, were a series of unsuccessful tariffs and blockades imposed on Serbian pork in retaliation for them making other foreign connections. It lasted two years from 1906, but still has lasting effects on both countries' economies and relations."
AUH_dm_pig_war_HUN_desc: "The Disznóháború, or the Pig War, were a series of unsuccessful tariffs and blockades imposed on Serbian pork in retaliation for them making other foreign connections. It lasted two years from 1906, but still has lasting effects on both countries' economies and relations."
AUH_dm_pig_war_BOS_desc: "Svinjski rat, or the Pig War, were a series of unsuccessful tariffs and blockades imposed on Serbian pork in retaliation for them making other foreign connections. It lasted two years from 1906, but still has lasting effects on both countries' economies and relations."
AUS_every_mans_duty: "Every Man's Duty to His Nation"
AUS_premptive_strike: "Pre-Emptive Strike"
AUS_strict_working_regulations: "Big Beautiful Working Regulations"
AUS_invest_in_the_less_fortunate: "Invest in the Less Fortunate"
AUS_status_quo_angry: "Continuing the policies of the status quo will likely lead to political tensions across the empire worsening. Without action, things may §Rescalate§!"
AUS_the_hostile_enemy_of_austria: "Begin the Race War"
AUS_adress_inequality: "Address the Problem of Inequality"
AUS_adress_inequality_desc: "Our empire is vast, but unequal. Many ethnicities feel like they are neglected and left behind. Economic stagnation in these rural or mountainous reaches cannot be denied, and although not our fault, we are the ones that must help jumpstart some proper industry in every corner of our vast Empire. By investing into these territories, we can gain very much needed sympathy from our peoples and work towards building a prosperous society."
AUS_provide_trucks_dec: "Requisition Civilian Motor Vehicles"
AUS_lean_on_franz_joseph_support: "Close Ties to the Camarilla"
AUS_align_poles: "Polish Parliamentary Allies"
AUS_ally_social_christians_and_libs: "Coalition of Christian and Liberal PM's"
ww1_austriahungary.202.t: "Bienerth Forms Majority Government"
ww1_austriahungary.202.d: "Although an actual parliamentary majority is not required to be the minister president of Austria, securing a mandate does much to legitimize a government and give it true capacity to govern through democratic norms. With the election results in, Bienerth has secured majority support from parliament, and thus Franz Joseph has entrusted him to continue his tenure. We must however recognize that our majority is far from tightly unified, with members of parliament all having their own agendas. Still, if we can closely unite our allies in parliament we should be able to push basic legislation, and above all a solution to the Bohemian question once and for all."
ww1_austriahungary.202.a: "The torch has been relit!"
AUS_reformist_club: "Prepare a Moderate Electoral Alliance"
AUS_abandon_stabilization: "Stop Autofiring Decision £decision_icon_small '§YStabilization Effort in Slavic Territories§!'"
AUS_abandon_propaganda: "Stop Autofiring £decision_icon_small '§YPropaganda Campaign in Bohemia§!'"
AUS_when_1911_thing: "This focus will be §Gautocompleted§! upon the conclusion of the §Y1911 Cisleithania Elections§! if §YCount Richard Von Bienerth Schmerling§! cannot construct a working majority"
AUS_stabilization_effort: "Automatically Fire Decision £decision_icon_small '§YStabilization Effort in Slavic Territories§!'"
AUS_automatic_propaganda_bosnia: "Cool Tensions With Slavs"
AUS_automatic_propaganda_mission_bosnia: "Automatically Fire Decision £decision_icon_small '§YCool Tensions With Slavs§!'"
AUS_stabilization_effort_mission: "Stabilization Effort in Slavic Territories"
AUS_automatic_propaganda_mission: "Spreading Propaganda in Bohemia"
AUS_automatic_propaganda: "Automatically Fire Decision £decision_icon_small '§YPropaganda Campaign in Bohemia§!'"
AUH_automatic_mechanics: "Austrian Mechanics"
AUH_automatic_mechanics_desc: "Austria has several unique mechanics. Here you can get deeper explanations on all of them. You'll also have the option to automatically fire certain decisions here."
AUS_ratify_new_budget: "Renew the Gemeinsame Armee Fund"
AUS_ratify_new_budget_desc: "In order to create an economy budget for the Common Army, we will renew long-awaited funding to the army, significantly advancing the current state of our weaponry. This will also tie us closer to Hungary, while also preparing us for inevitable future conflicts."
AUS_reform_obstruction_laws: "Ban Obstructionism"
AUS_concede_to_christians: "Appeal to the Christian Majority"
AUS_balkan_war_crash: "Balkan War Crash"
AUS_concede_to_christians_desc: "The Reichsrat is made up of a social conservative Christian minority. We must play ball with these conservatives to pass our militaristic agenda, so let's give them special attention by embracing our common Christian identity."
AUS_inspectorates_local_governments: "Inspectorates of Local Governments"
AUS_inspectorates_local_governments_desc: "Many local governments are plagued with corruption and nepotism. To combat this, we should allow the Ministry of the Interior to inspect local governments and replace inefficient governors."
AUS_need_tt_for_this_decision: "Unlocks Decision: £decision_icon_small §YPlace (State) Under Military Governance§!"
AUS_reformgovsdecisions: "Unlocks £decision_icon_small §YDecisions§! to reform local governments in [AUS.GetFlag]§YAustrian§! states, trading £boost_popularity_texticon §gAuthoritarian§! support in exchange for £pol_power §YPolitical Power§!"
AUS_pp_for_rearms_now: "Focuses in the §YPrioritize Armament Bills§! sub-tree will now give a small bonus of £pol_power §YPolitical Power§! upon completion"

AUS_begin_erasing_slavic_identity: "Begin Erasing Slavic Identity in the South"

stuff_set_shit_0: "If £boost_popularity_texticon §gAuthoritarian§! §YParty Gain§! is less than §Y0§!, it will be set at §Y0§!"
AUS_serb_trade_cut: "Austro-Serb Trade Relations Severed"
AUS_cut_key_trade_SER: "Sever Trade Relations with [SER.GetName]"

# IMPERIAL COUNCIL STUFF (MOSTLY)

AUS_imperial_elections: "Elections to the Imperial Council"
AUS_imperial_elections_desc: "Elections to the Imperial Council are scheduled for July 1911.\nCurrently, the strength of the §gChristlichsoziale§! §qPartei§! is: [?AUS_conservative_election_performance]\nCurrently, the strength of the §mDeutscher§! §NNationalverband§! is: [?AUS_liberal_election_performance]\nCurrently, the strength of the §lSozialdemokratische§! §SArbeiterpartei§! is: [?AUS_socdem_election_performance]\nCurrently, the strength of §nLocal Parties§! is: 2"
AUS_how_to_win_1911_elections: "An alliance of the following parties will be created, containing:\n-All §nLocal Parties§!\n-§Yhalf§! of the strength of the §gChristlichsoziale§! §qPartei§!\n-§Yone-fourth§! of the strength of the §mDeutscher§! §NNationalverband§!\n\nIf the §gChristlichsoziale§! §qPartei§! wins a majority of the overall vote, this alliance will allow us to §Gsecure a new mandate from parliament§!, preventing our government from falling after the elections."
AUH_the_imperial_council: "The Imperial Council"
AUH_the_imperial_council_desc: "[AUS_GetMinisterIdeology]\n\n[AUS_GetImperialCouncilIdeology]"
AUS_imperial_council_info_tt: "The Imperial Council was established in 1861 as the legislative assembly of the Austrian Empire, following the February Patent that formalized constitutional governance. The job of the legislature is to debate and pass legislation and advise the Emperor, while the Minister-President serves as the head of government, leading the Council's administration."
AUS_ic_desc_tt: "The Imperial Council was established in 1861 as the legislative assembly of the Austrian Empire, following the February Patent that formalized constitutional governance. The job of the legislature is to debate and pass legislation and advise the Emperor."
AUS_mp_desc_tt: "The Minister-President serves as the head of government, leading the Council's administration."
AUH_the_imperial_council_tt: "Currently, the relationship between the §YMinister-President§! and the §YImperial Council§! is: [AUS_GetParliamentRelations] §L([?AUS_parliament_relations])§!"
AUS_the_minister_president: "The Minister-President of Cisleithania"
AUS_minister_president_tt: "The Minister-President \nof §YCisleithania§! is\na [AUS_GetMinisterIdeologyShort]"
AUS_minister_president_tt_2: "§Y[AUS_GetMinisterPresident]§! is a [AUS_GetMinisterIdeologyShort]"
AUS_reformist_tt: "§CReformist§!"
AUS_autocrat_tt: "§qAutocrat§!"
AUS_christlichsoziale_tt: "§gChristlichsoziale§! §qPartei§!"
AUS_sozialdemokratische_arbeiter: "§lSozialdemokratische§! §SArbeiterpartei§!"
AUS_deutscher_nationalverband: "§mDeutscher§! §NNationalverband§!"
AUS_imperial_council_ideology_tt: "The Imperial Council\nis led by the\n[AUS_GetImperialCouncilIdeologyShort]"
AUS_imperial_council_ideology_tt_2: "The Imperial Council is led by the [AUS_GetImperialCouncilIdeologyShort]"
AUS_mp_autocrat_desc_tt: "Currently, the §YMinister-President of Cisleithania§! is an §qAutocrat§!.\n§LAutocratic Minister-Presidents can work alongside conservative Imperial Councils in relative peace, yet will struggle heavily to work with liberals, nationalists, and social democrats. Generally, Autocrats will have poor relations with the Imperial Council and should work towards reducing the Imperial Council's powers as much as possible.§!"
AUS_mp_reformist_desc_tt: "Currently, the §YMinister-President of Cisleithania§! is a §CReformist§!.\n§LReformist Minister-Presidents may somewhat struggle to work alongside conservative Imperial Councils, but will have an easier time working with Liberals and Social Democrats. Reformist Minister-Presidents will only seek to override democracy in very extreme occasions, meaning it's best for reformist Minister-Presidents to try and maintain a working relationship with the Imperial Council.§!"
AUS_minister_president_desc_tt: "[AUS_GetMinisterIdeologyDescs]"
AUS_ic_conservatives_tt: "§LThe Christlichsoziale Partei, or the Christian Social Party, has led the Imperial Council for most of its history. It's made up of both moderate conservatives and staunch monarchists, who generally oppose reforms that will weaken the empire's power.§!"
AUS_ic_liberals_tt: "§LThe Deutscher Nationalverband, or the German National Association, is a collection of liberal and nationalist groups in Bohemia and Austria. Its members generally agree that reform is needed in the empire, with the party pushing for a comprehensive solution to solve Bohemian-German tensions.§!"
AUS_ic_social_dem_tt: "§LThe Sozialdemokratische Arbeiterpartei is a democratic socialist group that, combined with social democrat parties in different regions of Cisleithania, has finally reached a majority in parliament. The social democrats support new vast welfare programs and are divided on how to handle ethnic minorities in the empire.§!"
AUS_ic_party_desc_tt: "[AUS_GetImperialCouncilIdeologyDesc]"
AUS_ic_influence_tt: "Influence of the §YImperial Council§!:\n[AUS_GetParliamentInfluence] §L([?AUS_parliament_influence])§!"




AUS_ferdinand_von_trauttmansdorff: "Ferdinand Von Trauttmansdorff"
AUS_suspend_the_reichsrat: "Suspend the Reichsrat"
AUS_heinrich_clam_martinic: "Heinrich Clam-Martinic"
AUS_max_von_heinlein: "Max Hussarek Von Heinlein"
AUS_amend_pig_war: "Amend the 1906 Customs Tariff Act"
AUS_livestock_disease: "Livestock Disease"
AUS_industrialize_vienna_suburbs: "Industrialize Vienna's Suburbs"
AUS_industrialize_vienna_suburbs_desc: "Currently, Vienna is a great, powerful, and wealthy city. However, in order to further push the regional industries to their limits, we will stimulate industrial production by constructing state manufactories. This will create employment in the city for younger citizens."
AUS_increase_resource_extraction: "The European Resources Powerhouse"
AUS_increase_resource_extraction_desc: "Austria can reach copious amounts of resource production, specifically in steel and coal, even surpassing production capacities of other European powers like France and Russia. It is time to tap into our resource potential and become the powerhouse of the European Continent."
AUS_pursue_balkan_peace: "Pursue Peace in the Balkans"
AUS_pursue_balkan_peace_desc: "No one would profit more than us if the Balkans were peaceful. The destabilizing fighting that so many little nations over the Balkan peninsula call for is idiotic and can only bring harm! The status quo of these nations and Ottomans since their freedom is of utmost importance; these nationalistic bloodhounds do not know much about diplomacy or reason, and such neighbors no one wishes upon himself. Pursuit of peace in the Balkans will, therefore, be given more attention."
AUS_expand_womens_education: "Approve Girls' Education Projects"
AUH_democratic_riots: "Liberal Obstruction"
AUS_bohemian_steel_mills: "Bohemian Steel Mills"
AUS_bohemian_steel_mills_desc: "Oh! Sorry—the noise is the factories humming in the background! Steel is an essential resource for industrial output, so creating more industries related to steel will be beneficial to our manufacturing industry."
AUS_us_vs_them: "Us Vs Them Mentality"
AUS_expand_textiles_and_glass_industry: "Expand Textile and Glass Industry"
AUS_expand_textiles_and_glass_industry_desc: "We have one of the largest consumer industries in Europe. In order to further grow our economy, we will utilize this to our advantage and create a monopoly."
AUS_domestic_industry: "Strengthen Local Manufacturers"
AUS_domestic_industry_desc: "Local manufacturers haven't been focused upon enough lately, so investments are urgent. This will not just improve the heartland but also be in the interest of many German nationals that need attention just like troublesome minorities."
AUS_secure_eastern_minorities: "Secure the Minorities of the East"
AUS_limit_czech_authority: "Limit Authority of the Lower Parliaments"
AUS_dissolve_bohemian_diet: "Dissolve the Bohemian Diet"
AUS_dissolve_bohemian_diet_desc: "Continuous stripping of power from the Bohemian Diet has brought only partial results. According to our advisors, this is not enough. Czechs have been one of the main users of obstructionist methods, and for that a price comes. All warnings have been ignored, and due to the uncooperative situation, we are forced to dissolve their diet, which gives us so many unnecessary headaches."
AUS_peace_and_prosperity_program: "New Industrial Powerhouse"
AUS_peace_and_prosperity_program_desc: "While we could focus on military industry, in order to satisfy civilian demands and increase our production output, we will focus on civilian industry and technology for the time being."
AUS_supress_social_democrat_organizations: "Suppress Social Democratic Clubs"
AUS_further_escalate: "We may be able to §REscalate§! the situation if the Balkan War continues."
AUS_reject_democratization: "Reject the Plague of Democratization"
AUS_reject_democratization_desc: "The Emperor had the generosity to create the Imperial Council, appeasing advocates for liberalization. What has the Imperial Council devolved into? Pointless bickering, obstructionism, and extreme partisanship. We can't allow this broken institution to have such a large role in governing Austria."
AUS_salveageable_institution: "A Salvageable Institution"
AUS_build_class_consciousness: "Build Class Consciousness"
AUS_mandate_saftey_equipment: "Mandate Basic Safety Equipment"
AUS_joint_ventures_with_cartel: "Set Favorable Commerce and Toll Rates"
AUS_salveageable_institution_desc: "The Imperial Council has been utilized as a weapon by obstructionist groups to bring the government of Austria to a halt, which must be addressed. The Imperial Council, reformed to be a more productive instrument, should be able to have an excellent working relationship with the Minister-President."
