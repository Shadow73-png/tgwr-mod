ww1_austria_quests.2.t: "Land Fort construction project in [AUS_fortification_global.GetName]"
ww1_austria_quests.2.d: "The Imperial and royal War Ministry has greenlit fortified posts in [AUS_fortification_global.GetName]. The thing is, holding the border isn't just about weapons, it's a clear signal to enemies and citizens. So the project has to finish on time."
ww1_austria_quests.2.a: "Begin construction."

ww1_austria_quests.4.t: "Expanding Armaments in [4.GetName]"
ww1_austria_quests.4.d: "The preperation of Cisleithania for a future conflict is the stated number one objective for [AUS_GetMinisterPresident] since his ascension to the position of Minister-President. Now, talks have began with companies in Vienna to expand armament production in the state, giving [AUS_GetMinisterPresident] a perfect opportunity to push his agenda by aiding the expansion of military industry in Vienna as much as possible."
ww1_austria_quests.4.a: "Let's get it going!"

ww1_austria_quests.5.t: "Restoring Economic Confidence"
ww1_austria_quests.5.d: "Recent catastrophes have struck the population hard, with food riots, labor riots, and even political assassination attempts taking place in the last few months, all spiraling from a simple bad harvest in the summer of 1910. These events have made investors quite catious to invest in Austria for now. Restoring trust in the government will allow us to consolidate our recovery and silence those who would use our misfortunes against us. We can do this either through ensuring Austria's political situation is stable and running smoothly, or ensuring our governmental policies are ripe for company profits to soar."
ww1_austria_quests.5.a: "What are we waiting for, people?"

ww1_austria_quests.6.t: "Pushing the Public Against Democracy"
ww1_austria_quests.6.d: "The Imperial Council refuses to go all in on strengthening the security of our empire, focused instead on petty demands for minority autonomy and welfare. The public must realize the Imperial Council has been hijacked by elitist minority groups and radical socialists who would see the death of our empire with glee. If we can convince them of this, another hurdle in our plans to destroy democratic checks and balances will be eliminated." #idk im larping rlly hard
ww1_austria_quests.6.a: "Los geht's!"

ww1_austria_quests.7.t: "Containing the Socialists"
ww1_austria_quests.7.d: "Victor Adler's Social Democrat Party grow bolder by the day, stirring discontent among the factory workers and the urban poor. Their internationalist rhetoric is a poison to our Imperial unity. The government must act through legislation, surveillance, and where necessary, direct suppression to ensure that the red tide does not sweep away what centuries of absolute Habsburg rule have managed to construct."
ww1_austria_quests.7.a: "They will find no quarter here."

ww1_austria_quests.8.t: "Ready the Public Towards War"
ww1_austria_quests.8.d: "The drums of war bang louder across Europe, yet the Austrian public remains restless and uncertain. Unacceptable! Before the Empire can commit to the field of battle, the Austrian populaces' hearts must be stirred... like a Rindsuppe. The press, the military parades, the nationalist leagues, they all must be turned toward a single purpose: to make the eagles of Austria proud, and to answer our call! To carry the flame and fight for our name!"
ww1_austria_quests.8.a: "Gott erhalte Franz den Kaiser!"

ww1_austria_quests.9.t: "Appeasing the Romanians"
ww1_austria_quests.9.d: "With growing instability and anti-Imperialism in the Balkans and the explosion of the powderkeg, our foreign minister, Ferdinand von Trauttmansdorff, decided it was our time to appease the Romanians in order to keep what fragile alliance we have going stable."
ww1_austria_quests.9.a: "A delicate hand is still a firm one."

