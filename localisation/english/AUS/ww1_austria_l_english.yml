AUS_explain_formula_tt: "The lower your minority relations get, the bigger debuffs you obtain! Your average loyalty will affect your political power gain and your stability, the Bohemian modifier will affect your military industry's performance and the eastern minorities will affect your consumer goods factor.\n\n§LHungary can also affect minority relations. The lower the minority loyalty, the higher chance of a collapse.\n\nCroat, Slovene and Serb loyalties are combined into the Southern Slav loyalty.\n\nAustrian Relations with Bosnia are viewable in the focus tree.§!"
