AUS_the_natural_place_of_women: "Stand Against the War on Motherhood"
AUS_rubber_stamp_the_conservative_agenda: "Rubber Stamp the Conservative Agenda"
AUS_rubber_stamp_the_conservative_agenda_desc: "Conservatives in parliament have a vast agenda already planned out. Now, with a friendly Minister-President, we should be able to quickly pass the bulk of this agenda and satisfy conservatives in parliament."
AUS_appeal_to_rural_farmers: "Appeal to Conservative Rural Farmers"
AUS_restore_business_confidence: "Restore Business Confidence"
AUS_restore_business_confidence_desc: "Businesses were put off by the chaos caused by the rise in food prices at the start of 1911. Now, with a new government and the situation put behind us, we should try and re-attract these businesses."
AUS_desperate_coalition_building: "Build an Ideological Coalition"
AUS_new_mobilization_laws: "Crack Down on Draft Exemptions"
AUS_deal_with_unions: "Anti-Union Legislation"
AUS_better_the_devil_you_know: "Conservative-German Nationalist Alliance"
AUS_disrupt_the_right: "Oppose Regionalist Parties"
AUS_disrupt_the_right_desc: "Regionalist parties in the Imperial Council are increasingly obstructive and destructive to our empire. We need to combat the influence of these parties, both fighting their tactics in parliament and strangling their support amongst the people."
AUS_the_poison_of_nationalism: "Ameliorate the Poison of Nationalism"
AUS_the_poison_of_nationalism_desc: "Nationalism is milk and honey to illiterate, pretentious folk of the little nations to the southeast of our Empire. They are unaware of the complexities and nuances of achieving peace and prosperity instead of air-headed expansionism under quasi-historical claims. The same mindset is unfortunately in the minds of many ethnic minority groups inside our borders. We cannot influence foreign nationals much, but our own people have to be reached out to. This commonfold's nationalism must be explained as short-sighted thought for the sake of their own lives' betterment."
AUS_emperors_right_hand_man: "The Emperor's Right-Hand Man"
AUS_whip_together_army_bills: "A Mandate for the Army"
AUS_nationalism_and_militarism: "Nationalism And Militarism"
AUS_the_german_will: "The German Will"
AUS_invest_in_bosnia: "Approve Loans to Bosnia"
AUS_the_constitutionalist_dictatorship: "The Constitutionalist Dictatorship"
AUS_invest_in_bosnia_desc: "Bosnia is quite an underdeveloped region, perhaps explaining the locals' dislike for our rule. We should approve a series of loans to Bosnia to help develop their infrastructure, build new public buildings, and reinforce their police. This area was occupied for so long by the backwards Ottoman Empire that any investment to these lands should be met with utmost gratitude, as we believe so, at least."
AUS_reshuffle_intelligence_bureau: "Reshuffle the Intelligence Bureau"
AUS_reshuffle_intelligence_bureau_desc: "It is time to pass the annual set of promotions and, along with them, regular minor reshufflement of job positions in the state apparatus. Among uneventful changes this year, current Evidenzbureau Chief of Intelligence Alfred Redl is getting promoted to a minor military position, while to his position is appointed his apprentice Maximilian Ronge. Redl headed the modernization of the department, and we are very thankful for his service."
AUS_double_down_on_organization: "Address the Dummy Issue"
AUS_adapt_to_climates: "Specialized Winter Training"
AUS_new_logistics: "Expand the Horse Transportation System"
AUS_calm_down_germans: "Calm Down German Nationalists"
AUS_regulate_consumption_of_grain: "Regulate Consumption of Grains"
AUS_regulate_consumption_of_grain_desc: "Grain is arguably the most important resource for maintaining order in a nation. Also, it is lavishly spent on useless alcohols like beer. Many completely irrelevant goods demand grain in large quantities, which no sane person would allow being spent during wartime. Along with beer, many other unnecessary goods are too be banned from being produced as a needed measure for stabilizing our grain supplies."
AUS_invest_in_galacia_state: "Invest in [FROM.GetName]"
AUS_reform_local_gov_inspectorates: "Reform the Local Government in [FROM.GetName]"
AUS_place_state_under_military: "Place [FROM.GetName] Under Military Governance"
