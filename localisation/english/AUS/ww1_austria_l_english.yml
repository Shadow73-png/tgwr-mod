AUS_combat_southern_smuggling: "Combat Southern Smuggling Operations"
AUS_citizenship_for_muslims: "Recognize Islam as a Legal Religion"
AUS_citizenship_for_muslims_desc: "There is a large number of Muslims in our newly annexed condominium of Bosnia and Herzegovina. Considering the fact that we moved on from unnecessary bloodshed and forceful conversion, we must let these people somehow integrate into the society of our Empire and, more importantly, into our legal framework, which for now does not recognize or allow such practices. To mend relations with the local population in the area, we will recognize Islam as an allowed religion in the Empire."
AUS_inform_mp_mini_mechanic: "The current §YMinister-President of Cisleithania§!, §Y[AUS_GetMinisterPresident]§! is a §CReformist.§! If we wish, we may eventually be able to replace him with an §qAutocrat.§! Depending on the ideology of the §YMinister-President of Cisleithania§!, different focuses will be unlocked."
AUS_crackdown_on_galacia: "Propaganda Campaign in Galicia"
AUS_appoint_count_francis_thun: "Appoint Count Francis Thun Governor of Bohemia"
AUS_liberal_majority_in_pm: "§NNationalist§!-§mLiberal§! members make up a majority of the §YCisleithanian Parliament§!"
AUS_canal_projects: "Canal Projects"
AUS_canal_projects_desc: "Canals are an often-overlooked way of transport in most European countries. These canals open many possibilities such as: improving agriculture and industry, new trade routes, and after all, uniting our geographically challenging empire. The main project is centered on connecting the Danube and Oder, for which everyone between Hamburg and Budapest is more than happy to hear. With this, we will bring to an end a full decade of projects intended to connect the empire's waterways."
AUS_czech_school_reform_dec: "Reform Languages Used in Czech Schools"
AUS_reform_infinite_delay_system: "Reform the Infinite Delay System"
AUS_fight_illegal_strikes: "Crackdown on Illegal Strikes"
AUS_crackdown_on_bohemian_groups: "Crackdown on Bohemian Groups"
AUS_crackdown_on_bohemian_groups_desc: "The army will target Bohemian activist networks and propaganda cells. The campaign aims to disrupt their organizers while bolstering loyal Bohemian support for the Empire."
AUS_crackdown_on_polish_groups: "Crackdown on Polish Groups"
AUS_crackdown_on_polish_groups_desc: "The Armeeoberkommando has ordered a hard suppression of Polish agitation. The campaign will seek to coerce obedience and shore up loyalty among compliant Polish communities."
AUS_crackdown_on_ruthenian_groups: "Crackdown on Ruthenian Groups"
AUS_crackdown_on_ruthenian_groups_desc: "Ruthenian agitation will be met with a strict military campaign. This action is designed to intimidate their organizers and improve loyalty among more moderate Ruthenians."
AUS_crackdown_on_serbian_groups: "Crackdown on Serbian Groups"
AUS_crackdown_on_serbian_groups_desc: "Serbian networks will be suppressed and their leaders detained where possible. The crackdown should increase loyalty among Serb communities who choose order over unrest."
AUS_crackdown_on_croatian_groups: "Crackdown on Croatian Groups"
AUS_crackdown_on_croatian_groups_desc: "The military will hunt down Croatian agitators and break their regional support networks. This should yield a modest loyalty gain among loyal Croatians."
AUS_crackdown_on_romanian_groups: "Crackdown on Romanian Groups"
AUS_crackdown_on_romanian_groups_desc: "Romanian resistance cells will be targeted in a short, intense campaign. The goal is to weaken dissent and improve loyalty among pragmatic Romanian populations."
