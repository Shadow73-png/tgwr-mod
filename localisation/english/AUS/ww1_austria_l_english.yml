ww1_austriahungary.197.t: "Galician Poverty Greatly Reduced"
ww1_austriahungary.197.d: "The region of Galicia has been the poorest region of our empire for its entire history, and while its not exactly prospering, we've achieved genuinely incredible progress in the last few years with our extensive efforts to reduce poverty in Galicia. Farmers are generally getting by, most of the population now has access to an acceptable level of healthcare, and the technology in Galicia has caught up with the rest of the country. Of course, there's still progress to make, but Galicia is definitely heading in the right direction."
ww1_austriahungary.197.a: "A lovely success story!"
