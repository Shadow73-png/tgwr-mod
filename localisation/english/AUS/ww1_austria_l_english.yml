AUS_polish_loyalty_desc: ""
ww1_austriahungary.191.t: "Ruthenian-Jewish Electoral Alliance Formed"
ww1_austriahungary.191.d: "On both the national and local stage, Ruthenians and Jews have agreed to vote for their respective canidates in competitive elections where only one of their canidates has a realistic shot at winning, hoping that combining their votes can increase their influence in parliament, which is currently very low compared to the proportion of their population in the empire. Their low reprensentation is at the gain of the Poles, who despite making up much less population percentage, dominate in the local Galacian diet and have more seats in the Imperial Council, due to unrfavorable laws for Ruthenian peasants favoring the richer land owning Polish class."
AUS_storm_the_galician_diet: "Storm the Galician Diet"
AUS_promise_minimum_seats_for_ukranians: "Promise a Minimum Seat Count for Ukrainians"
AUS_dysfunctional_galician_diet: "Dysfunctional Galician Diet"
ww1_austriahungary.193.t: "Ruthenians Take Down Galician Diet"
AUS_done_ruthenian_demands: "Has Fufilled Ruthenian Demands"
ww1_austriahungary.193.d: "Learning from the Czechs, Ruthenians have made the Galician Diet completely non functional, loudly drumming during votes and killing legislation through obstructionist tactics to protest the lack of reprensentation and the unfair voting laws that have disenfranchised Ruthenians for far too long."
ww1_austriahungary.193.a: "They really went there!"
ww1_austriahungary.194.t: "Austria Offers Sale of Submarines"
ww1_austriahungary.194.d: "Austria has offered us the sale of their U-7 class submarines being constructed by Germaniawerft in Kiel as the submarines cannot be delivered to Austria due to the outbreak of war. The total amount of submarines are 5 of the Austrian U-7 class, equipped with modern enough torpedoes and engines, although they will be brought into our navy as the U-66 class."
ww1_austriahungary.194.a: "Of course, a great deal!"
ww1_austriahungary.194.b: "We're not interested"
ww1_austriahungary.195.t: "Germany Accepts Submarine Deal"
ww1_austriahungary.195.d: "Germany has accepted to purchase our submarines under construction in their country by Germaniawerft as the possibility of transferring them to Austria has been lost with the outbreak of war. They will be brought into the German navy as the U-66 class."
ww1_austriahungary.195.a: "A great deal!"
ww1_austriahungary.196.t: "Germany Rejects Submarine Deal"
ww1_austriahungary.196.d: "Germany has rejected to purchase our submarines under construction in their country by Germaniawerft, which were intended to be used by our navy but the outbreak of war made the transfer impossible. There is no clear answer to what will happen to the submarines as they sit on the docks of Kiel."
ww1_austriahungary.196.a: "Unfortunate"
