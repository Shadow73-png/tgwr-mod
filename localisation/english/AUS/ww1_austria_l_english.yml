ww1_austriahungary_war.9.t: "Formation of the Polish Supreme Committee"
ww1_austriahungary_war.9.d: "Polish political parties, together with some collaborators in Russian Poland, have formed the Polish Supreme Committe, a body intended to help govern a future autonomous Polish state in the Hasburg realm. In addition, they've began organizing legions of Polish volunteers to assist in the fight. They will undoubtedly provide our cause much legitimacy amongst the Poles, and their military units should provide us notable support."
ww1_austriahungary_war.9.a: "We will liberate Poland together!"
