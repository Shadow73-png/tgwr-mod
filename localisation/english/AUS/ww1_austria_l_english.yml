ww1_austriahungary.179.d: "A local concentrated community of Jews in our empire have had enough of antisemitic policy and culture in Austria, packing their bags to leave somewhere else. This is likely to open up some jobs for locals in the region, although the loss of a generally more educated and skilled group will hurt the local economy. "
ww1_austriahungary.179.a: "Their jobs belong to true Austrians!"
ww1_austriahungary.180.t: "Local Jewish Community Emmigrates in Mass"
ww1_austriahungary.180.d: "A local concentrated community of Jews in our empire have had enough of antisemitic policy and culture in Austria, packing their bags to leave somewhere else. This is likely to open up some jobs for locals in the region, although the loss of a generally more educated and skilled group will hurt the local economy. "
ww1_austriahungary.180.a: "Their jobs belong to true Austrians!"
ww1_austriahungary.181.t: "Increasing amount of food shortages"
ww1_austriahungary.181.d: ""
ww1_austriahungary.181.a: "This isn't good... don't worry the war will be over soon!"
ww1_austriahungary.182.t: "Purging the Deeply Entrenched Church"
ww1_austriahungary.182.d: "With the Christain Social Policy falling from power, a block built on distrust of the church has taken power in a country where the church has some of the greatest levels of influence over the state of the nation found in any European country. From education to common law, many reforms are needed.\n\nHowever, the christain conservatives in Austria are likely to fight tooth and nail to stop us. Going too far in our attempts to reform the power of the church may lead to mass civil unrest, so caution is advised."
ww1_austriahungary.182.a: "The rest of Europe figured this out decades ago!"
ww1_austriahungary.183.t: "The 'Camarilla' Advises Extreme Caution About the New Social Democrat Government"
ww1_austriahungary.183.d: "Many Austrian elite close to the Emperor are extremely wary of our government, seeing us as a threat to their insitutional power. They're lobbying hard to Franz Joseph to see our government kicked out, and a conservative minister president appointed, who would then use article 14 decrees to bypass the social democratic coalition in parliament. Franz Joseph, to his credit. is committed to giving our government an honest chance. If we can avoid outright angering the Emperor or making him see us as a threat to Austria's national security, we should be perfectly fine."
ww1_austriahungary.183.a: "Who cares about the tears of a bunch of junkers!"
ww1_austriahungary.184.t: "Worsening food situation across the nation"
ww1_austriahungary.184.d: "Across the nation food prices have been rapidly rising due to the war and loss of agricultural production, and the population is getting concerned. They no longer see the war ending any time soon, and are demanding that price caps on food be introduced to halt the rapidly rising prices of food."
ww1_austriahungary.184.a: "Calm down, this will all be sorted!"
ww1_austriahungary.174.t: "Czech Groups Begin Playing Their Hand"
ww1_austriahungary.174.d: "The 1911 Imperial Council elections saw bohemian interest groups gain greatly, hoping to push for reforms giving Bohemia more autonomy and keeping the Bohemian language and culture distinct and strong. The conservative majority in the council, apathetic to pushing any changes to the status of Bohemia, have lead to the Czechs taking new measures. They're bringing up demands in every Imperial Council session, delaying governance and annoying many. In the Bohemian Diet, the German groups in Bohemia have began to clash with Bohemian clubs, leading to the Bohemian Diet becoming more and more broken. With the Imperial Council unlikely to push any reforms, things may continue to get worse."
ww1_austriahungary.174.a: "Not a big deal in the grand scheme of things"
ww1_austriahungary.109.t: "Obstructionist Crisis"
ww1_austriahungary.109.d: "With relations between the Minister-President and members of the Imperial Council, especially nationalist and social democratic factions, hitting extreme lows, opposition members of parliament are resorting to simply outright taking the legislature captive, refusing to pass legislation until certain concessions are made. It shows their true colors: they failed to secure a majority last election, and are now committing to destroying the government elected by the people. With their demands being unacceptable, the situation is unlikely to resolve itself through negotiations. Yet, letting a group of agitators, marxists, and anarchists hold the peoples parliament hostage is unacceptable, and may give us the justification to turn to extreme measures. "
ww1_austriahungary.109.a: "Well, they're sort of forcing us to do something drastic here!"
ww1_austriahungary.148.t: "Körting Disaster"
ww1_austriahungary.148.d: "On the morning of 20 June 1914 in the eve of the war, our M.III Körting exploded in friendly colision while on in its way to Königsberg. Entire crew diet along with the reckless pilot of Farman F.20 biplane that crashed into M.III Körting. Ernst Flatz, pilot of the Farman, according to witnesses flew in circular patterns around the airship which he did not manage to identify as our own! Press visited crash site already in the afternoon, sparking media frenzy. This airship was first airship built and produced by Austrian engineers, also being one of its kind. Due to size of our arsenal many gruesomely joke that we have been decimated by our own hand. News about this event are spreading like wildfire and it might be too late to save our grace..."
ww1_austriahungary.148.a: "This is outrageous!"
ww1_austriahungary.149.t: "Biplane-Airship Crash in Austria"
ww1_austriahungary.149.d1: "This morning, Austrian airship M.III Körting crashed during a military training exercise with a Farman F.20 Biplane. Pilot Olt. Ernst Flatz, who flew the Farman, is being blamed for the crash as he was known for his recklessness."
ww1_austriahungary.149.d2: "This morning, Austrian airship M.III Körting crashed during a military training exercise with a Farman F.20 Biplane. Pilot Olt. Ernst Flatz, who flew the Farman, is being blamed for the crash as he was known for his recklessness. It looked like he was simulating an attack and began flying in circular patterns around the airship and crashed into its rubber surface. The plane crashed and the airship burst: none of the crew from the Farman biplane to the Körting airship survived their following crashes."
ww1_austriahungary.201.t: "The Party of Moderate Progress Within the Bounds of the Law"
ww1_austriahungary.201.d: "A new party is gaining a small amount of traction in Bohemia. Founded by Jaroslav Hasek, his party manifesto immediately raises eyebrows to all voters. The party calls for:\nThe reintroduction of slavery\nThe nationalization of janitors (similar to how it is in Russia, where every janitor is simultaneously a police informer.)\nThe rehabilitation of animals.\nThe institutionalization of feeble-minded MPs.\nThe reintroduction of the Inquisition.\nJudicial immunity for priests and the Church (In cases where a schoolgirl is deflowered by a priest.)\nAnd last but certainly not least, the mandatory introduction of alcoholism.\n\nThe party seems extremely bizare at first glance, yet its intentions are revealed at a deeper look. The party serves to mock the conservative order in Bohemia, where parties are seen as not advocating for real change, especially amongst the extremely moderate Bohemian social democrats. Its hoped by Jaroslav Hasek that this party can compete in the upcoming elections to ride a wave of discontent from a broad coalition of radicals in the Bohemian political spectrum that don't fit what many view as cautious and conservative parties."
ww1_austriahungary.201.a: "Their form of protest is rather odd"
ww1_austriahungary.149.a: "Ok"
ww1_austriahungary.99.t: "Russian-Serbian Ultimatum"
ww1_austriahungary.99.d: "Our seizure of Taslica has resulted in a diplomatic outrage from Serbia, who has now called their real master, Russia, to back them up. Russia and Serbia are demanding we abandon Taslica immediately, or else it will be considered an attack on Serbia."
ww1_austriahungary.99.a: "Maybe Germany can talk some sense to these hot heads?"
ww1_austriahungary.99.b: "Alright, alright. We'll withdraw."
ww1_austriahungary.95.t: "Serbia Remains Quiet"
ww1_austriahungary.96.t: "Serbia Requests We Mediate Dispute With Austria"
ww1_austriahungary.96.d: "Austrian troops last week occupied a strip of land that is dejure Ottoman which would connect Montenegro and Serbia to a common border upon a victory of the Balkan League against the Ottoman Empire. Serbia, claiming this land for themselves, is requesting we help force Austria to withdraw. What should we do?"
ww1_austriahungary.96.a: "Austria needs to backdown"
ww1_austriahungary.96.b: "This would risk war with the Central Powers. We can't."
ww1_austriahungary.95.d: "Our seizure of Taslica was expected to provoke a response from Serbia, yet for now Serbia has not responded at all. They seem to have accepted our seizure of the region, clearly knowing they'd get their teeth knocked out if any real confrontation between our two armies occured."
ww1_austriahungary.113.t: "Galician Oil Production Crashes"
ww1_austriahungary.113.d: "With our succesful exploitation of Galician Oil, we've managed to become a top ten oil producer region in the world, accidentally causing many slumps in oil industry prices over the years. Unfortunately, with recent oil worker strikes and many other factors, our oil production has crashed. To revitalize this industry, we may need to use the methods of “protectionism“ to keep the oil flowing."
ww1_austriahungary.113.a: "Disaster!"
ww1_austriahungary.95.a: "Well, we'll take the win"
ww1_austriahungary.94.t: "Austria Seizes Taslica"
AUS_destroy_power_of_the_church: "Destroy Power of the Catholic Church"
AUS_autonomy_and_reconciliation: "Autonomy and Reconciliation"
AUS_reform_the_census_system: "Universal Personal Autonomy"
AUS_concessions_to_the_croatians: "Slavic Control of Slavic Administation"
AUS_universal_language_rights: "Universal Language Rights"
ww1_austriahungary.94.d: "Austrian troops have marched into Taslica, a strip of land where an offical border with Montenegro would be shared after the conclusion of the Balkan War, and seized it for themselves. They claim its a temporarily occupation to increase their security, yet this move is a clear act of aggression against us. How should we respond?"
ww1_austriahungary_war.1.t: "Political Parties Agree to Truce"
ww1_austriahungary_war.1.d: "Austrian politics have seen a great battle between the three major coalition groups in the Imperial Council. Yet, today the social democrats, social christians, and German nationalists have all agreed to put their differences aside, for now, and collaborate on the war effort. Worth noting, is that many Social Democrat politicians are at best shaky in their support for the war, and we risk a revolt in the party if things last longer then expected. Still, the agreement between the three parties to not fight eachother during the war should help our domestic political situation greatly."
ww1_austriahungary_war.1.a: "This conflict is above petty political disputes!"
ww1_austriahungary_war.12.t: "Special Status for Dalmatia"
ww1_austriahungary_war.12.d: "Dalmatia is home to many south slavs, of which the government in Vienna is deeply skeptical of. Worried about Serbian attempts to stir unrest in the region as well as slavic organization attempts to infiltrate the region. To ensure things are under control, the military has convinced the emperor to sign a special decree on the status of Dalmatia, allowing the military the right to implement a curfew, bypass some civil rights, and racially profile Slavic citizens. Its hoped that this will ensure stability in the southern region of the empire."
ww1_austriahungary.94.a: "Maybe Russia can back us up here?"
AUS_arbeiterbildung: "Arbeiterbildung"
ww1_austriahungary.94.b: "We can't win a war with Austria, let's back down"
ww1_austriahungary.88.t: "Hötzendorf Suggests Occupying Taslica"
ww1_austriahungary.88.d: "Conrad Hötzendorf, chief of the Austrian army, has suggested we occupy Taslica, the strip of land that is dejure Ottoman seperating Serbia and Montenegro. He claims that Serbia and Montenegro securing a border with eachother would strengthen relations between both states too much, and will increase the chance that Serbia annexes Montenegro. It's no secret many in Serbia wish for a south slavic state in the Balkans, and Montenegro would be the natural first region to join this project. The unification of these two countries would strengthen Serbia significantly, and risk rallying rebellious slavs in our empire even more."
ww1_austriahungary.88.a: "Give the go ahead!"
ww1_austriahungary.88.b: "This would be an insane escalation!"
ww1_austriahungary.144.t: "Parliament Attempts to Assert Itself"
ww1_austriahungary.144.d: "As we continue to trample over weak democratic institutions, members of the Imperial Council are attempting to stop us. Rebellious factions in parliament are attempting to force the following of regular democratic procedures and assert their own legal rights, much to our dismay. Although we're clearing beating democracy, its not going down without a fight. "
ww1_austriahungary.144.a: "Their resistance is futile!"
ww1_austriahungary.77.t: "An Active Empire"
ww1_austriahungary.77.d: "As an empire with 2 sovereign halves, each with their own complicated governance structures, political issues, and societal tensions, the Austro-Hungarian empire certainly doesn't bore those who govern it to say the least. To ensure the empire prospers into the next decades, we'll need to pay attention carefully."
ww1_austriahungary.77.a: "We will get it done!"
ww1_austriahungary.37.t: "Unrest in Vienna"
ww1_austriahungary.40.t: "The Uphill Battle"
ww1_austriahungary.41.t: "Bohemian Realpolitik?"
ww1_austriahungary.42.t: "Defining the Narrative"
ww1_austriahungary.42.d: "As elections get closer and closer, defining the narrative is becoming increasingly important for the three major parties. Conservatives are attempting to frame the election through social and religious issues, rallying Christians to their side, liberals are claiming they have the solutions to institutional problems that Austria faces, and social democrats are promising to fight for the common people."
ww1_austriahungary.42.a: "We need to secure the moral fabric of our country"
ww1_austriahungary.42.b: "We need a problem-solving government"
ww1_austriahungary.42.c: "We need a government that provides for the people!"
ww1_austriahungary.41.d: "As the liberal-nationalist coalition looks to have a good shot at winning a majority next election, some Czech nationalists are considering flipping their vote from local Bohemian nationalist political parties to the 'Deutscher Nationalverband'. Because the local parties have no chance at winning a majority in parliament, a vote for them could arguably be a waste, compared to voting for Deutscher Nationalverband, which may actually win. A Deutscher Nationalverband majority may be willing to compromise with Bohemian demands for language reform, by giving a special status to the Sudentenland, which would at least be better then the status quo."
ww1_austriahungary.41.a: "They're absolutely right"
ww1_austriahungary.41.b: "Nonsense, the Deutscher Nationalverband is mostly a German nationalist group"
ww1_austriahungary.40.d: "The SAO, being a socialist party with its primary support being the working class, is dealing with the reality of conservative governance. The Christian Social Party is pulling back no punches when it comes to their approach to organized labor, shutting it down whenever they can. It's shattering worker cohesion, and weakening the SAO's ability to spread support through organized labor."
ww1_austriahungary.40.a: "They were never going to have it easy"
ww1_austriahungary.37.d: "As the price of meat rises, unrest in Vienna is growing. The poor are taking it to the streets, expressing their anger at the economic situation and demanding that the government to do something. Protests are starting to get violent as hungry citizens take their grievances out on local authorities. It's having an impact on the general population, who are swayed by the message of the..."
ww1_austriahungary.37.a: "Conservatives who are promising law and order"
ww1_austriahungary.37.b: "Liberals who flaunt their extensive plans to improve the country"
ww1_austriahungary.37.c: "Social democrats who promise bread for all!"
ww1_austriahungary.50.t: "Czech Nationalist Parties Overperform"
ww1_austriahungary.50.d: "A notable excerpt from the recent elections to the Imperial Council is the overperformance of Czech nationalist parties. The Czech bloc has picked up numerous seats, increasing their influence over the Imperial Council, which may lead to more pressure for the Minister-President to help come up with a suitable compromise for the various demands Czech nationalists have. "
ww1_austriahungary.50.a: "I guess we can't kick this issue down the road much longer"
ww1_austriahungary.64.t: "A Question of Priorities"
ww1_austriahungary.64.d: "The main things being smuggled into Bosnia seems to be weapons and propaganda, both having their negative effects on Bosnia. While the weapon smuggling is obviously more dangerous on the surface, indeed many attempted assassinations are failing due to poor planning. In addition, there are worries that the propaganda campaigns may stoke further unrest. We must decide what we wish for border security to focus the most on."
ww1_austriahungary.64.a: "We must deal with the propaganda!"
ww1_austriahungary.64.b: "Isn't it obvious? Weapons of violence are more dangerous then some silly papers"
ww1_austriahungary.54.t: "[AUS.GetName] Reaches Out"
ww1_austriahungary.54.d: "[AUS.GetName] and their diplomats have approached us, offering us various treaties on commerce and legal assistance. Although our government is far from friendly with Austria, these treaties do seem mutually benefical and may represent a new approach Austria is taking to diplomacy. Perhaps we could all be friends? Or we could reject these approaches all together"
ww1_austriahungary.54.a: "This seems... rather reasonable"
ww1_austriahungary.54.b: "Hell no. It's a trick"
ww1_austriahungary.55.t: "[SER.GetName] Accepts Treaties"
ww1_austriahungary.55.d: "Our legal cooperation and commerce treaties have been accepted by Serbia, meaning they are now offically in effect. These are expected to benefit both of us and may open the door to future peaceful tolerance."
ww1_austriahungary.55.a: "Another sucess from Aehrenthal!"
ww1_austriahungary.56.t: "[MNT.GetName] Accepts Treaties"
ww1_austriahungary.56.d: "Our legal cooperation and commerce treaties have been accepted by Montenegro, meaning they are now officially in effect. These are expected to benefit both of us and may open the door to future peaceful tolerance."
ww1_austriahungary.56.a: "Another success from Aehrenthal!"
ww1_austriahungary.57.t: "[SER.GetName] Refuses Treaties"
ww1_austriahungary.57.d: "Serbia has outright rejected our proposed treaties of cooperation in various sectors. This refusal is a clear sign of their growing hostility and unreasonability, and we must adjust our diplomacy accordingly."
ww1_austriahungary.57.a: "Fools."
ww1_austriahungary.78.t: "Automatic Propaganda in Bohemia Ends"
ww1_austriahungary.78.d: "Our political power has fallen below the required amount, which has canceled the mission Spreading Propaganda in Bohemia. We can reactivate it when our political power is higher"
ww1_austriahungary.78.a: "Noted"
ww1_austriahungary.110.t: "Automatic Cooling of Tensions With Slavs Ends"
ww1_austriahungary.110.d: "Our political power has fallen below the required amount, which has canceled the mission Automatic Cooling of Tensions With Slavs. We can reactivate it when our political power is higher"
ww1_austriahungary.110.a: "Noted"
ww1_austriahungary.79.t: "Automatic Stabilization Effort in Slavic Territories Ends"
ww1_austriahungary.79.d: "Our political power has fallen below the required amount, which has canceled the mission Stabilization Effort in Slavic Territories. We can reactivate it when our political power is higher, to alleviate burden of governing such troublesome lands."
ww1_austriahungary.79.a: "Noted"
ww1_austriahungary.52.t: "Czechs Ramp Up Obstructionism"
ww1_austriahungary.52.d: "With the Minister-President actively tacking a stance against Czech parties, Czechs in parliament have began to intensify their obstruction. Bills not even related to education are having their votes canceled as Czechs walk out, only agreeing to votes on bills they favor. Although the Czechs are usually allowing bills to pass after large delays, its still beginning to make parliament non functional."
ww1_austriahungary.52.a: "In what world is this fair?"
ww1_austriahungary.58.t: "[MNT.GetName] Refuses Treaties"
ww1_austriahungary.58.d: "Montenegro has rejected our proposed treaties of cooperation in various sectors. This refusal is a clear sign of their growing hostility and unreasonability, and we must adjust our diplomacy accordingly."
ww1_austriahungary.58.a: "Fools."
ww1_austriahungary.53.t: "Czechs Begin Making Moves"
ww1_austriahungary.53.d: "With our explicit anti-Czech moves, Czechs in the Bohemian Diet have began making their own moves. They're testing boundries, passing several reforms aimed at achieving their demands they've failed to reach in the Imperial Council. It's leading to calls for the Minister-President to suspend the Bohemian Diet, or at least limit their authority."
ww1_austriahungary.53.a: "Is this even legal?"
ww1_austriahungary.63.t: "Spike in Black Hand and Young Bosnia Activity"
ww1_austriahungary.63.d: "The outbreak of war between Serbia and the Ottoman Empire has lead to a surge of Serbian nationalism both in Serbia and amongst Serbs in our country. This, combined with Serbian border security on our border being lower as their government prioritizes war with the Ottoman Empire, is leading to a large increase in smuggling campaigns from Serbia to Bosnia. Propaganda pieces, guns, and amunammunition are flooding into Bosnia, inflaming tensions and increasing violence in the region."
ww1_austriahungary.63.a: "A massive crackdown is needed!"
ww1_austriahungary.49.t: "The Struggle to Pass a Budget"
ww1_austriahungary.49.d: "A session to pass a new budget in the Imperial council has taken much longer then expected due to the obstruction of Czech nationalists, who clashed fiercly with the prefered budget from German nationalists. The budget was eventually passed days after it was expected to, with extensive intervention from the Minister-President needed. "
ww1_austriahungary.49.a: "Not good"
ww1_austriahungary.62.t: "Socialist Marches in Vienna"
ww1_austriahungary.62.d: "Our recent anti-socialist policies have lead to socialist groups organizing marches in their strong points, particularly in Vienna. They're rallying support from workers, who see the government's policies as oppressive. Although they seem relatively harmless so far, they protests aren't a great look."
ww1_austriahungary.62.a: "A bunch of nobodies"
ww1_austriahungary.60.t: "Czechs Breakdown Reichsrat"
ww1_austriahungary.60.d: "The Czechs, previously holding back the passage of bills, have began outright refusing to let anything pass. They're dodging votes, instead giving long speeches about the importance of education reform in Bohemia. It's leading to a Reichsrat that can't function, meaning drastic measures are probably needed."
ww1_austriahungary.60.a: "They can't accept that their ideas aren't popular!"
ww1_austriahungary.51.t: "Massive Investmnents From Vienna"
ww1_austriahungary.51.d: "The Austrian government in Vienna have approved large scale investments into Bosnia, which are expected to help us construct new schools, roads, police, and help us invest in local industries."
ww1_austriahungary.51.a: "How kind of them!"
ww1_austriahungary.35.t: "Men Without a Home"
ww1_austriahungary.35.d: "German right-wing nationalism has been on the steady decline in Austria, usually performing quite poorly in elections. With the monarchy generally opposing all forms of nationalism, including German nationalism, they've felt ostracized from the politics of the Christian Social Party, the largest right-wing party in Austria, closely aligned with the Habsburg Crown. The liberals in recent years have been forming coalitions with some German nationalists, yet these German nationalists are usually not right-wing at all, instead agreeing with most of the ideas of the liberals. Small in numbers, right-wing German nationalists know they'd airball at gaining a substantial number of seats in parliament, yet their group is large enough that throwing the towel behind one party could help boost it, and increase their leverage within that party. The question is what party to go with."
ww1_austriahungary.36.t: "Liberals Increase Support in Bohemia"
ww1_austriahungary.36.d: "As conservatives block substantial reforms in Bohemia, and the SAO fails to produce a comprehensive plan for the future of Bohemia, the Liberals are seeing a surge in support for their policies. They've called for the drawing of new boundries based on ethnic lines in Bohemia while reforming schools to include the Czech language."
ww1_austriahungary.48.t: "Anti-Imperial Propaganda Reaches Romanians"
ww1_austriahungary.48.d: "The Romanian government in Bucharest have launched anti-Austrian propaganda campaigns all over Transylvania in order to get our Romanian minority weakened opinions of the country."
ww1_austriahungary.48.a: "Stay out of this."
ww1_austriahungary.45.t: "Forward with Industrial Production"
ww1_austriahungary.45.d: "Our choice to concentrate on civilian industry is not a small one. Even though we will be missing out on weapon manufacturing, many more bonuses come from impoving civilian industrial workplaces by making our Empire the powerhouse of Eastern Europe."
ww1_austriahungary.45.a: "All aboard!"
ww1_austriahungary.36.a: "That certainly increases their odds of winning the next election"
ww1_austriahungary.35.a: "At least the liberals pretend to care about us"
ww1_austriahungary.35.b: "The Christian Social Party will protect some German values"
ww1_austriahungary.34.t: "Relations between the German SPD and the Austrian SAO"
ww1_austriahungary.34.d: "Despite Austria-Hungary and Germany having very close relations, and both the SPD and the SAO being dominated by German figures, the SPD and the SAO do not collaborate extensively. With elections coming up in Austria, many in the SAO wish to employ the SPD's help. Utilizing the SPD could improve the SAO's electoral message and give the SAO more resources to campaign with, yet some in the SAO do not believe working with a foreign party is a good idea."
ww1_austriahungary.34.a: "German and Austrian politics should remain seperate"
ww1_austriahungary.34.b: "Collaboration between two German Social Democrat parties just makes sense"
ww1_austriahungary.21.t: "1911 Cisleithanian Legislative Election Results - Deutscher Nationalverband Secures Majority"
ww1_austriahungary.43.t: "1911 Cisleithanian Legislative Election Results - Sozialdemokratische Arbeiterparte Secures Majority"
ww1_austriahungary.43.d: "Elections to the Austrian legislature have concluded admist unrest from meat shortages, with the incumbent coalition of old school conservatives being kicked out by a social democrat coalition group. The group is expected to push hard for labor reform as well as new welfare methods. With the loss of a mandate, Richard Bienerth is expected to resign his position soon, with a new Minister President replacing him being decided by the king."
ww1_austriahungary.43.a: "The people have sung..."
ww1_austriahungary.44.t: "1911 Cisleithanian Legislative Election Results - Christian Social Party Maintains Majority"
ww1_austriahungary.44.d: "Elections to the Austrian legislature have concluded admist unrest from meat shortages, with the incumbent coalition of old school conservatives sucessfully holding onto a narrow majority. The group is expected to continue the status quo, accepting limited reforms where appropriate. With the election over, Richard Bienerth is expected to resign his position soon to allow a new Minister-President, with a new Minister-President replacing him being decided by the king."
ww1_austriahungary.44.a: "The people have sung..."
ww1_austriahungary.21.d: "Elections to the Austrian legislature have concluded admist unrest from meat shortages, with the incumbent coalition of old school conservatives being kicked out by a liberal-nationalist coalition group. Bohemia, already plagued with controversies of Czech locals wanting higher pay for teachers as well as more Czech language schools, is expected to have tensions rise even further with the addition of more Czech nationalists in parliament. With the loss of a mandate, Richard Bienerth is expected to resign his position soon, with a new Minister President replacing him being decided by the king."
ww1_austriahungary.21.a: "The people have sung..."
ww1_austriahungary.33.t: "Parties Begin Organizing Their Electoral Campaigns"
ww1_austriahungary.33.d: "Though still more than a year away, the Social Democrats, Liberals, and Conservatives have all begun organizing their campaigns for elections to the imperial council. The election looks to be quite competitive, with the Social Democrats, and to a lesser extent the Liberals, having a solid shot at ousting the ruling Conservative coalition from power, securing a majority themselves."
ww1_austriahungary.33.a: "Who will win?"
ww1_austriahungary.31.t: "Social Democrats Cause Riot in Parliament"
ww1_austriahungary.31.d: "Following general recent unrest, social democrat groups in parliament have began disrupting parliamenary procedures, demanding a variety of reforms. Although so far [AUS_GetMinisterPresident] has ignored the antics so far, their stunts are causing unwanted attention to their ideals and delaying the passage of important laws, meaning a response is needed."
ww1_austriahungary.31.a: "We need to do something about this..."
AUS_protect_the_mittelstand: "Protect the Mittelstand"

AUS_the_emperors_blessing: "Pivot to Non Minority Issues"
AUS_mantaining_the_harmony_of_the_empire: "Maintaining the Harmony of the Empire"
ww1_austriahungary.28.t: "Bohemia Issue Plagues [AUS_GetMinisterPresident]"
ww1_austriahungary.28.d: "The ascension of [AUS_GetMinisterPresident] has sparked new debates in parliament over the best solution for the Czech language and schooling question. Although trying his best, the Minister-President has faced no success in his attempts for parliamenary negotiations for a compromise between the two sides."
ww1_austriahungary.28.a: "Will this ever go away?"
AUS_unite_the_imperial_council: "Unite the Imperial Council"
AUS_sponsoring_agr_cooperatives: "Sponsoring Agricultural Cooperatives"
AUS_reform_laws_on_obstructionism: "Reform the Legality of Obstructionism"
AUS_anti_liberalism: "Defend Society From Liberalism and Decay"
AUS_agricultural_cooperatives: "Sponsor Agricultural Cooperatives"
AUS_destroy_the_elitist_culture: "Gebundene Wirtschaftsordnung"
AUS_destroy_the_elitist_culture_desc: "Wirtschaftsordnung, or \"economic order\" in English, are a set of rules that all governmental organizations, citizens, businesses and entrepreneurs must abide by. Establishing a clear order, a Gebundene Wirtschaftsordnung, will ease our transition to a more regulated economy, away from economic liberalism."
AUS_combat_the_appeal_of_the_social_democrats: "Soziale Marktwirtschaft"
AUS_implement_corporatism: "Implement National Corporatism"
ww1_austriahungary.23.e: "We'll bring back Paul Gautsch von Frankenthurn"
ww1_austriahungary.29.t: "Food Riots Continue"
ww1_austriahungary.29.d: "Just weeks after the ascension of [AUS_GetMinisterPresident], major riots have broken out in Austria proper. With meat prices still high from the rinderpest outbreak in the cattle industry, many Austrians are struggling to afford meat at all and are blaming the government."
ww1_austriahungary.29.a: "The Wiener Börse went up last week!"
ww1_austriahungary.30.t: "Conrad von Hötzendorf Suggests 'Pre-Emptive Strike' Against Italy"
ww1_austriahungary.30.d: "Franz Conrad von Hötzendorf, our army's best and leading commander, has been repeatedly requesting [AUS.GetLeader] to authorize an invasion of Italy, now busy with a war with the Ottoman Empire. Comrad has long rallied against the Italian alliance, claiming Italy provides little of value to the triple entente, and would stab Austria in the back at the first moment of convenience. It's a move nobody in the government is seriously considering, yet Aehrenthal, our top diplomat, has taken particular offense to the suggestion. He has claimed for some time now that having such an aggressive and impulsive man such as Conrad in charge of the army is undermining his diplomacy efforts with Austria's neighbors, with his words condradicting what is supposed to be the Austrian state's offical position of wanting peace, friendly relations, and stability across the world. Although [AUS.GetLeader] has excused a lot of Hötzendorf's inflammatory statements in the past, this incident combined with the pressure from Aehrenthal has lead to [AUS.GetLeader] to temporarily suspend Hötzendorf's position as head of the army."
ww1_austriahungary.30.a: "Don't you get it Conrad? You are the problem"
ww1_austriahungary.14.t: "Government Approves New Russian Agricultural Product Bans"
ww1_austriahungary.14.d: "As tensions with Russia rise over instability in the Balkans, particularly in Albania, [AUS.GetLeader] has approved a series of new trade restrictions with Russia to attempt to economically punish Russia for its actions in the Balkans, hoping to use the trade restrictions as leverage later. For now, the effect has been immediate in raising prices of goods across the empire, as our economy is already suffering from the recent drought."
AUS_nationalized_irma: "State Owned Railways"
AUS_ban_import_of_luxury_goods: "Ban the Import of Luxury Goods"
ww1_austriahungary.108.t: "Relations With Minister-President and the Imperial Council Collapse"
ww1_austriahungary.108.d: "The uncompromising nature of the new Minister-President has made him few friends in the Imperial Council, already fractures and divided from the elections in July 1911. Coalitions are struggling to be built, and the passing of laws is coming to a hault."
ww1_austriahungary.108.a: "What an utterly useless governmental body"
ww1_austriahungary.14.a: "Was it really wise of him to do that right now?"
ww1_austriahungary.46.t: "[FROM.GetName] Advantages [ROOT.GetAdjectiveCap] Grain"
ww1_austriahungary.46.d: "[FROM.GetNameDefCap] has applied preferential tariffs to our produce, which means that they have applied tariffs to other countries' agricultural exports in order to make our farm produce cheaper to purchase in Austrian markets. This is a huge win for us and it helps support our farmers in the fields, especially in grain and in cattle."
ww1_austriahungary.20.t: "Meat Shortages Collapse Support for Incumbent Parties"
ww1_austriahungary.20.d: "As the Austrian half of the empire prepares for new elections, the recent meat shortages are leading to backlash for the incumbent party. Currently, Austria is dominated by the Christian Social Party, however, a coalition of liberals and nationalists now seem poised to break the Christian Social Party's dominance over Austrian politics."
ww1_austriahungary.20.a: "The Emperor is the one who holds the real power!"
ww1_austriahungary.19.t: "Organized Labour Shows Signs of Division"
ww1_austriahungary.19.d: "Organized labor, strongest in the industrial regions of Bohemia and inner Austria, have enjoyed moderate cohesion in the past, united in an effort to improve workers conditions for all. With elections upcoming, fractures between the movement are beginning to show. Labor unions aligned with Czech nationalist and German nationalist organizations are struggling to cooperate, seeing eachother as enemies instead of comrades united behind the struggle for better working conditions."
ww1_austriahungary.19.a: "We need to exploit this as much as possible!"
ww1_austriahungary.19.b: "Well that's interesting"
ww1_austriahungary.18.t: "Strained Food Supply Chains"
ww1_austriahungary.18.d: "The drought, bans on Russian trade, and recent spikes in livestock infected with diseases have caused chaos to our supply lines. Now, with all of the pre-crisis meat supply being sold in shops, supply chains across the country are offically being hit quite hard. The price of meat has soared, with many shops reporting shortages."
ww1_austriahungary.18.a: "We'll have to weather this storm"
ww1_austriahungary.15.t: "Increasing Imports from Serbia"
ww1_austriahungary.15.d: "While we wait for the food price issue to figure itself out, many in the government think increasing imports from Serbia temporarily could help prevent dramatic price rises. The problem, however, is that Hungary's aggressive anti-Slav policies have dramatically strained relations between us and Serbia, and seeing our vulnerability right now, they're not likely to accept a new trade deal without Hungary reforming their treatment of Slavs in Croatia. Thus, we plan to offically request Hungary reform their treatment of Slavs, so we can secure a trade deal with Serbia."
ww1_austriahungary.15.a: "It's embarrassing, but we need this"
ww1_austriahungary.16.t: "Austria Requests we Reform Anti-Serb Policies"
ww1_austriahungary.16.d: "Seeing the recent issues in our agricultural industry caused by livestock diseases, Austria is seeking to increase Serbian agricultural imports temporarily to prevent food shortages. However, our anti-Serb policies in both trade and treatment of slavic citizens has lead Serbia to have zero interests in increasing trade with either us or Austria. Thus, Austria is requesting we make reforms so that trade with Serbia can be increased."
ww1_austriahungary.16.a: "Yeah, fat chance!"
ww1_austriahungary.17.t: "Hungary Refuses to Amend Anti-Slav Policies"
ww1_austriahungary.17.d: "The arrogant Hungarians have refused to reform their treatment of Slavs on their lands, effectively killing our idea of increasing Serbian imports to help alievate a food crisis. This, combined with recent trade restrictions on Russia, means that our ability to avoid a temporary food shortage is reliant on us having good luck."
ww1_austriahungary.17.a: "Damn Hungarians!"
ww1_austriahungary.46.a: "Thank you Austria, very cool!"
ww1_austriahungary.47.t: "Imperial Report on Protective Tariffs"
ww1_austriahungary.47.d: "A couple months ago, we applied the principle of protectionism and have placed protective tariffs on produce like cattle and grain from other countries in order to benefit Galician and Hungarian farmers. The cattle tariffs have proven to be efficient, with foreign cattle prices rising over 30% and making Imperial farmers in Galicia and Transylvania making much bank. Unfortunately, the wheat tariffs have been uneffective as we have been unable to outmatch foreign wheat production."
ww1_austriahungary.47.a: "Axe the grain tax!"
ww1_austriahungary.47.b: "Some say maybe we want more tariffs..."
ww1_austriahungary.27.t: "Poles Protest Building of new Canals"
ww1_austriahungary.27.d: "Poles across the nation have began lobbying heavy pressure for the government to abandon the creation of new canals across the Danube, stating it would harm their communities immensly. They claim Galicia's economy relies heavily on railway transport used for exporting grain, salt, and oil. If the Danube canal system was improved, trade would increasingly shift to waterways, bypassing Galician railways and destroying their economy. They're currently using parliamenary procedure laws to block the projects from getting funding, though [AUS.GetLeader] can use a royal decree to bypass their concerns if needed."
ww1_austriahungary.27.a: "If it matters that much to them, we'll abandon it"
ww1_austriahungary.27.b: "They can complain all they want, but it's going to be law!"
ww1_austriahungary.162.t: "The Zuckerkartell Protest"
ww1_austriahungary.162.d: "Our decision to move to a more state-managed, fair-for-all economy was controversial amongst few, except for those profiting at the head of the many Austro-Hungarian cartels. Many sugar cartels, Zuckerkartells, protested our decision, like the Hungarian businessman Sándor Hatvany-Deutsch, who stated that Austrian profits would be \"down 400, 500, 600 percent because of this action.\" Despite of the outrage from the businessmen, many peasants and workers seem to be taking it well, happy to see less coordinated monopolization in the nation."
ww1_austriahungary.162.a: "Sucks to be them"
ww1_austriahungary.163.t: "Cost of Living Unrest in Major Cities"
ww1_austriahungary.163.d: "As the Austria economy increasingly becomes consumed by monopolistic cartels, the cost of living for Austrians is rising. With little competition, cartels are raising prices across the board and making record profit at the expense of the average citizen. In addition, many jobs are being lost as cartels bully out smaller businesses and cause their collapse, with many of their workers finding no where else to go."
ww1_austriahungary.163.a: "Shut them down as quickly as possible!"


ww1_austriahungary.22.t: "Appointing Next Minister-President of Austria"
ww1_austriahungary.22.d: "With the current Minister-President, [AUS_GetMinisterPresident], resigning, [AUS.GetName] is now tasked with appointing a new Minister-President. The major consideration for [AUS.GetLeader] is the question of if the next Minister-President should be a liberal reformist with tendencies to try and appease minority groups, or an anti-democratic loyal autocrat who won't be afraid to show force if needed. Both have their benefits and drawbacks. Who should be appointed?"
ww1_austriahungary.32.t: "[AUS_GetMinisterPresident]'s Government Falls"
ww1_austriahungary.32.d: "The unrest from food riots and liberal obstruction has reached its climax with shots being fired into the Austrian parliament in an act of political terrorism. This has resulted in [AUS_GetMinisterPresident] deciding to resign, seeing the current political situation as vastly unfavorable. It's hoped the next Minister-President will be a breath of fresh air who will be qualified to handle the political crisis."
ww1_austriahungary.32.a: "Just months after he took office!"
ww1_austriahungary.23.t: "Picking the Ideal Canidate"
ww1_austriahungary.23.d: "While we've decided to appoint an autocrat as Minister-President of Austria, we must now decide the name. [AUS.GetLeader]'s advisors have brought a list of politicans that would fit the goals [AUS.GetLeader]'s agenda. Who should be appointed?"
ww1_austriahungary.23.a: "The obvious choice is Karl von Sturgkh"
ww1_austriahungary.23.b: "Heinrich Clam-Martinic would fit well"
ww1_austriahungary.23.c: "Max Hussarek von Heinlein seems to be a rising star"
ww1_austriahungary.22.a: "Let's look at the autocratic candidates"
ww1_austriahungary.22.b: "Let's look at the reformist candidates"
ww1_austriahungary.11.t: "Bienerth's Agenda"
ww1_austriahungary.11.d: "Since the passage of electoral reform in Cisleithania, tensions between Germans and Czechoslovaks have greatly been reduced, to the point where the current situation is actually quite stable. Still, issues remain as Czech nationalist parties seek greater autonomy, while German nationalist parties attempt to agitate the situation. Czechoslovak labor unions are also organizing in an attempt to extract greater concessions from us. Bienerth has sought to further stabilize the situation by passing a series of reforms across the Cisleithanian half of the empire to appease Czechoslovaks, Romanians, Poles, and Ruthenians."
ww1_austriahungary.11.a: "Limited concessions are probably for the best"
ww1_austriahungary.25.t: "A Tangible Solution to the Bohemian Troubles"
ww1_austriahungary.25.d: "With unrest increasing in Bohemia as Czech nationalists demand reforms to Czech schools, [AUS.GetLeader] has proposed that former Bohemian governor Count Francis Thun return to this position. Thun was able to negotiate several concessions to the Czechs the last time he held office, to the point that Germans in Bohemia lead the effort to see him removed from his position. It's hoped that he can also negotiate a solution to the Czech schooling question as well."
ww1_austriahungary.25.a: "He'd be a big help right now"
ww1_austriahungary.26.t: "Germans Shut Down Language Reform Attempt"
ww1_austriahungary.26.d: "Despite our attempts to introduce the Czech-requested reforms for the use of the Czech language in schools, German groups in parliament have sucessfully blocked our efforts, claiming it would harm German children's education as well as hurt the unity of the Austrian nation. Thus, for now, the attempts are dead."
ww1_austriahungary.26.a: "Well damn"
ww1_austriahungary.130.t: "Austria offers to mediate us and Bulgaria"
ww1_austriahungary.130.d: "While we certainly have our disputes, Austria offered to mediate our relations and to resolve any possible border disputes and conflicts between us and Bulgaria."
ww1_austriahungary.130.a: "Less conflict for everybody."
ww1_austriahungary.130.b: "This is a ploy!"
ww1_austriahungary.131.t: "Romanian-Bulgarian mediation sucessful"
ww1_austriahungary.131.d1: "We have managed to orchestrate negotiations with Romania! However, an entire formal alliance is impossible, due to our conflicting ideologies."
ww1_austriahungary.131.d2: "The Austrians have managed to orchestrate negotiations between Bulgaria and Romania, unexpectedly."
ww1_austriahungary.131.a: "Great!"

ww1_austriahungary.132.t: "Austrian Mediation fails"
ww1_austriahungary.132.d: "Romania has refused, causing a massive upheval in the Balkans, with outrage flourishing throughout."
ww1_austriahungary.132.a: "The Balkans are brewing..."

ww1_austriahungary.133.t: "The Fragile Alliance with Romania"
ww1_austriahungary.133.d: "The Balkan Powerkeg has exploded and Russia's interest in the region is only growing. They have mobilized a part of their army near Romania to prevent them from helping the Turks. Romania is a key opponent of our alliance to counterattack the Russian bear... but with Romanian Unionist Zeal growing and the agitation growing in Transylvania... well one can easily see where this is headed. It is necessary to encourage Romania to remain a faithful component of our alliance for our situation will be dire if so many possible fronts really open up."
ww1_austriahungary.133.a: "Motivate Hungary to appease Transylvanian Romanians"
ww1_austriahungary.134.t: "Austria urges us to Appease Transylvanian Romanians"
ww1_austriahungary.134.d: "The Balkan Powerkeg has exploded and Russia's interest in the region is only growing. They have mobilized a part of their army near Romania to prevent them from helping the Turks. Joint Minister Berchtold urges us to appease the Romanians in order to keep the fragile alliance in order and to please Germany...."
ww1_austriahungary.134.a: "Is the bare minimum not enough?"
ww1_austriahungary.173.t: "A New Prototype"
ww1_austriahungary.173.d: "An Austrian inventor, Gunther Burstyn, inspired by an American agricultural tractor with crawler tracks, has come up with a design of a battle machine, or as he calls it; a Motorgeschütz (motor-gun). The model that he sent us, when it was reviewed by our technicians, was described as... optimistic, to say the least. He described its intended use as support for infantry and supression of enemy machine gun fire. If he could get a contract with a commercial firm, we might consider using his design, but for now, he leaves empty-handed."
ww1_austriahungary.173.a: "Crazy..."
ww1_austriahungary.12.t: "Droughts Across Europe Hit us Hard"
ww1_austriahungary.12.d: "Droughts are hitting hard across Europe, and we're facing troubles. Our eastern farming provinces are seeing their food output dramatically fall and farmers go bankrupt. Food prices are rising across Europe, and are expected to continue to rise in the coming months."
ww1_austriahungary.12.a: "This could cause riots!"
ww1_austriahungary.13.t: "Livestock Exports Fall"
ww1_austriahungary.13.d: "The disease issue seems to be here to stay, with rinderpest recking havoc on the agricultural industry and our major trading partners temporarily suspending many of our exports. It's gotten to the point where a government response is needed to help eradicate disease and revive our exports."
ww1_austriahungary.13.a: "Our intervention is needed"
ww1_austriahungary.10.t: "Sucessful Alispan Reform in Hungary"
ww1_austriahungary.10.d: "The Hungarian government has offically removed several ineffective Alispans from office and agreed to pursue government reforms to make their government more efficient. Although not ground breaking, we can expect these actions to help improve our empire's government efficiency."
ww1_austriahungary.10.a: "Great!"
ww1_austriahungary_war.13.t: "Trade from the Adriatic Cutoff"
ww1_austriahungary_war.13.d: "The British, utilizing the royal navy, have implemented a total blockade on us and the Germans, attempting to starve us into submission. With the naval forces of the Central Powers being greatly outclassed by the Entente, we have little hope at contesting this blockade. Unfortunately, shortaged are inevitably going to develop. Hopefully, through strict rationing, and creative repurposes of goods, we can make this blockade hurt less."
ww1_austriahungary_war.13.a: "The people must tighten their belts"
ww1_austriahungary.9.t: "[AUS.GetLeader] Agrees to Leave the Situation to Us"
ww1_austriahungary.9.d: "Our objections to [AUS.GetLeader] over Austria's move to fire several Alispans has lead to him to agree to let us handle the situation ourselves, meaning he expects us to launch our own investigations to improve the efficiency of our government, yet he will not force it on us."
ww1_austriahungary.9.a: "Glad we resolved that"
AUS_import_hungarian_products: "Import Hungarian Products"
ww1_austriahungary.8.t: "[AUS.GetLeader] Ignores Our Concerns"
ww1_austriahungary.8.d: "Despite our attempts to stop it, several Hungarian Alispans have been fired in a move to make our empire's governments more effective. No matter how effective this may be, it clearly wasn't right for them to do it without our permission. Still, what's done is done, and we must move on."
ww1_austriahungary.8.a: "Do they even respect us?"
ww1_austriahungary_war.45.t: "Monthly Press Conferences"
ww1_austriahungary_war.46.t: "Social Democrats Rewrite Party Manifesto"
ww1_austriahungary_war.46.d: "In a strong show of support for the war, the social democrats have rewritten their pacifist party manifesto to be explicitly pro war, endorsing Austria Hungary's right to defend itself from aggression from the world and denouncing those who wish to undermine the unity of Austria Hungary. Although still including a call for peace as soon as possible as well as maximizing civil liberties, the pro war manifesto is proving to be deeply controversial in the party, with the left flank such as Friedrich Adler refusing to support the war and radicalizing"
ww1_austriahungary_war.49.t: "Friedrich Adler Murders [AUS.AUS_GetMinisterPresident]"
ww1_austriahungary_war.49.d: "The Social Democrats have been for the last 2 years supporting the war effort of the autocrat [AUS_GetMinisterPresident] in a complete betrayal of everything the social democrat movement is supposed to stand for. Friedrich Adler, one of the leaders of the left in the Social Democrats, has been agitating for the last 2 years against this policy. With the party refusing to reform, however, he's resorted to extreme measures. Sneaking into the dining hall of the hotel [AUS_GetMinisterPresident] was staying at, he pulled out a pistol and shot the man 3 times, then uttering the words 'Down with absolutism, we want peace!' before waiting for the police to arrive to let himself to be peacefully arrested.\n\nHis murder is undoubtedly going to shock the nation and shakeup the government, which may have to reform its measures to avoid continued leftist unrest. Time will tell how this great gambit from Adler pays off."
ww1_austriahungary_war.49.a: "Oh my!"
ww1_austriahungary_war.46.a: "How long can leftist unity last?"
ww1_austriahungary_war.48.t: "Decline of the Social Democrats"
ww1_austriahungary_war.48.d: "As the social democrats pursue a pro war course, the party is seeing a decline especially in youth membership. This is likely as pacifists and radical leftists are losing faith and support for the party that is seen as upholding the increasingly authoritarian state as well as a decline in living quality."
ww1_austriahungary_war.48.a: "The left radicalizing is no good for us"
ww1_austriahungary_war.45.d: "Part of the newly constructed media strategy of the military has included a highly controlled monthly press conference to try and spin the war in the most positive way possible. All reporters there will be very carefully vetted, with said reporters only being allowed to ask state approved questions with pre prepared answers. If sucessful, we should be able to convince most of the population we are winning, as long as people actually pay attention to them."
ww1_austriahungary_war.45.a: "Perfect!"
ww1_austriahungary.6.t: "[AUS.GetLeader] Moves to Fire Several Alispans"
ww1_austriahungary.6.d: "The parliament of the Austrian-half of the empire has approved a motion with [AUS.GetLeader]'s endorsement to fire several ineffective local leaders and implement local government reforms at the Varmegyek level. Although we have no legal authority to overturn the kings decision, we could lobby a protest to try and convince [AUS.GetLeader] to reconsider the move, which has brought anger from Hungarian nationalists who see it as Austrian overreach. We could also sit back and simply do nothing."
ww1_austriahungary.6.a: "There's no problem here"
ww1_austriahungary.6.b: "That's such an overreach!"

ww1_austriahungary.7.t: "[HUN.GetLeader] Objects to our Attempt to Dismiss Several Alispan's"
ww1_austriahungary.7.d: "Our attempts to reorganize several local Hungarian governments has been met with objection by [HUN.GetLeader], who's claimed that the move would be an overreach despite it unquestionably being legal. Still, going foward with the move may strengthen the support of Hungarian nationalists who could use the incident to claim we are not respecting Hungarias rights to independent governance. What should we do?"
ww1_austriahungary.7.a: "This was a completely legal move, give it the go-ahead"
ww1_austriahungary.7.b: "Well we suppose it could be shelved..."
ww1_austriahungary.1.t: "Minister of Finance resigns"
ww1_austriahungary.1.d: "Stephan Burián von Rajecz has decided to throw in the towel as position of Reichsfinanzminister as he was finding it increasingly difficult to reconcile the various ethnic factions."
ww1_austriahungary.1.a: "Sad stuff"
ww1_austriahungary.2.t: "New Foreign Minister Appointed"
ww1_austriahungary.2.d: "Kaiser [AUS.GetLeader] has appointed Stephan Burián von Rajecz as Minister besides the King, or 'a király személye körüli miniszter', but not without its difficulties. Many have described Stephan as intimidating, and was described as 'the type of man who listened motionless, almost glassy-eyed, without betraying the slightest expression, responding in machine-like dry way, school lecture without taking a breath.' The Kaiser had to think for a long time before giving the go for putting him in office."
ww1_austriahungary.2.a: "Scary"
AUS_stabilization_effort_in_bosnia: "Stabilization Effort in Slavic Territories"
AUS_double_stab_effort: "The cost of the decision £decision_icon_small §YStabilization Effort in Slavic Territories§! will be §RDoubled§!"
AUS_minus_10_stab_effort: "The cost of the decision £decision_icon_small §YStabilization Effort in Slavic Territories§! will be reduced by £pol_power §Y10 Political Power§! "

ww1_austriahungary.59.t: "Austria Seeks to Bolster Our Military Strength"
ww1_austriahungary.59.d: "We've received extremely positive news from Vienna: they intend to vastly increase military cooperation with us, and invest in our country to strengthen our military industry. They're giving us significant capital, parts of their military research, and favorable arms deals. These are all expected to significantly strengthen us."
ww1_austriahungary.59.a: "Wow! So generous of them!"
ww1_austriahungary.90.t: "[FROM.GetName] requests investment"
ww1_austriahungary.90.d: "[FROM.GetName] has contacted us in order to reach a deal where we would invest into building a civilian factory in their lands."
ww1_austriahungary.90.a: "Sure"
ww1_austriahungary.90.b: "They already have enough"
ww1_austriahungary.91.t: "[FROM.GetName] agrees to investment"
ww1_austriahungary.91.d: "[From.GetName] has agreed to an investment of a civilian factory."
ww1_austriahungary.91.a: "Great"
ww1_austriahungary.92.t: "[FROM.GetName] refuses to help out"
ww1_austriahungary.92.d: "The [FROM.GetAdjectiveCap]s have refused to invest in our lands."
ww1_austriahungary.92.a: "Unfortunate"
ww1_austriahungary.93.t: "The Galician Oil Crisis Ends"
ww1_austriahungary.93.d: "Thanks to tariffs from Vienna, Galician oil has taken over the Austrian market, seeing insane profits and more market activities."
ww1_austriahungary.93.a: "Tariffs: my new favorite word!"
ww1_austriahungary.3.t: "[FROM.GetName] Offers a Trade and Cultural Exchange Treaty"
ww1_austriahungary.3.d: "The Austrians have reached out to our government, clearly seeing how we've drifted towards France in recent years and seeking to bring us back into the fold. They're offering us new trade treaties, as well as an agreement on cultural exchange. Should we accept?"
ww1_austriahungary.3.a: "Sounds fair"
ww1_austriahungary.3.b: "Not while they occupy Bukovina!"
ww1_austriahungary.4.t: "[FROM.GetName] accepts trade agreement"
ww1_austriahungary.4.d: "After being invited to Vienna, Romanian delegates and our representatives have agreed on a mutually beneficial trade agreement that will strenghen our relationship for the future. In addition, they've accepted our cultural exchange treaty, which should hopefully increase our influence over their country."
ww1_austriahungary.4.a: "A toast to our friends!"
ww1_austriahungary.5.t: "Romania Refuses Treaty"
ww1_austriahungary.5.d: "Romanian delegates have refused our offer of a treaty, claiming it would not be fair to them. Although Romania is supposed to be our friends, this clearly shows discontent with us amongst the Romanians."
AUS_offensive_against_the_liberals: "Go on the Offensive Against the Liberals"
ww1_austriahungary.5.a: "A loss for them"
ww1_austriahungary.61.t: "Formation of the Black Hand"
ww1_austriahungary.61.d: "We are receiving reports that the 'Black Hand', an ultranationalist jugoslavist group, has been formed in Serbia. Their explicit goals are the destruction of the Austro-Hungarian Empire and the unification of Serbia with our southern territories. No doubt, they're already attempting sabotage campaigns against us in Bosnia, so we must sleep with one eye open. Although their influence is quite low for the time being, they may grow in strength over time."
ww1_austriahungary.61.a: "A bunch of wild animals!"
ww1_austriahungary.66.t: "Ratification of New Military Budget"
ww1_austriahungary.66.d: "The Hungarian parliament has for some time now refused to ratify a higher military budget, still seeking key concessions from Austria. With Hungary now satisified as well as some clever political maneuvers from pro-military spending politicians on both sides of the empire, this budget has finally passed and been ratified. Thus, the rewards from it can now be reaped."
ww1_austriahungary.66.a: "Great!"
ww1_austriahungary.68.t: "Death of Alois Lexa von Aehrenthal "
ww1_austriahungary.68.d: "Our current foreign minister, having been quite aged, unfortunately passed away yesterday. Aehrenthal's legacy of careful diplomacy and bridge-building will be remembered amongst Austrians for ages, his service no doubt making the country stronger and better. The cynical yet necessary question now arises on who to replace him with. Someone like Count Ferdinand von Trauttmansdorff may help continue the legacy of Aehrenthal, while someone like Count Berchtold may take a more assertive and forceful approach to foreign politics"
ww1_austriahungary.168.t: "[FROM.GetName] breaks the 1903 Brussels Trade Agreement"
ww1_austriahungary.168.d: "In 1902, major European powers met together in Brussels and agreed to limit exports to protect each other's economies. For Austria, they had agreed to limit sugar exportats to 5.7 kronen per 100 kilograms, but today they have announcements their pulling out of this treaty in order to follow their liberal-economic approach."
ww1_austriahungary.198.t: "Reappointing Conrad von Hotzendorf"
ww1_austriahungary.198.d: "idk"
ww1_austriahungary.198.a: "Welcome back"
ww1_austriahungary.168.a: "This is not good"
ww1_austriahungary.140.t: "The Anti-Democratic Agenda"
ww1_austriahungary.140.d: "The imperial council has gone woke, full of reformists more interested in weakening the hegemony of the empire and ceding all power to rogue minority obstructionist groups instead of pursuing policies to strengthen the stability of the empire as well as remilitarize Austria in order to prepare it for the inevitable future war coming. Instead of working with the Imperial Council, we shall instead seek to destroy their influence. With the support of the Emperor, who's blessing can allow us to subvert much of the Imperial Councils functions, we should be able to pursue our agenda at the swift speed needed to secure the future of Austria."
ww1_austriahungary.140.a: "Democracy's always been a fools errand anyways"
ww1_austriahungary.145.t: "Opposition Leader Gives Scathing Speech Against Autocracy"
ww1_austriahungary.145.d: "Opposition leaders in the Imperial Council have given a lengthy speech attacking the current Minister President for his anti democratic agenda, demanding we follow the rule of law, respect freedom of speech, and all democratic institutions. They're rallying support in the Imperial Council as well as from people on the streets, who have started their own albiet quite small, annoying protests that don't improve our look amongst the general public."
ww1_austriahungary.145.a: "Someone throw him out!"
ww1_austriahungary.151.t: "Is the Imperial Council Making Austria Unsafe?"
ww1_austriahungary.152.t: "Ukrainian Obstructionists Thrown Out of the Imperial Council"
ww1_austriahungary.152.d: "Ukrainian groups attempting to obstruct the latest Imperial Council session have failed their attempt, with the Minister President ordering police to throw out the unruly Ukrainians, technically in violation of the law, and certainly a violation of Democratic norms. The Ukrainans were attempting to obstruct a series of laws investing in Poland, with Ukrainians being angered at the lack of investment in their own region. This decisive act by the Minister President allowed the Imperial Council to complete its session and may be repeated in the future."
ww1_austriahungary.152.a: "Annoying brats!"
ww1_austriahungary.153.t: "Minister President Begins Skipping Imperial Council Meetings"
ww1_austriahungary.153.d: "The Minister President, typically attenting most Imperial Council sessions, has began to skip them preferring to take meetings with the Emperor and his inner circle instead of wasting time with the obstructionist and broken Imperial Council. The lack of visits from the Minister President is damaging the authority and public legitimacy of the Imperial Council."
ww1_austriahungary.153.a: "Why bore ourselves with these losers"
ww1_austriahungary.151.d: "Disputes between Germany and the Triple Entente, the unstable situation south of us, and the rapid rise of the Russian economy is all pointing towards one thing: Austria needs to bolster its strength. The Minister President has been giving long speeches to the ministers in government and the Emperor himself, justifying the need for swift and decisive action to bolster Austria's military power. Yet, Czech and liberal obstructionists in the Imperial Council are putting the nation under threat, refusing to pass needed legislation to defend the empire. Thus, naturally, the Imperial Council is becoming a threat to the nation itself, and action against it may be needed."
ww1_austriahungary.151.a: "Its quite a convincing argument"
ww1_austriahungary.161.t: "Strengthening Mittelstand"
ww1_austriahungary.161.d: "As our policies both regulate monopolies while empowering the mittelstand class, the previously declining class of artisans, skilled craftsmen, and small shopkeepers have gotten a new chance to prosper, as the economic situation begins to bias towards them. "
ww1_austriahungary.161.a: "These are the true German workers!"
ww1_austriahungary.160.t: "First Series of Cartel Regulations"
ww1_austriahungary.160.d: "Ever since economic turmoil in the 1880's, Austrias government has began supporting large cartels and big businesses to attempt to stabilize the economy and prevent volatile events. However, with a new Minister President and Imperial Council, things are beginning to change. The Imperial Council has just passed a series of regulations on monopolistic business practices, clearly targetting the business cartels that have began to dominate the economy in the last 20 years. Although its expected to hurt the economy in the short term, long term its hoped this will ensure the economy isnt dominated by stagnant monopolies and ensures that the economy remains competitive."
ww1_austriahungary.160.a: "A bold change of course"
ww1_austriahungary.68.a: "Count Berchtold, you're on!"
ww1_austriahungary.68.b: "Count Ferdinand von Trauttmansdorff seems like the man for the job"
ww1_austriahungary.125.t: "Revolution in Hungary"
ww1_austriahungary.125.d: "In response Franz Ferdinand's enforcement of universal suffrage on Hungary, Hungarian revolutionaries both on the street and in high politics have staged a coup, declaring a constitutinoal crisis in the empire and attempting to enforce Hungarian independence. While much of the military remains loyal to Ferdinand, enough have defected to the rebels that its expected to be a real rebellion."
ww1_austriahungary.125.a: "No matter the outcome, the empire will never be the same again"
ww1_austriahungary.67.t: "Austria-Hungary Condemns our Treatment of Christians"
ww1_austriahungary.67.d: "Our government has rightfully treated traitors in the Balkans quite harshly, and yet it seems Austria-Hungary thinks its their business. Austria's foreign minister has issued a strong condemnation of our treatment of Christians in the Balkans, going as far as to threaten an intervention if things don't change. We've concluded an actual intervention seems quite unlikely, and this posturing is most likely just to build good will amongst separatist groups in the Ottoman Empire."
ww1_austriahungary.81.t: "Our Response to the Balkan Wars"
ww1_austriahungary.86.t: "Responding to Austrian Aggression"
ww1_austriahungary.86.d: "It appears Austria may be preparing to invade Serbia, something which would be unacceptable for us. In order to try and cool Austria down, we must remind them of the possible consequences such an action would lead to. Perhaps a strongly worded letter may achieve this."
ww1_austriahungary.86.a: "We need to prove a point here!"
ww1_austriahungary.87.t: "Russian Warning"
AUS_expand_the_badeni_decrees: "Expand the Badeni Decrees"
AUS_expand_the_badeni_decreees_desc: "As part of our new democratic reforms, we will expand Badeni's laws to include more suffrage laws, along with continuing the electoral reform, further enriching us in democracy."
ww1_austriahungary.87.d: "Our movement of troops to Bosnia and the Serbian border have lead to Russia lobbying a diplomatic protest to our government. They have, in vague terms, stated that unnecessary aggression from the Austro-Hungarian Empire to Serbia would not be accepted by Russia. In practical terms, they're telling us that if we strike Serbia, they will militarily defend Serbia. We have no way of knowing if they're bluffing or not, but we should heed their warning carefully."
ww1_austriahungary.87.a: "An expected note from them"
ww1_austriahungary.85.t: "Austro-Hungarian Troop Movements in the Balkans"
ww1_austriahungary.85.d: "The outbreak of war between the Balkan League and the Ottoman Empire has lead to series of hasty negotiations between the major powers of Europe, desperately trying to prevent the war from escalating. The detected mass movement of Austro-Hungarian troops to the Serbian Border has certainly not calmed the fears of these great powers, as tensions between Austria-Hungary and Serbia continue to rise. It's no secret many in the Austro-Hungarian empire have sought a pre-emptive strike against Serbia, and many worry Austria may be going down that path."
ww1_austriahungary.85.a: "We're simply preparing for anything!"
ww1_austriahungary.85.b: "God, are they going to drag us into a world war?"
ww1_austriahungary.85.c: "They wouldn't dare!"
ww1_austriahungary.81.d: "The eruption of a massive war directly southern of us requires a strong response from us. Hawkish members of the government are outright calling for a strike against Serbia, claiming war with Serbia is clearly inevitable, and we should start it on our terms, while they're still weak and distracted with their war against the Ottoman Empire. It would surely be an easily victory in theory, yet in reality it would risk Russian intervention, which would start a war between the Entente and the Triple Alliance. More pacifist members in the government think we should take a more cool-headed approach. Recognizing the chaos at the southern border, they believe we should demand Serbia sign a treaty with us to help ensure border security and help smoothen out smuggling operations."
ww1_austriahungary.81.a: "Serbia's actions are destroying the peace in the Balkans. We need to strongly condemn them!"
ww1_austriahungary.81.b: "Serbias actions are risking the stability of the Balkans. They need to fix this!"
ww1_austriahungary.67.a: "This letter is going into the trash can!"
tenacious_negotiator_3: "Diplomatic Architect"
ww1_austriahungary.84.t: "Mass Movement of Troops to Bosnia"
ww1_austriahungary.84.d: "The outbreak of war in the Balkans between the Balkan League and the Ottoman Empire could easily spread to us if we're not careful. With Serbian agents in Bosnia attempting to cause a revolution, we must be prepared for a possible war. By deploying a large force to Bosnia, we can ensure we're prepared for anything, and send a clear message to Serbia."
ww1_austriahungary.84.a: "Begin the deployments!"
ww1_austriahungary.82.t: "Austria Demands Treaty on Border Security"
ww1_austriahungary.82.d: "The outbreak of war in the Balkans has lead to a spike of activity from Young Bosnia and the Black Hand, being whipped into a frenzy by our war of liberation in the Balkans as well as having the advantage of a less secure Austrian border, as our forces focus on the war with the Ottoman Empire. It seems these groups are causing issues for Austria, who has come to our government with a demand. They are demanding we increase security on the border to try and weaken these groups."
ww1_austriahungary.82.a: "We'll agree, to prevent their wrath."
ww1_austriahungary.83.t: "Serbia Agrees to Increase Border Security"
ww1_austriahungary.83.d: "Serbia has agreed to ramp up the arrests of smugglers from their side of the Austro-Serbian border, which should help us deal with the issue. Although Serbia is still clearly an enemy country due to their actions in the Balkans, this deal does open up the ability of future peaceful co-existance between our two countries."
ww1_austriahungary.83.a: "Good"
ww1_austriahungary.112.t: "A Fragile Economy"
ww1_austriahungary.112.d: "Austria's economy isn't exactly ready for a war scale war of attrition. Poor harvests over the last year have resulted in a state particularly vulnerable to any huge economic shakeup, such as the war we now find ourselves in. Although this war is likely to be over soon, if this war did last for years, we're sure to suffer greatly. We must ensure our economy can stay afloat until then."
ww1_austriahungary.112.a: "Who knew a war with half the world wasn't good for business?"
ww1_austriahungary.138.t: "Investigation of Suspicious Mail"
ww1_austriahungary.138.d: "The investigation of suspicious mail has lead to an interesting discovery. A letter was discovered containing a significant amount of money and several addresses used for espionage activities. A duplicate letter was later posted with the same name, Nikon Nizetas. Police detectives were put at the post office to follow whoever collected it and when the letter was claimed a few weeks later, police pursued but the person who claimed the mail left in a taxi. The detectives got the same taxi and asked to be brought to the place where the last passanger had been taken to and arrived at the Hotel Klomser. They had found a pen-knife sheath in the taxi, which they asked hotel management to ask guests if anyone had lost it, and when a guest arrived to claim it, it turned out to be Alfred Redl, the former head of the Evidenzbureau."
ww1_austriahungary.138.a: "Interrogate him!"
ww1_austriahungary.139.t: "Interrogation of Alfred Redl"
ww1_austriahungary.139.d: "With Alfred Redl being caught receiving the suspicious envelopes without his name, he was interrogated in his hotel room by some military officers. In the interrogation, he admitted to selling military intelligence to a foreign power, the Russians, and serving foreign states on a large scale in the years 1910 and 1911. Army chief of staff Conrad von Hötzendorf ordered for him to be left alone with a loaded revolver, and in the morning hours he was found dead after killing himself."
ww1_austriahungary.139.a: "How much do the Russians know?"

ww1_austriahungary.123.t: "Austria Forces Universal Suffrage Upon Us!"
ww1_austriahungary.123.d: "Franz Ferdinand today signed a decree enforcing universal suffrage on us, something clearly violating our right to sovereignty! This move is meant to dilute the power of Hungarians in the Hungarian government, instead stacking it with non Magyar minority groups who can now vote in Hungarian elections. This is unacceptable, and may be a breaking point for many."
ww1_austriahungary.123.a: "We must reconsider our status in the dual monarchy!"
ww1_austriahungary.121.t: "Riots in Budapest"
ww1_austriahungary.172.t: "Financial Shock Due to Balkan War"
AUS_serb_shipments_mission: "Shipments From Serbia"
AUS_serb_shipments_mission_desc: "The occupation government in Serbia is colluding with our military to send shipments of vaulables to Austria"
ww1_austriahungary.172.d: "The outbreak of war between the Balkan League and the Ottoman Empire has lead to the Austrian stock exchange plunging as investors fear the war may destabilize Austria's southern regions and that the war could even spread to Austria itself. The crash in the stock market has lead to many creditors to show caution to giving loans to Austrian businesses and banks, leading to a steep economic downturn. Although things will likely recover quite rapidly as the situation in the Balkans stabilizes, this is likely going to give our economy a black eye for awhile."
ww1_austriahungary.172.a: "This is pure panic selling!"
ww1_austriahungary.121.d: "As Ferdinand appoints a loyalist to the head of Hungary's government, organic resistance is brewing from civilians. In Budapest, Hungarians are rioting against the new leadership, calling for August to be ousted and for Hungary to have popular sovereignty over its leadership."
ww1_austriahungary.121.a: "We will watch the situation carefully"
AUS_mandate_for_leadership: "Mandate for Leadership"
ww1_austriahungary.124.t: "Several Politicians Declare Constitutional Crisis"
ww1_austriahungary.124.d: "In reponse to Franz Ferdinand declaring universal suffrage law of the land in Hungary, many Hungarian politicians are seeing the issue as a breaking point. Austria directly enforcing its will on Hungary is clearly illegal and unacceptable, and allowing this to go through would effectively end Hungary's independence."
ww1_austriahungary.124.a: "They're right!"
ww1_austriahungary.122.t: "Universal Suffrage in Hungary"
ww1_austriahungary.122.d: "The next move to destroy the Hungarian elite is to introduce universal suffrage in Hungary. This move would greatly expand the power of Romanians, Slovaks, and Slavs in Hungary, thus reducing the power of Hungarians. With this, we can ensure Hungay doesn't have a strong core opposition built up to us."
ww1_austriahungary.122.a: "Let's sign it into law!"
AUS_aggressive_war_plan_conrad: "Unleash an Aggressive Offensive"
AUS_unlock_in_the_gw.tt: "This Decision will be available in the §YGreat War§!"
AUS_taken_5: "This mission fires every §Y180§! days up to §Y5§! times as long as §Y[MGS.GetName]§! exists and resistance isn't too high"
AUS_conrad_war_dec.tt: "§YFor 90 Days:§!\n(§YAny neighboring country at war with us§!)\n$MODIFIER_ATTACK_BONUS_AGAINST_A_COUNTRY$: §G+20.0%§!\n$MODIFIER_DEFENSE_BONUS_AGAINST_A_COUNTRY$: §R-20.0%§!"
ww1_austriahungary.117.t: "Sacking the Hungarian Government"
ww1_austriahungary.117.d: "The Hungarian government is full of officials that antagonize Ferdinand, who are seeking greater autonomy from Austria, who must be curtailed. With the powers vested in the Emperor, Ferdinand can begin clearing up the Hungarian government. The most egregious actors must be removed, with a loyal head of state being appointed to support our agenda. "
ww1_austriahungary.117.a: "And removed, they will be!"
ww1_austriahungary.119.t: "Ferdinand Appoints New Hungarian Head of State"
ww1_austriahungary.119.d: "Ferdinand has appointed an old ally of Austria, Joseph August as head of Hungary. August is aligned with Ferdinand's agenda, and is expected to provide him support as he completely screws over Hungary. Hopefully, organic resistance on the streets will grow to his agenda..."
ww1_austriahungary.119.a: "What the hell?"
ww1_austriahungary.120.t: "The Programme for the Sucessesion"
ww1_austriahungary.120.d: "A series of key advisors to Franz Ferdinand have began preparing for the eventual coronation of the Archduke, seeing his fathers time as coming to an end relatively soon. The written text prepares for Ferdinand to immediately complete his agenda as effectively as possible. This text is expected to help prepare him to crush Hungary, increase centralizing of the empire, and erode what little democracy Austria has."
AUS_austro_polish_solution: "The Polish Crown"
AUS_distribute_pro_war_physical_media: "Distribute Pro War Physical Media"
AUS_expand_army_reserve: "Conrad's Objective: Expand the Army"
AUS_stack_the_military_bureaucracy: "Expand Military Supply Sites"
ww1_austriahungary.120.a: "Interesting..."
ww1_austriahungary.118.t: "Franz Ferdinand Delaying Coronation?"
ww1_austriahungary.118.d: "Despite having been king of Austria for several days, Ferdinand seems to be ignoring calls to accept coronation for King of Hungary. This is raising questions amongst the political establishment, suspecting alterior motives from Ferdinand, a famous opponent of Hungarian interests."
ww1_austriahungary.118.a: "What is his game?"
ww1_austriahungary.116.t: "Delaying Our Coronation of King of Hungary"
ww1_austriahungary.116.d: "While Ferdinand has been crowned King of Austria, he has technically not been crowned King of Hungary yet, meaning he has also not sworn an oath to uphold the Hungarian constitution and legal system. Yet, as Emperor of Austria, we retain the de jure power to enact changes in the Hungarian crownland through royal decree. With no obligation to the Hungarian consitution, we technically have an unlimited mandate to reshape the political state of Hungary however we wish. By delaying our coronation in Hungary, we can keep this power long enough to completely crush the Hungarian brats."
ww1_austriahungary.116.a: "Let's get to work..."
ww1_austriahungary.111.t: "New Man in Town"
ww1_austriahungary.111.d: "The ascension of Franz Conrad von Hötzendorf to leader of Austria has brought immediate change to its government. Local governors across Austria have been purged, being replaced with nationalists aligned with him. A series of emergency decrees have been passed, drastically reducing civil liberties across the country. Although parliament hasn't been dissolved yet, its end is seen as likely to come soon."
ww1_austriahungary.111.a: "Bold change is needed!"
ww1_austriahungary.136.t: "Austria forces the Army Bill issue"
ww1_austriahungary.136.d: "Austria has forced upon us the question of the army bill, and demands us to finally end the army crisis."
ww1_austriahungary.136.a: "We're trying"

ww1_austriahungary.115.t: "A Non-Partisan Minister President"
ww1_austriahungary.115.d: "Minister-Presidents of Cisleithania under Emperor Joseph often pursued their own ambitious, independent agendas. Franz Ferdinand intends to be more involved in the political state of the empire, and thus the Minister-President role is expected to become widely ceremonial only, with a puppet being appointed who will rubber stamp Ferdinands agenda."
ww1_austriahungary.115.a: "A much needed improvement"

ww1_austriahungary.137.t: "Picking the Ideal Canidate"
ww1_austriahungary.137.d: "While we've decided to appoint a reformist as Minister-President of Austria, we must now decide the person. [AUS.GetLeader]'s advisors have brought a list of politicans that would fit the goals [AUS.GetLeader]'s agenda. Who should be appointed?"
ww1_austriahungary.137.a: "Max Vladimir Von Beck would be ideal"
ww1_austriahungary.137.b: "Heinrich Lammasch would be good"
ww1_austriahungary.137.c: "Ernest Von Koerber is the best choice"
ww1_austriahungary.128.t: "Minorities Want Out"
ww1_austriahungary.128.d: "Seeing the writing on the wall, many minority groups in the empire are seeking a way out after the takeover of the government by the military lead by Hötzendorf. With Hötzendorf being a hardcore Germanophile, they realize a regime under him would lead to their oppression. Thus, minority groups across the empire have organized and joined Hungary in their rebellion"
ww1_austriahungary.128.a: "All traitors will face a swift end!"
ww1_austriahungary.127.t: "Conspiracy in the Military "
ww1_austriahungary.127.d: "As revolution in Hungary rages on, many in the military are seeing Ferdinand as a poor leader. If Ferdinand can already cause an empire civil war within his first few weeks as leader, who knows if the empire will survive under him by the next year. Germany, angered by Ferdinands more pro Russia outlook, seems to be supporting some sort of military conspiracy against Ferdinand. Is it time for the military to restore order in the empire?"
ww1_austriahungary.127.a: "We must swiftly surround Vienna"
ww1_austriahungary.127.b: "Ferdinand must quickly purge the army!"
ww1_austriahungary.126.t: "The Loneliest Man in Vienna"
ww1_austriahungary.126.d: "Franz Ferdinand, being a authoritarian man with a brash personality, has made few friends amongst the political elite that dominate Austrian politics. Although having a small circle of loyal advisors, most Austrian politicians see Ferdinand as an autocrat who wants to take away their power. Thus, Franz Ferdinand is entering government with few supporters."
ww1_austriahungary.114.t: "Redl Provides Austrian Military Plans"
ww1_austriahungary.114.d: "Redl, our spy in Austria, has delivered us the copy of Austrian war plans against us. We can now utilize these to crush Austria on the battle field, at least until they catch on and redraw them"
ww1_austriahungary.114.a: "Wow! They're screwed!"
ww1_austriahungary.135.t: "The Wehrmann"
ww1_austriahungary.135.d: "As the Great War continues, residents of Vienna have began to participate in unique fundraiser to support the war and show solidarity for the Austrian war spirit. Hundreds of thousands of Viennans are pounding iron nails into the a wooden statue of a soldier in Vienna, attempting to turn the statue into pure iron. They're getting the iron nails through government operated shops, which are allowing civilans to purchase the iron nails to pound into the large statue in exchange for money which is being used to pay out programs for widows of fallen soldiers on the frontline."
ww1_austriahungary.135.a: "A very cool program!"
ww1_austriahungary.107.t: "Pre-Emptive Strike on Serbia?"
ww1_austriahungary.107.d: "With us prevailing against Serbia in the Taslica crisis, many in the army want us to escalate further. Influential figures like Conrad have advocated for a pre-emptive strike against Serbia for years now, and what better time then when Serbia is distracted fighting a war with the Ottoman Empire? Undoubtedly, an attack would cause an international crisis. Yet war with the Entente may be inevitable, and if we attack now, it could start on our terms."
ww1_austriahungary.107.a: "Nonsense. We aren't doing that"
ww1_austriahungary.107.b: "No time for second thoughts, we need to do this"
ww1_austriahungary.154.t: "Conrad's Budget Requests Fail"
ww1_austriahungary.154.d: "Recently in an attempt to increase the army budget, Conrad von Hötzendorf submitted army budget requests to Reichskriegsminister Franz Schönaich totaling 1000 million crowns, however, the minister was skeptical if he could get this approved so he reduced the request by more then one third of Conrad's proposal. Conrad was not consulted about the change, and he later angrily found out about it and restated his demands for the full amount and threatened his resignation to the Emperor. Franz Joseph told him to be realistic, however, with the intervention of Franz Ferdinand, Conrad was allowed to plead his case to a special ministerial conference in Budapest, but was unable to sway the ministers. Franz Ferdinand labelled Schönaich as an enemy of the dynasty and sent him a letter demanding his resignation, but Schönaich simply ignored it."
ww1_austriahungary.154.a: "This isn't good"
ww1_austriahungary.155.t: "Auffenberg Orders 12 Siege Artillery Pieces"
ww1_austriahungary.155.d: "With the lack of action for upgrading obsolete siege artillery pieces, k.u.k. Kriegsminister Moritz Auffenberg has on his own authority ordered 12 modern artillery pieces from Skoda Works. The parliaments of course were not happy about Auffenberg's decision and were in uproar, especially in Budapest, but at least an effort has been made at modernizing the army's artillery."
ww1_austriahungary.155.a: "Parliament must fund the army!"
ww1_austriahungary.170.t: "Conrad Prepares to Request for a Budget Expansion"
ww1_austriahungary.170.d: "As Conrad prepares to expand the army and modernize its equipment, the laughably small army budget currently granted to him will need to be raised. Obvious to anyone looking, tensions are rising and the need for a strong army is higher then ever. With the current situation, hopefuly the Emperor can manage to get him his requested budget."
ww1_austriahungary.170.a: "We'll surely suffer if we don't!"
ww1_austriahungary.171.t: "Consumers Panic Buy Food"
ww1_austriahungary.171.d: ""
ww1_austriahungary.171.a: "This craziness must be ended"



