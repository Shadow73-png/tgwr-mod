ww1_austriahungary_war.2.t: "The Military Oversight Department"
ww1_austriahungary_war.2.d: "To ensure the civilian government is effectively implementing measures to strengthen the war effort, in particular regarding offenses such as high treason, capital offenses against members of the military, desertion, and disturbing the peace, the Military Oversight Department has begun exercising increased power in ministries such as the Ministry of Education, Finance, Justice, and more. Military-approved figures are being stacked on the boards, increasingly interfering with the usual processes of these ministries to instead focus on the priorities of the military."
ww1_austriahungary_war.2.a: "The civilian administration must cede power in this crucial hour!"
ww1_austriahungary_war.3.t: "Mass Growth of the Military Bureaucracy"
ww1_austriahungary_war.3.d: "The war has required a large increase in the size of all departments revolving around military and wartime affairs, unfortunately at a pace much faster than we expected. The sheer scale of growth in the military-related bureaucracy is requiring the seizure of local hotels in the area to house workers. Luckily, renovations to existing departments are underway to massively expand their size."
ww1_austriahungary_war.3.a: "The scale of growth here is extraordinary!"
AUS_suspend_civil_liberties: "Cede Political Influence to the Military"
AUS_outlaw_hindering_of_war_effort: "Outlaw Hindering of the War Effort"
ww1_austriahungary_war.5.t: "The Punitive Expedition"
ww1_austriahungary_war.50.t: "The Hateful Society of Assassins"
ww1_austriahungary_war.50.d: "The military has already been filled to the brim with anti-Serb thinkers who view Serbia and the Serbian people as the greatest enemy of Austria; undoubtedly, they feel vindicated due to recent events. The high command in charge of operations in Serbia have explicitly told its soldiers that the Serbian people should be viewed as a 'hateful society of assassins,' and kind and humane treatment towards them is not appropriate conduct for an Austrian soldier."
ww1_austriahungary_war.50.a: "Let's hope they don't do anything insane..."
ww1_austriahungary_war.51.t: "Mass Atrocities Against Bosnian Serbs"
ww1_austriahungary_war.51.d: "As Austrian troops flood into Bosnia to invade Serbia proper, mass atrocities are being committed against local Serbian populations. Mass expulsions are being ordered by the military, with Serbians having everything they own stolen, and thousands of deaths occurring from violent incidents. Unfortunately for the Serbian people, the actions are being endorsed from the top down, and they're likely to see no relief from these horrific actions."
ww1_austriahungary_war.51.a: "Are the entire Serbian people really our enemy?"
ww1_austriahungary_war.52.t: "Collective Punishment"
ww1_austriahungary_war.54.t: "Croat Support For the Empire Surges on Italian Entry to War"
ww1_austriahungary_war.54.d: "Croat support for the empire has always been quite shaky, as Hungarian actions have often come at their expense, while many Croats sympathize with the ideals of a South Slavic state. Yet the entry of Italy into the war has massively rallied Croat support for the monarchy. The Croats view Italy as an imperial force seeking to subjugate them under an iron fist. At least under Austro-Hungarian rule, they have a serious degree of autonomy with future prospects for even more. Under Italy, they would lose all of this."
ww1_austriahungary_war.54.a: "They finally appreciate us!"
ww1_austriahungary_war.52.d: "Serbs are being rounded up and arrested without trial or interrogation on charges of being spies. If any Serbians attempt to flee the approaching Austrian soldiers, they risk being murdered in horrific ways, with recorded incidents of Serbians being burnt alive. Some commanders in charge of troops in Bosnia and occupied lands in Serbia have written appeals to the higher command, seeing the actions as sickening and a violation of international humanitarian standards and agreements. Yet their appeals are failing to see any real change implemented, as the higher-ups continue to give a de jure command of following humanitarian standards while doing nothing to address the de facto policies actually on the ground."
ww1_austriahungary_war.52.a: "Are we the bad guys?"
ww1_austriahungary_war.53.t: "Mass Looting in Serbia"
ww1_austriahungary_war.53.d: "As we advance into Serbia, our troops are completely looting Serbia, stealing whatever they can and burning what they don't want. This comes both as the army faces shortages and needs resources, as well as the army already having a hatred of Serbs and having no problem with seeing the citizens suffer."
ww1_austriahungary_war.53.a: "Well, our army needs supplies somehow"
AUS_defeat_serbia_early: "Crush the Serbs"
ww1_austriahungary_war.6.t: "Humiliation in Serbia"
ww1_austriahungary_war.7.t: "Preparing the Nis Declaration"
ww1_austriahungary_war.8.t: "The Nis Declaration"
AUS_expand_the_civilian_administration: "Expand the Civilian Bureaucracy"
ww1_austriahungary_war.8.d: "Serbia has just published the Nis Declaration, officially pushing for the unification of our southern territories with the Serbian state, which is to be reformed into a state for all Southern Slavs. While we're trying to suppress its message as much as possible, the news is still reaching the south, which has unfortunately raised the spirits of the rebellious sector of the Slavic population, who will undoubtedly step up their sabotage efforts."
ww1_austriahungary_war.8.a: "Suppress it as much as possible!"
ww1_austriahungary_war.7.d: "We've survived an onslaught from Austria-Hungary for months now, against the predictions of many. With our impressive performance, we must now prepare to take the next step in declaring our intentions for the future of Austria-Hungary's Balkan territories after our inevitable victory."
ww1_austriahungary_war.7.a: "What are our options?"
ww1_austriahungary_war.6.d: "Somehow, the tiny Serbian nation still stands nearly six months after the beginning of the war. Our operations have failed to meet their objectives in our worst-case scenario timeframe, clearly as a result of the incompetence of the general in charge of the operation. We must shake things up, starting by firing everyone in charge of this disaster."
ww1_austriahungary_war.6.a: "What a screw-up!"
ww1_austriahungary_war.5.d: "Serbia's gone unpunished for their role in spreading unrest in our Balkan territories for far too long, and now the time has come to finally get revenge. Serbia, being a weak and young nation, should be easy pickings for our grand army. The orders from the high command are clear: we must overwhelm the Serbs with our much larger and up-to-date army and crush them!"
ww1_austriahungary_war.5.a: "They'll regret ever messing with us!"
AUS_abandon_jury_trials: "Suspend Jury Trials"
ww1_austriahungary_war.4.t: "Drumhead Trials"
ww1_austriahungary_war.4.d: "The state of war requires grand efficiency in our court system to quickly prosecute lawbreakers and secure the war effort. To prevent backlogs and quickly punish traitors, a system of trials requiring a final verdict within 72 hours has been implemented, allowing us to rapidly serve out punishments. Unfortunately, the quick time requirements do limit just how extensive our investigations into accused crimes can be, and may lead to some falsely accused suspects still facing punishment. Yet this is a sacrifice we must make for the war effort."
ww1_austriahungary_war.4.a: "We must quickly dish out punishments to traitors!"
AUS_abandon_jury_trials_desc: "The principle of a jury at a trial is dangerous to our war effort. A jury can nullify punishments for traitors, which can end up being disastrous for morale.\nOrder No. 228 will solve this issue by suspending jury trials for the duration of eleven months."
AUS_abandon_jury_trials_tt: "After 11 months from completing this focus:\n"
AUS_suspended_jury_trials_ns: "Suspended Jury Trials"
AUS_suspended_jury_trials_ns_desc: "In a time of war, jury trials can lead to unforeseen consequences to the nation's morale."
AUS_extend_the_suspension_of_jury_trials: "Extend the Suspension of Jury Trials"
AUS_establish_landwehr_tribunals: "Military Control of the Courts"
AUS_establish_landwehr_tribunals_desc: "The Landwehr needs to take control over the prosecution of murder, manslaughter, robbery, and arson in order to improve national security."
