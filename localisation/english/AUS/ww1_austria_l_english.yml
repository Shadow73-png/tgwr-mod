MGS_civilian_commissioner: "The Civilian Commissioner"
MGS_seperate_governance_from_military: "Separation From the Central Command"
MGS_reopening_the_schools: "Reopening the Schools"
MGS_closer_ties_to_the_empire: "Closer Ties to the Empire"
ww1_austriahungary_war.56.t: "A Separate Peace with Serbia?"
ww1_austriahungary_war.56.d: "The entry of Italy into the war against us, the failure of a quick victory over France, and the continued existence of Serbia means the continuation of the Balkan front is a waste of resources. Many in the government want us to seek a separate peace deal with Serbia, where we would allow them to unite with Montenegro and annex part of northern Albania, and in exchange they would commit to close political ties to us and Austria-Hungary, helping root out pan-Slavic groups in their empire. It would be part of a greater ambition in the Balkans to settle disputes between Bulgaria, Romania, and Greece, appeasing all three countries and drawing the entire Balkans into an alliance."
ww1_austriahungary_war.56.a: "Let us flirt with the idea to Austria"
ww1_austriahungary_war.56.b: "Reject these ideas; Serbia must completely surrender"
ww1_austriahungary_war.57.d: "The entry of Italy into the war against us, the failure of a quick victory over France, and the continued existence of Serbia has led Germany to see the continuation of the Balkan front as a waste of resources. They wish to see a separate peace with Serbia, where we would allow them to unite with Montenegro and annex part of northern Albania, and in exchange they would commit to close political ties to us and Germany, helping root out pan-Slavic groups in the empire. It would be part of a great German ambition in the Balkans to settle disputes between Bulgaria, Romania, and Greece, appeasing all three countries and drawing the entire Balkans into an alliance.\n\nThe Austrians have already refused this idea, and our government is generally aligned. Although we don't wish to see Serbian annexations, allowing Serbia to strengthen itself and have too much autonomy would be a betrayal of the entire reason we started the war."
ww1_austriahungary_war.57.a: "Let us condemn this"
ww1_austriahungary_war.58.t: "Austria-Hungary Refuses Separate Peace Idea"
ww1_austriahungary_war.58.d: "Both the Austrian and Hungarian governments have refused our idea of a separate peace with Germany, reacting with a surprising level of anger. Many in the Austrian and Hungarian governments see our idea of a separate peace as a complete betrayal to them. Frustratingly, our attempts to get a clear idea of what they would want from a peace deal are being replied to with vague concepts, meaning the Austrians don't truly have a plan and thus we can't negotiate in any capacity."
ww1_austriahungary_war.58.a: "Our allies are morons, but they are our morons..."
ww1_austriahungary_war.55.a: "This is a complete non-starter; object!"
ww1_austriahungary_war.55.b: "Let us take the prospect seriously"
AUS_unlock_desp_measures: "Received National Riots Over Food Shortages"
AUS_count_richard_von_bienerth_schmerling: "Count Richard Von Bienerth Schmerling"
AUS_introduce_price_caps_desc: "Currently, food prices are soaring across the nation due to growing shortages and are showing no signs of stopping. The population is not happy with the extreme food prices and are demanding we implement caps on the price of food, which would be a wise move to stop this crisis."
AUS_begin_the_rationing_of_flour_bread: "Begin the Rationing of Flour and Bread"
AUS_begin_the_rationing_of_flour_bread.tt: "The Mission '§Y$AUS_worsening_food_shortages$§!' will fire §Y20§! days §Gslower§!"
ww1_austriahungary_war.36.t: "Food Situation Gradually Worsening"
ww1_austriahungary_war.36.d: "As the war drags on, our production of food is continuously declining. Already strained before the war, our agricultural industry is being crippled by the lack of imports for tools and fertilizers needed for agriculture, the mass food needs of the military, and the drafting of rural farmers. As this war continues to drag on longer than we expected, our agricultural industry will continue to decline."
ww1_austriahungary_war.36.a: "Then we will need stricter measures"
AUS_has_began_rationing: "Has completed £decision_icon_small'§YBegin the Rationing of Flour and Bread§!"
AUS_expand_rationing_to_sugar_milk_and_fats: "Expand Rationing to Sugar, Milk, and Fats"
AUS_war_worsens.tt: "The Mission '§Y$AUS_worsening_food_shortages$§!' will fire §Y10§! days §Rfaster§!\nThis will cap at the mission firing every §Y90§! days"
AUS_this_is_not_fucking_good: "The empire is left §Rmore vulnerable§! to future food shortages"
ww1_austriahungary.200.t: "Poor Harvest"
ww1_austriahungary.200.d: "As the 1913 harvest season begins, yields this year are proving to be quite a disappointment. Although not at all risking a famine, the poor harvest will likely increase food prices, hurt our economy, and leave us less prepared for any major events leading to food shortages."
ww1_austriahungary.200.a: "How unlucky"
AUS_initial_peace_movements: "Initial Peace Movements"
AUS_initial_peace_movements_tt: "§RWe will occasionally receive events about pacifists rallying support§!"
AUS_ration_potatoes_jam_and_meat: "Expand Rationing to Potatoes, Jam, and Meat"
AUS_stricten_the_rations: "Strict the Rations"
ww1_austriahungary_war.37.t: "Rising Black Market"
AUS_bureaucratic_war_absolutism: "Bureaucratic War Absolutism"
AUS_the_necessary_public_sacrafice: "Sacrifices From Our Citizens"
AUS_gold_and_metal_from_people: "Collect Gold and Metal From Citizens"
ww1_austriahungary_war.37.d: "As we set price caps for food, many producers are starting to avoid selling their goods to the state, instead going underground. The black market is proving to be much more profitable for food producers due to it being unrestrained from government price controls. As business goes underground, our economy is losing revenue, and our food distribution efforts are becoming less effective."
ww1_austriahungary_war.37.a: "We need to combat this as much as possible!"
ww1_austriahungary_war.38.t: "Flawed Food Distribution"
ww1_austriahungary_war.38.d: "Our state distribution of grain is proving to have many flaws, with corruption, logistical issues, and outright neglect from officials in charge of the program leading to more rural and isolated communities having much worse experiences with state distribution than the wealthy and urban citizens. Rural citizens are seeing delays and shortages, stirring discontent with the system."
ww1_austriahungary_war.38.a: "Who cares about them?"
ww1_austriahungary_war.39.t: "Conscription of Farmers Reducing Agricultural Production"
ww1_austriahungary_war.39.d: "Across the Empire, agricultural output has been decreasing due to the conscription of farmers and farm laborers, leading to a drop in the production of grains and other agricultural products. This has been worsened further by our granting of draft exemptions to many industrial workers, causing farmers to be disproportionately conscripted."
ww1_austriahungary_war.39.a: "Who will work the fields?"
ww1_austriahungary_war.40.t: "Russian Invasion Damages East Galician Agriculture"
ww1_austriahungary_war.40.d: "The Russian invasion in East Galicia has caused significant disruption to agriculture in the region, with food production dropping significantly due to many farms being damaged or destroyed."
ww1_austriahungary_war.40.a: "Damn them!"
ww1_austriahungary_war.41.t: "Russian Invasion Damages West Galician Agriculture"
ww1_austriahungary_war.41.d: "The Russian invasion in West Galicia has caused significant disruption to agriculture in the region, with food production dropping significantly due to many farms being damaged or destroyed."
AUS_setting_up_central_tt: "Not currently setting up a Central"
AUS_establish_the_metal_central: "Establish the Metal Central"
AUS_establish_the_wool_central: "Establish the Cotton Wool Central"
AUS_establish_the_wool_central_desc: "Cotton and wool are both very important resources for the military, needed to make uniforms, bandages, and more. With shortages of these materials growing, the government must intervene and set up the Baumwollzentrale (Cotton Wool Central), to take these resources from the civilian population and mandate the reuse of these materials."
AUS_establish_the_livestock_meat_central: "Establish the Livestock and Meat Central"
AUS_convert_economy_d: "Repurpose our Industry"
