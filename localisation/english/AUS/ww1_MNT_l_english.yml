MNT_bomb_affair_mending: "Forgiving Past Endeavours"
MNT_bomb_affair_desc: "A plot to kill king Nikola was barely managed to uncover in October 1907 from the hands of the Montenegrin army officers. The plot was organized by the Black Hand. King Nikola is now paranoid of similar attempts on his life."
MNT_bomb_affair_mending_desc: "Bomb and Kolašin Affairs are behind us, as we cannot hold such grudges over matter that wasn't under Serbian reach. We all agree today, that these events were attacks of delusional individuals, with nothing to do with Kingdom of Serbia itself. United in recent successes we shall rejoice together!"
MNT_agrarian_society: "Economy of Barren Highlands"
MNT_agrarian_society_desc: "Almost no industry, infrastructure and low surplus agriculture is rude, but true depiction of our lands. Mountainous, rugged terrain, sometimes not even able to feed all the mouths that live on it is its pride and chain in same time. To move from this dead point, large efforts are necessary and urgent..."
