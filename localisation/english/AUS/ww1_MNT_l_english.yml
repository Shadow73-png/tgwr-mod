MNT_money: "Minting the Currency"
MNT_russia_mil_traty: "Military Treaty With Russia"
MNT_national_theater: "Opening the National Theater"
MNT_national_theater_desc: "The proposal to create a permanent theater was first brought up in 1908 and for the last two years there has been significant work to make that a reality, in great part due to the patronage of King Nikola. In the short time since its inauguration, it has already attracted attention of local and foreign artists, which will hopefully turn this theater into a new center of culture of our kingdom."
MNT_standardize_courts: "Standardize the Courts"
MNT_begmaxxing: "Back to Foreign Loans"
MNT_begmaxxing_desc: "The state of our economy is simply abysmal. For some time, we have relied on nothing, but foreign loans to sustain our economy and attempt some development through investments. This modern way is not to the liking of all conservative voices, but this is only way to progress for now."
MNT_law_on_state_money: "Law on State Money"
MNT_law_on_state_money_desc: "Already existing indigenous currency, 'para', isn't strong enough to fulfill our commerce's needs. Perper, already well known to our people, will be officially proclaimed as only official currency in lands of our kingdom, of course alongside para."
MNT_kingdom_proclamation: "Kingdom Proclamation"
MNT_kingdom_proclamation_desc: "This August of 1910, will be 50th anniversary of prince Nikola's rule. It has been no secret, that he wants to enter the anniversary as King of Montenegro. Such thing will give us more respect in foreign politics and aligns with Nikola's centralization efforts. Overwhelming parliament majority is about to propose such proclamation, so it is finally time for dream's fruition."

MNT_albania_situation1: "Albanian Situation"
MNT_albania_situation1_desc: "on foenem"
MNT_law_on_army: "Law on Organization of the Army"
MNT_law_on_army_desc: "The Montenegrin army has traditionally relied on tribal and regional levies. This leaves us horribly outdated, even by the standards of a Balkan nation. If we wish to fight a modern conflict, we must reform the army to adhere to at least some level of modern standards of organization and recruitment for impending conflict."
MNT_reservists_report: "Investigate Reservists Report"


