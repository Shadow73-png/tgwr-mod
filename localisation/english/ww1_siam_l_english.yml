SIA_chulalongkorn: "Chulalongkorn"
SIA_chulalongkorn_desc: "Nicknamed the Phra Piya Maharat, or 'Great Beloved King', Chulalongkorn transformed the Siamese nation in the era of European colonialism by territorial concessions and administrative restructuring, transforming the nation from a mandala state to a modern, centralized Kingdom."
