 HUN_constitutional_party_name: "Национальная конституционная партия"
 HUN_subdue_croatian_nationalism: "Подавить хорватский национализм"
 HUN_subdue_croatian_nationalism_desc: "Чтобы начать восстановление венгерского правления в Хорватии, мы наведём порядок, подавив любые националистические партии в регионе. Мы мобилизуем армию, чтобы помочь нам, и попытаемся уничтожить любую оппозицию или терроризм."
 HUN_tighten_grip_on_croat_ban: "Усилить контроль над баном"
 HUN_tighten_grip_on_croat_ban_desc: "Мы установим более широкую власть в Хорватии, продолжая избавляться от инакомыслящих. Это может спровоцировать сербов или хорватов, но мы должны поддерживать порядок в регионе."
 HUN_aftermath_of_werkle: "Последствия правления Веркле"
 HUN_aftermath_of_werkle_desc: "В 1905 году король Йожеф решил распустить парламент из-за провала первого правительства Тиши и текущего тупика в парламенте. Король назначил новые выборы, ожидая, что Либеральная партия продолжит своё 30-летнее правление; однако, к всеобщему удивлению, объединённая оппозиция победила либералов. Победившей объединённой оппозицией была коалиция Партии независимости и 48-го года (F48P). F48P выступала против Дуалистического компромисса 1867 года и отстаивала цели Венгерской революции 1848 года. Король, конечно, никогда бы не согласился на это, и поэтому, несмотря на отсутствие парламентского большинства, назначил сильного дуалиста. Это правительство было недолговечным, и Шандор Веркле стал компромиссной фигурой. Компромиссное правительство мало что сделало и было очень дисфункциональным, что побудило короля назначить новую Национальную партию труда и объявить новые выборы..."
 HUN_national_work_party: "Феникс из либералов"
 HUN_national_work_party_desc: "Национальная партия труда — это консервативное правительство, которое стремится к австрийской интеграции и дружбе. Их победа — это феникс, восставший из пепла Либеральной партии, которая потерпела поражение на выборах 1905 года и впоследствии распалась в течение следующих 5 лет. Их поддерживает Австрия, что повышает их популярность. Они стремятся к неуклонному продолжению консервативной политики и прекращению или искоренению социалистических идей."
 HUN_judgement_reforms: "Закон о гражданском судопроизводстве"
 HUN_judgement_reforms_desc: "Наша правовая и судебная система давно подвергается критике со стороны Западной Европы, которая либерализовалась и модернизировалась гораздо быстрее нас; другие современные страны считают нас феодальными. Закон о гражданском судопроизводстве [GetYear] года модернизирует нашу систему и скорректирует законы о долгах и экономических процедурах, чтобы мотивировать средний класс и укрепить доверие потребителей."
 HUN_mend_the_rapture: "Исцелить разрыв 48-го года"
 HUN_mend_the_rapture_desc: "F48P берёт начало в венгерской революции 1848 года, когда храбрые венгры поднялись на борьбу за независимость, но были подавлены с помощью России. После 17 лет пассивного сопротивления был заключён дуалистический компромисс. F48P не удовлетворена этим. Они считают необходимым добиться большей венгерской автономии. F48P победила в 1905 году, что привело к созданию компромиссного правительства; однако через 5 лет партия разобщена, и нет гарантий, что они смогут повторить победу..."
 HUN_kick_the_can: "Отложить решение"
 HUN_kick_the_can_desc: "У Венгрии много проблем; две самые острые — это кризис вокруг армейского вопроса и идея избирательного права. Прошлые правительства пытались и не смогли решить такие важные вопросы... если наши предшественники потерпели неудачу, сможем ли мы? Откладывание решения может быть лучшим вариантом на данный момент..."
 HUN_benefit_business: "Расширить полномочия предпринимателей"
 HUN_benefit_business_desc: "Экономика — это то, что движет Венгрией вперёд, Будапешт, Загреб и Пожонь — одни из самых промышленно развитых городов Европы. Предприниматели — неотъемлемая часть Венгрии, и пока они счастливы, все остальные тоже могут быть счастливы!"
 HUN_stronghanded_methods: "Жёсткие методы"
 HUN_stronghanded_methods_desc: "Иштван Тиса, глава Национальной партии труда, сторонник жёстких методов, мягко говоря. От объединения местных полицейских сил для устранения парламентской оппозиции до применения суровой силы для разгона протестов и сомнительных собраний..."
 HUN_lower_chamber: "Страж нижней палаты"
 HUN_compromise_gov: "Компромиссное правительство"
 HUN_compromise_gov_desc: "F48P каким-то образом удалось сплотиться, чтобы выиграть выборы 1910 года. Конечно, король не допустит правительства F48P, поэтому, как и в 1905 году, мы должны снова положиться на компромиссное правительство..."
 HUN_second_industrial_revolution: "Вторая промышленная революция"
 HUN_second_industrial_revolution_desc: "Мы начнём экономическую модернизацию с модернизации экономических технологий и внедрения экономических планов, организации наших будущих проектов и подготовки. Вскоре мы сможем начать стимулирование через финансовые вливания, а также многие налоговые реформы."
 HUN_embrace_barons: "Принять баронов"
 HUN_embrace_barons_desc: "Наша экономика, как и другие, имеет финансовых олигархов. Однако их полное устранение вызовет экономический разрыв. Мы можем сотрудничать с баронами, постепенно уменьшая их коррупцию и распределяя богатство по всей стране."
 HUN_answer_shortage_problem: "Решить проблему дефицита"
 HUN_answer_shortage_problem_desc: "Чтобы создать экономику для народа, мы откажемся от жадных баронов, сосредоточившись на экономическом росте, стабильности и избавлении от этих денежных воротил. Избавившись от них, мы, в свою очередь, передадим больше наших отраслей промышленности народу, значительно улучшив условия жизни, ВВП и эффективность производства."
 HUN_arad_rails: "Расширение восточных железных дорог"
 HUN_promote_free_market: "Поощрять либерализм"
 HUN_limited_worker_rights: "Ограниченные права рабочих"
 HUN_bosnian_rail_expansion: "Венгерское финансирование боснийских железных дорог"
 HUN_phylaxia: "Спонсировать Phylaxia Szérumtermelő"
 HUN_meddle_in_croat_serb_relations: "Вмешаться в хорватско-сербские отношения"
 HUN_null_visa_requirements_for_serbs: "Отменить визовые требования для сербов"
 AUS_manfred_weiss_works_expansion: "Расширение контракта с Manfréd Weiss"
 AUS_manfred_weiss_works_expansion_desc: "Чтобы развивать экономику Австрии и Венгрии, мы расширим наш и без того разросшийся контракт с Mанфредом Вайссом. Это, в свою очередь, должно обеспечить разумный экономический рост, укрепить наши промышленные связи и связать нас друг с другом теснее, создав сильную федерацию."
 HUN_tackle_unemployment: "Борьба с безработицей"
 HUN_tackle_unemployment_desc: "Безработица подобна чуме. Её можно решить, но это трудно, она разъедает и медленно парализует. Это верно во многих отношениях. Чтобы покончить с безработицей, мы должны решить главную проблему — недостаток рабочих мест. Мы начнём сейчас, постепенно создавая новые отрасли промышленности, шахты и офисы, чтобы исправить кризис."
 HUN_maintain_indirect_taxation: "Сохранить косвенное налогообложение"
 HUN_nationalize_oil_and_gas_fields: "Национализировать нефтяные и газовые месторождения"
 HUN_nationalize_oil_and_gas_fields_desc: "В Европе нефти довольно мало. Однако недавние открытия нефти в Трансданубии вызвали приток инвестиций в венгерскую экономику, поэтому для обеспечения полной добычи мы национализируем нефть, найденную у любых компаний, которые получили контроль, и используем эти средства в наших интересах."
 HUN_continue_rail_mandates: "Продолжить железнодорожные мандаты"
 HUN_continue_protectionist_policies: "Защитить отечественную промышленность"
 HUN_continue_protectionist_policies_desc: "Наши отрасли промышленности и ресурсы жизненно важны для экономического развития и модернизации. Мы сократим внешнюю торговлю, чтобы создать протекционистскую среду, что приведёт к увеличению производства и расширению отечественных промышленных компаний."
 HUN_rudabanya_mining: "Рудобаньские шахты"
 HUN_rudabanya_mining_desc: "Мы построим минеральные шахты в северной части страны, чтобы начать равные инвестиции в венгерскую экономику. Это, в свою очередь, должно обеспечить хорошие поставки полезных ископаемых для наших производственных линий."
 HUN_agricultural_tarrifs: "Ввести сельскохозяйственные пошлины"
 HUN_agricultural_tarrifs2: "Ввести сельскохозяйственные пошлины"
 HUN_prioritize_heartlands: "Отдать приоритет сердцу страны"
 HUN_prioritize_heartlands_desc: "В сердце Венгрии — Трансданубии и вдоль Дуная — не хватает современной промышленности. Мы должны сосредоточиться на индустриализации здесь, так как здесь, в Венгрии, наибольшая стабильность. Кроме того, у нас есть избыток природных ресурсов, что позволяет новым производственным линиям получать ресурсы напрямую, а не импортировать."
 HUN_develop_the_periphery: "Развивать периферию"
 HUN_develop_the_periphery_desc: "Районы на окраинах нашего правления страдают от бедности и отсутствия интереса. Чтобы модернизировать наши сельские земли, мы начнём модернизацию оборудования, снабжая наши фермы современными инструментами для поддержки сельского хозяйства. Мы также построим железные дороги и новые городские центры во многих местах, создав передовую сеть населённых пунктов по всей Венгрии."
 HUN_lukacs_transition: "Переход Лукача"
 HUN_speaker_tisza: "Катализатор"
