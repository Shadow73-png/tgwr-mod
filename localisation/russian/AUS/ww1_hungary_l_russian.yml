 HUN_great_war_focus: "Великая война"
 HUN_great_war_focus_desc: "О! Долгожданная, проклятая Великая война началась! Русский медведь заряжен и нацелен, готовый обрушиться на легкомысленные Центральные державы. На Западе громко звучат реваншистские разговоры Франции и Британии. Посреди всего этого — одинокая Венгрия. Мы — бастион стабильности в Европе. Наш долг — помогать австрийцам. Слава Центральным державам!"
