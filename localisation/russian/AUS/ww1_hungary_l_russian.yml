 HUN_economy_category_desc: "Некоторые сказали бы, что Венгрия сейчас переживает экономический золотой век из-за бурно развивающейся промышленности Будапешта и непрерывных экономических успехов, исходящих от brightest умов Австро-Венгрии; однако это противоречит тому факту, что периферия остаётся неразвитой и бедной. Многие из этих регионов населены не этническими венграми, например, румынами в Трансильвании..."
 HUN_within_the_union: "Венгрия в составе союза"
 AUS_minorities_mechanic_HUN: "Аусглейх"
 AUS_minorities_mechanic_HUN_desc: "Компромисс 1867 года стал результатом 18 лет «пассивного сопротивления», которое восстановило Королевство Венгрия как равноправного партнёра Короны в Австрии. Это привело к системе, названной дуализмом, где Короны имеют значительное разделение властей, за исключением некоторых экономических вопросов, иностранной дипломатии и большинства военных вопросов. Пассивное сопротивление имело некоторые недостатки, такие как стагнация индустриализации и модернизации."
 HUN_national_work_party_cat: "Национальная партия труда"
 HUN_national_work_party_cat_desc: "§CНациональная партия труда§! подчёркивает дуалистический компромисс 1867 года и либеральную экономическую политику. Партия наиболее популярна среди меньшинств Венгрии (румын, хорватов, сербов, словаков и т.д.), поскольку она противостоит F48P, которая хочет дальнейшей венгерской автономии и, следовательно, лишения прав меньшинств. Национальная партия труда сохраняет свою легитимность, применяя авторитарные действия для удержания власти, что делает многих её лидеров непопулярными среди венгров...\n\nПартия должна сохранить свой мандат, если хочет остаться у власти! Если авторитет упадёт, лидеру, возможно, придётся уйти в отставку в пользу другого члена партии или уступить пост министра другой партии!\n\n§YТекущий авторитет партии: [?HUN_national_work_party_authority_var]§!\n\nЕсли авторитет §CНациональной партии труда§! упадёт ниже §Y35§! ИЛИ упадёт ниже $MODIFIER_STABILITY_FACTOR$: §Y20.00%§!, то будет назначен новый лидер!"
