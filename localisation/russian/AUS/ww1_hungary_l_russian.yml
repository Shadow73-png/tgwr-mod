 HUN_hungarian_grey_desc: "Порода венгерского серого скота очень важна для экономики страны, она была выдающимся экспортным товаром и считалась исключительно хорошей породой для выращивания тягловых животных и волов. Интересно, что никто точно не знает, откуда появился венгерский серый скот, но он появился в Карпатах примерно в 14-15 веках."
