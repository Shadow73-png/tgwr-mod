 HUN_to_the_eastern_flank: "На восточный фланг"
 HUN_to_the_eastern_flank_desc: "Мы должны быстро остановить русский паровой каток от проникновения во Львов и вторжения в наши Карпаты!"
 HUN_decapitate_serb_menace: "Обезглавить сербскую угрозу"
 HUN_decapitate_serb_menace_desc: "Весь смысл этой войны был в том, чтобы наказать Белград и восстановить наше господство на Балканах. Быстрое достижение этой цели позволит нам комфортно влиять на другие балканские страны, и тогда у нас останется только один фронт: Россия."
 HUN_mobilize_the_hussars: "Мобилизовать гусар"
 HUN_mobilize_the_hussars_desc: "Кавалерия должна быть мобилизована, чтобы быстро отправиться на Восточный фронт и противостоять русским казакам!"
 HUN_price_regulations: "Установить ценовое регулирование"
 HUN_price_regulations_desc: "Чтобы помочь покупателям внутри страны, необходимо установить ценовое регулирование, чтобы не допустить завышения цен компаниями во времена дефицита"
 HUN_cut_welfare_programs: "Сократить программы социального обеспечения"
 HUN_cut_welfare_programs_desc: "Во время войны все наши ненужные программы должны быть ликвидированы для максимальной экономической эффективности"
 HUN_implement_trade_restrictions: "Ввести торговые ограничения"
 HUN_implement_trade_restrictions_desc: "Некоторые важные материалы, такие как зерно, металлы и уголь, не должны экспортироваться, поскольку они нужны нам для военных действий."
 HUN_purchase_mass_grain_and_flour: "Массовая закупка зерна и муки"
 HUN_purchase_mass_grain_and_flour_desc: "Мы должны закупить большое количество зерна и муки для пайков, пока у нас есть возможность, чтобы бороться с голодом"
 HUN_subsidize_agriculture_works: "Субсидировать сельскохозяйственные работы"
 HUN_subsidize_agriculture_works_desc: "Чтобы поддерживать стабильные поставки продовольствия и товаров, мы должны предоставить нашим фермерам субсидии для продолжения военных действий."
 HUN_organize_metal_production: "Организовать производство металлов"
 HUN_organize_metal_production_desc: "Металл — это необходимость, которую мы не можем себе позволить потерять. Организация и накопление производства сейчас, а не позже, может быть тем, что выиграет нам войну."
 HUN_hazai_leadership: "Руководство Шаму Хазаи"
 HUN_hazai_leadership_desc: "По сути, должность военного министра — это скорее политик, чем офицер. Но при данных обстоятельствах в случае Хазаи этот фактор является доминирующим. Он играет ключевую роль в поддержании мотивации оппозиции в военных действиях и умиротворении Австрии."
 HUN_trade_agreement_with_BUL: "Торговое соглашение с Болгарией"
 HUN_trade_agreement_with_BUL_desc: ""
 HUN_limit_malt_production: "Ограничить производство солода"
 HUN_limit_malt_production_desc: "Эта война требует большого количества зерна, и мы не можем позволить себе тратить его на алкоголь. Хлеб важнее пива в любой день недели."
 HUN_pin_all_hopes_on_russian_defeat: "Возложить все надежды на поражение России"
 HUN_pin_all_hopes_on_russian_defeat_desc: "Идея предоставления уступок Румынии отвергнута. Трансильвания — чисто венгерская территория и была ею последние 900 лет. Наша единственная реальная надежда склонить Румынию на сторону Центральных держав — это добиться убедительного и крупного поражения России."
