 ww1_hungary_auh.1.t: "Национальная партия труда победила на выборах 1910 года"
 ww1_hungary_auh.1.d: "Национальная партия труда победила вопреки ожиданиям многих. Многие ожидали победы F48P и очередного компромиссного правительства из государственных служащих на следующие 5 лет; однако благодаря гениальной политической стратегии Иштвана Тиши и расколу в F48P Национальная партия труда победила! Сможем ли мы начать новую эру прогресса и избавить Венгрию от её отвратительного феодального облика?"
 ww1_hungary_auh.1.a: "Время для перемен"
 ww1_hungary_auh.1.b: "Снова?"
 ww1_hungary_auh.5.t: "Национальная партия труда победила на венгерских выборах"
 ww1_hungary_auh.5.d: "Национальной партии труда (NMP) удалось одержать сенсационную победу на выборах. Не то чтобы мы должны расстраиваться, ведь NMP соответствует нашим целям, привержена соглашению 67-го года и стремится продвигать дуализм в Венгрии; однако известно, что они авторитарны и иногда упрямы в отношении наших пожеланий. Тем не менее, это отлично для Австрии!"
 ww1_hungary_auh.5.a: "Лучшее, что случалось с Венгрией за долгое время!"
 ww1_hungary_auh.6.t: "Ужасные новости: F48P победила на венгерских выборах!"
 ww1_hungary_auh.6.d: "Ужасные новости! Мы не можем допустить правительство F48P в Венгрии. F48P названа в честь венгерской революции 1848 года, которая стремилась к свободе от нашей монархии; однако современная партия против таких мер. С другой стороны, они ставят под сомнение компромисс 67-го года и добиваются гораздо большей автономии от нас. Как и в 1905 году, Франц Иосиф не примет результаты. Похоже, Венгрию ждут более бурные времена при компромиссном правительстве..."
 ww1_hungary_auh.6.a: "Ни при каких условиях F48P не должна править!"
 ww1_hungary_auh.7.t: "Король Ференц Йожеф не принимает результаты выборов"
 ww1_hungary_auh.7.d: "Как и в 1905 году, король не принимает победу F48P. Ни при каких условиях он не позволит им править из-за того, что F48P так критикует соглашение 67-го года и дуалистическую идею. Похоже, Венгрию ждут ещё несколько бурных лет. Мы должны найти разумного компромиссного кандидата для управления. Кого бы мы ни выбрали, ему вряд ли удастся урегулировать разделение в парламенте, которое обязательно наступит со временем..."
 ww1_hungary_auh.7.a: "Кальман Селль пользуется доверием короля"
 ww1_hungary_auh.7.b: "Янош Хадик устроит обе стороны"
 ww1_hungary_auh.7.c: "Иштван Буриан объединит монархию"
 ww1_hungary_auh.7.e: "Дьюла Влашич действительно беспристрастен"
 ww1_hungary_auh.8.t: "Раскол F48P"
 ww1_hungary_auh.8.d: "F48P удалось создать коалицию, чтобы выиграть выборы 1910 года и продержаться достаточно долго для создания компромиссного правительства; однако они не могли отложить свои разногласия навсегда. F48P снова распалась на несколько партий. Тем не менее, они останутся единым избирательным блоком для борьбы с Национальной партией труда в парламенте..."
 ww1_hungary_auh.8.a: "Станут ли они причиной собственной гибели?"
 ww1_hungary_auh.9.t: "Возрождение Конституционной партии"
 ww1_hungary_auh.9.d: "В свете назначения коалиционного правительства в Национальной партии труда начали проявляться внутренние противоречия. Несколько видных членов вышли из партии и возродили Конституционную партию, главой которой стал Янош Хадик, а партия включает Габора Угрона-младшего и Дьюлу Андраши-младшего; однако NMP по-прежнему доминирует в парламенте, и Конституционной партии нужно будет сохранять бдительность. Цели партии умеренны, они выступают за некоторые либеральные реформы, не полностью подчиняясь социал-демократическим идеям F48P..."
 ww1_hungary_auh.9.a: "Интересно"
 ww1_hungary.10.t: "Революция астр"
 ww1_hungary.10.d: "Из-за последствий Аусглейха в разгар этой великой войны протесты широко распространились как среди уставших гражданских, так и среди озлобленных демобилизованных солдат. Рьяный сторонник социал-демократии, Михай Каройи, выдвинулся в качестве лидера, используя цветок астры как символ революции. Чтобы предотвратить полный крах Аусглейха, император согласился назначить Михая Каройи премьер-министром Венгрии и попросил его сформировать правительство с партиями Национального совета. Каройи в тот же день собрал свой кабинет. Технически революция не изменила юридический статус Венгрии, поскольку новое правительство всё ещё приносило присягу королю. Однако, опасаясь радикализации общественного мнения, Каройи на следующий день, 1 ноября, попросил освободить его от присяги, что и было сделано. Впоследствии правительство принесло новую присягу Венгерскому национальному совету.\nХотя революция в Будапеште была относительно бескровной, волна насилия и грабежей прокатилась по сельской местности, когда возвращающиеся солдаты сеяли хаос среди представителей старого порядка, включая убийство бывшего премьер-министра Иштвана Тиши."
 ww1_hungary.10.a: "Конец эпохи!"
 ww1_hungary.11.t: "Катастрофа под Лембергом"
 ww1_hungary.11.d: "Русские войска прорвали линию фронта в Галиции и Северной Буковине и не были остановлены, пока не достигли собственно Венгрии, пройдя через некоторые горные перевалы Карпат. Хотя предательство Альфреда Редля, несомненно, способствовало этому, поражение такого масштаба не должно лежать на плечах только одного человека. Командир войск хонведа в регионе, Дежё Колошвари, кажется, хорошим кандидатом, чтобы возложить на него вину. Таким образом, мы освободим его от обязанностей на фронте, и в будущем он не будет командовать войсками."
 ww1_hungary.11.a: "Мы должны на кого-то указать пальцем"
 ww1_hungary.12.t: "Венгрия вмешивается в хорватско-сербские отношения"
 ww1_hungary.12.d: "Премьер-министр Венгрии Карой Хуэн-Хедервари принимает законы, благоприятствующие сербам, живущим в Воеводине, к большому разочарованию всех хорватских националистов. Хуэн-Хедервари сталкивался с обвинениями в «сербофильстве» с тех пор, как стал хорватским баном в 1883 году. Он оставался на этой должности до 1903 года, где он раздражал хорватов, принимая акты и законопроекты, благоприятствующие сербам и подрывающие хорватскую власть. Тем не менее, Хуэн-Хедервари доказал, что он очень надёжен и является одним из главных сторонников Дуалистической монархии. Мы должны доверять его методам."
 ww1_hungary.12.a: "Он, вероятно, знает, что делает"
 ww1_hungary.13.t: "Карой Хуэн-Хедервари уходит в отставку!"
 ww1_hungary.13.d: "Карой Хуэн-Хедервари не смог сломить обструкционистскую оппозицию, особенно вокруг вопроса о ежегодном законопроекте об обороне. По этой причине премьер-министр уходит в отставку, и министр финансов Ласло Лукач занимает его пост премьер-министра. Возможно, он принесёт стабильность, в которой нуждается эта страна."
 ww1_hungary.13.da: "Премьер-министр Венгрии Карой Хуэн-Хедервари не смог сломить обструкционистскую оппозицию, особенно вокруг вопроса о ежегодном законопроекте об обороне. По этой причине премьер-министр уходит в отставку, и министр финансов Ласло Лукач занимает его пост премьер-министра. Возможно, он принесёт стабильность, в которой нуждается Венгрия."
 ww1_hungary.13.a: "Сможет ли он добиться перемен?"
 ww1_hungary.13.b: "У него есть поддержка императора"
 ww1_hungary.14.t: "Возобновление квоты на финансирование общей армии"
 ww1_hungary.14.d: "Снова настало время пересмотреть квоту на финансирование общей армии. В последнее время в парламенте ведутся ожесточённые дебаты об армии. Сколько мы должны платить? Должен ли венгерский быть официальным командным языком? В преддверии бурных времён нам понадобятся либо более стойкие сердца, либо большее финансирование армии..."
 ww1_hungary.14.a: "Заткнитесь и примите чёртов законопроект!"
 ww1_hungary.14.b: "Требовать уступок от Австрии!"
 ww1_hungary.15.t: "Венгрия хочет, чтобы мы взяли на себя финансирование общей армии"
 ww1_hungary.15.d: "Венгерский парламент погряз в ожесточённых дебатах о кризисе армейского вопроса. Многие венгры считают необходимым, чтобы венгерский стал официальным командным языком, как немецкий. В плену флибустьерства венгерский парламент прибег к требованию компенсации в финансировании общей армии..."
 ww1_hungary.15.a: "Хорошо, мы возьмём на себя немного больше финансирования!"
 ww1_hungary.15.b: "Абсолютно нет!"
 ww1_hungary.16.t: "Австрия берёт на себя больше финансирования общей армии"
 ww1_hungary.16.d: "В ответ на наше требование компенсации Австрия согласилась взять на себя больше финансирования общей армии"
 ww1_hungary.16.a: "Крупно"
 ww1_hungary.17.t: "Спикер палаты: Иштван Тиса"
 ww1_hungary.17.d: "Иштван Тиса стал спикером венгерского парламента. Противоречивый человек, он недолго был главой правительства с осени 1903 года до конца зимы 1904 года. Его премьерство считается неудачным и привело к тому, что Либеральная партия впервые за три десятилетия потеряла парламентское большинство. Критики Тиши выступают против него из-за его часто авторитарного руководства. Тиса также против более либеральной избирательной системы и часто отдаёт предпочтение компаниям, а не рабочим; однако Тиса может вдохновить экономический рост и способствовать единству внутри Аусглейха."
 ww1_hungary.17.a: "Удачи, Тиса!"
 ww1_hungary.17.b: "Будем надеяться, что он хорош"
 ww1_hungary.18.t: "Австрия отказывается предоставлять уступку"
 ww1_hungary.18.d: "Австрия отказалась от любой уступки нам и оставляет нас платить эту несправедливую сумму денег за общую армию! Грубо!"
 ww1_hungary.18.a: "К чёрту вас, я всё равно иду по пути независимости!"
 ww1_hungary.19.t: "Кровавый четверг"
 ww1_hungary.19.d: "В ответ на то, как Иштван Тиса стал спикером палаты с целью сломить обструкцию оппозиции, рабочие вышли на улицы Будапешта, требуя равного избирательного права, улучшения условий жизни и отставки Тиши. Протесты переросли в беспорядки, которые были разожжены социалистами (MDZP), которые приняли большое участие в организации рабочих. Демонстрация закончилась тем вечером после угроз; однако трагически привела ко многим ранениям, ущербу местным магазинам и транспорту и гибели шестерых. Тиса и Лукач остались непоколебимы в своих целях."
 ww1_hungary.19.da: "В ответ на то, как Иштван Тиса стал спикером венгерского парламента с целью сломить обструкцию оппозиции, рабочие вышли на улицы Будапешта, требуя равного избирательного права, улучшения условий жизни и отставки Тиши. Протесты переросли в беспорядки, которые были разожжены социалистами (MDZP), которые приняли большое участие в организации рабочих. Демонстрация закончилась тем вечером после угроз; однако трагически привела ко многим ранениям, ущербу местным магазинам и транспорту и гибели шестерых. Спикер Тиса и премьер-министр Лукач остались непоколебимы в своих целях."
 ww1_hungary.19.a: "Ленивые социалисты!"
 ww1_hungary.19.b: "Мы можем пойти на некоторые компромиссы..."
 ww1_hungary.19.c: "Что происходит в Венгрии, остаётся в Венгрии"
 ww1_hungary.20.t: "Тиса продавливает армейский законопроект"
 ww1_hungary.20.d: "Спикер Тиса взял на себя ответственность продавить армейский законопроект. Оппозиция попыталась воспользоваться своими парламентскими правами и потребовала провести закрытое заседание; однако Тиса отказал в их просьбе и приказал продолжить голосование, несмотря на то, что это противоречило регламенту палаты. Несмотря на яростную оппозицию, Тиса приказал местной полиции насильно удалить членов, которые осмелились голосовать против или, цитируя протест, злиться или проявлять насилие. Без дебатов и без возможности высказать мнение оппозиции законопроект об обороне был принят. Иштван Тиса стал ненавистным человеком в венгерской политике, но, тем не менее, кризис, который мучил Венгрию последнее десятилетие, наконец, может быть разрешён. С принятием законопроекта ежегодный контингент новобранцев был увеличен... К большому удовольствию короля."
 ww1_hungary.20.a: "Великий день для Венгрии"
 ww1_hungary.20.b: "Великий день для Империи"
 ww1_hungary.21.t: "Покушение на Иштвана Тишу!"
 ww1_hungary.21.d: "Пытаясь провести армейский законопроект, Тише пришлось выгнать и отстранить многих членов, чтобы принять законопроект. Одним из первых, кого исключили, был Дьюла Ковач. Дьюла Ковач воспринял своё отстранение очень лично, и в результате сегодня он внезапно ворвался в свободную от оппозиции палату с револьвером в руке и, спрыгнув с галереи для журналистов и пробежав между рядами скамеек, восклицая: «Здесь всё ещё есть член оппозиции!», трижды выстрелил в Тишу, который не мог пошевелиться от шока. По милости божьей ни один из выстрелов не попал в цель. Дьюла Ковач попытался застрелиться четвёртым выстрелом; однако, похоже, пуля не причинила серьёзных ранений."
 ww1_hungary.21.da: "Когда спикер венгерского парламента Иштван Тиса пытался провести армейский законопроект, Тише пришлось выгнать и отстранить многих членов, чтобы принять законопроект. Одним из первых, кого исключили, был Дьюла Ковач. Дьюла Ковач воспринял своё отстранение очень лично, и в результате сегодня он внезапно ворвался в свободную от оппозиции палату с револьвером в руке и, спрыгнув с галереи для журналистов и пробежав между рядами скамеек, восклицая: «Здесь всё ещё есть член оппозиции!», трижды выстрелил в Тишу, который не мог пошевелиться от шока. По милости божьей ни один из выстрелов не попал в цель. Дьюла Ковач попытался застрелиться четвёртым выстрелом; однако, похоже, пуля не причинила серьёзных ранений."
 ww1_hungary.21.a: "О нет! В любом случае..."
 ww1_hungary.22.t: "Иштван Тиса не смог провести армейский законопроект"
 ww1_hungary.22.d: "Несмотря на все попытки Тиши провести законопроект, включая такие методы, как вышвыривание людей из парламента, законопроект не был принят. После часов хаоса и подсчёта голосов кризис продолжается. Невероятная флибустьерская тактика оппозиции окупается, по крайней мере, сейчас. Из-за провала Тиши, попавшего в газеты от Будапешта до Вены, многие потеряли веру в новое правительство, в то время как партии F48P настороженно наблюдают..."
 ww1_hungary.22.da: "Несмотря на все попытки Тиши провести армейский законопроект в венгерском парламенте, включая такие методы, как вышвыривание людей из парламента, законопроект не был принят. После часов хаоса и подсчёта голосов кризис продолжается. Невероятная флибустьерская тактика оппозиции окупается, по крайней мере, сейчас. Из-за провала Тиши, попавшего в газеты от Будапешта до Вены, многие потеряли веру в новое правительство, в то время как партии F48P настороженно наблюдают..."
 ww1_hungary.22.a: "У тебя была одна чёртова работа!"
 ww1_hungary.23.t: "Иштван Тиса убит!"
 ww1_hungary.23.d: "Пытаясь провести армейский законопроект, Тише пришлось выгнать и отстранить многих членов, чтобы принять законопроект. Одним из первых, кого исключили, был Дьюла Ковач. Дьюла Ковач воспринял своё отстранение очень лично, и в результате сегодня он внезапно ворвался в свободную от оппозиции палату с револьвером в руке и, спрыгнув с галереи для журналистов и пробежав между рядами скамеек, восклицая: «Здесь всё ещё есть член оппозиции!», трижды выстрелил в Тишу, попав ему дважды в грудь и один раз в шею. Тиса истёк кровью там же, несмотря на попытки спасти его. Дьюла Ковач затем застрелился четвёртым выстрелом. Этот трагический день запомнится на долгие годы..."
 ww1_hungary.23.da: "Когда спикер венгерского парламента Иштван Тиса пытался провести армейский законопроект, Тише пришлось выгнать и отстранить многих членов, чтобы принять законопроект. Одним из первых, кого исключили, был Дьюла Ковач. Дьюла Ковач воспринял своё отстранение очень лично, и в результате сегодня он внезапно ворвался в свободную от оппозиции палату с револьвером в руке и, спрыгнув с галереи для журналистов и пробежав между рядами скамеек, восклицая: «Здесь всё ещё есть член оппозиции!», трижды выстрелил в Тишу, попав ему дважды в грудь и один раз в шею. Тиса истёк кровью там же, несмотря на попытки спасти его. Дьюла Ковач затем застрелился четвёртым выстрелом. Этот трагический день запомнится на долгие годы..."
 ww1_hungary.23.a: "Потрясение не поддаётся описанию..."
 ww1_hungary.24.t: "Ласло Лукач подаёт в суд на Золтана Деши"
 ww1_hungary.24.d: "Во время ужина Золтан Деши назвал премьер-министра Ласло Лукача величайшим панамистом в Европе, поскольку он считает, что тот увеличил активы Национальной партии труда за счёт государственных средств (около 4,5 миллионов крон). Он направил деньги через Венгерский национальный банк, а взамен получил продление государственных контрактов банка. После его слов пресса также начала заниматься этим делом, после чего Лукач предъявил Деши обвинение в клевете..."
 ww1_hungary.24.a: "Лукач никогда бы так не поступил!"
 ww1_hungary.25.t: "Результаты дела Лукач против Деши"
 ww1_hungary.25.d: "Первоначально Деши был признан виновным; однако после того, как суд отменил вердикт и началось второе разбирательство, Золтан Деши был оправдан по всем обвинениям... что вызвало массовый скандал по всей стране..."
 ww1_hungary.25.da: "Первоначально Деши был признан виновным; однако после того, как суд отменил вердикт и началось второе разбирательство. К счастью для Лукача, был вынесен тот же вердикт!"
 ww1_hungary.25.a: "Лукач, ты дурак!"
 ww1_hungary.25.b: "Ха! Дурак ты, Деши"
 ww1_hungary.26.t: "Правительство Ласло Лукача уходит в отставку"
 ww1_hungary.26.d: "После проигрыша Лукача в его деле о клевете против члена оппозиции Золтана Деши его политическая карьера зашла в тупик. Навлекая позор на себя и Национальную партию труда, он подал в отставку..."
 ww1_hungary.26.da: "Во время ужина Золтан Деши назвал премьер-министра Венгрии Ласло Лукача величайшим панамистом в Европе, поскольку он считает, что тот увеличил активы Национальной партии труда за счёт государственных средств (около 4,5 миллионов крон). Он направил деньги через Венгерский национальный банк, а взамен получил продление государственных контрактов банка. После его слов пресса также начала заниматься этим делом, после чего Лукач предъявил Деши обвинение в клевете. Первоначально Деши был признан виновным; однако после того, как суд отменил вердикт и началось второе разбирательство, Золтан Деши был оправдан по всем обвинениям... что вызвало массовый скандал по всей Венгрии и Австрии. Политическая карьера Лукача зашла в тупик. Навлекая позор на себя и Национальную партию труда, он подал в отставку..."
 ww1_hungary.26.a: "Какой позор"
 ww1_hungary.26.b: "Что творится в Венгрии?"
 ww1_hungary.27.t: "Иштван Тиса подвергается критике со стороны антисемитских кругов"
 ww1_hungary.27.d: "Иштван Тиса считает антисемитизм глупостью, поскольку евреи могут быть столь же полезны для экономики. Из-за этого его часто критикуют антисемитские круги, остающиеся в Будапеште и Вене. На этот раз его критики обвиняют его в том, что он впускает галицийских евреев, чтобы вытеснить этнических венгров. На карикатуре изображено, как евреи мигрируют из Галиции, в то время как этнические венгры едут в Фиуме, чтобы эмигрировать в так называемую «Землю возможностей... Америку...»"
 ww1_hungary.27.a: "Палка о двух концах..."
 ww1_hungary.28.t: "Конкретная оппозиция и дрейф Национальной конституционной партии"
 ww1_hungary.28.d: "Оппозиция F48P, возможно, разделена партийно, но они остаются едины в своей флибустьерской тактике и требованиях чрезвычайно либерального закона об избирательном праве. Они непоколебимы и с трудом идут на компромисс, особенно из-за растущих социалистических идей и молодого лидера Михая Каройи! Внутри нашей собственной партии мы сталкиваемся с жёсткой критикой, поскольку Дьюла Андраши-младший (лидер Национальной конституционной партии, которая объединилась с нашей в 1910 году) печально известен своей оппозицией Иштвану Тише и «жёстким методам», которые использует наша партия. Чтобы успокоить эти проблемы, Иштван Тиса предложил Ласло Лукачу небольшой законопроект об избирательной реформе, который будет выглядеть лучше, чем он мог бы функционировать; однако Тиса хочет, чтобы Лукач предложил законопроект самостоятельно; одно имя Тиши может отпугнуть добросовестных законодателей..."
 ww1_hungary.28.a: "Мы дадим им кое-какие крохи..."
 ww1_hungary.29.t: "Разработка законопроекта об избирательной реформе"
 ww1_hungary.29.d: "При рассмотрении законопроекта об избирательной реформе мы должны быть очень осторожны, так как предоставление слишком больших прав ослабит нас и повысит шансы F48P на победу на выборах 1915 года, одновременно создавая недоверие внутри нашей собственной партии. В то же время, если он будет слишком слабым, этот жест может быть бесполезным. Это также может быть возможностью залатать разрыв между членами нашей партии, которые раньше были членами Национальной конституционной партии..."
 ww1_hungary.29.a: "Не слишком много; не слишком мало..."
 ww1_hungary.29.b: "Значительный законопроект порадует умеренных!"
 ww1_hungary.30.t: "Символический избирательный законопроект"
 ww1_hungary.30.d: "Новый избирательный законопроект, который будет представлен Ласло Лукачем, будет не более чем символическим. Законопроект содержит около 546 страниц; однако только 47 страниц содержат собственно законопроект. Остальные 500 — это просто пояснительная часть и статистические данные. Этот символический законопроект едва ли расширит какие-либо права; женщины по-прежнему не смогут голосовать вообще, и даже количество избирателей-мужчин останется ограниченным. Возрастной ценз будет определён в 24 года (возраст совершеннолетия). Граждане, не имеющие по крайней мере среднего образования, смогут голосовать только после достижения 13-летнего возраста и должны соответствовать критериям, перечисленным в статьях пять-семь. Подводя итог, чем выше был уровень образования у человека, тем меньший годовой налоговый платёж требовался для избирательного ценза. Пояснительная часть законопроекта содержит подробный анализ «рисков» всеобщего избирательного права, упоминая в дополнение, что даже при этом осторожном шаге реформы на следующих выборах будут голосовать около 1,9 миллиона граждан..."
 ww1_hungary.30.a: "С каких это пор осторожность стала спорной!?"
 ww1_hungary.31.t: "Лайош Наваи уходит в оппозицию"
 ww1_hungary.31.d: "Лайош Наваи, наш бывший спикер палаты до того, как уйти в пользу Тиши, выступает против законопроекта в его нынешнем виде. Он объявил, что выходит из партии и переходит в оппозицию. Это не слишком удивительно, учитывая, что он бывший диссидент."
 ww1_hungary.31.a: "По тебе не будут скучать"
 ww1_hungary.32.t: "Принятие символического законопроекта"
 ww1_hungary.32.d: "Символический законопроект принят. Конечно, он едва ли даёт больше, чем у нас уже есть, но, надеюсь, он успокоит яростную оппозицию и утихомирит диссидентов!"
 ww1_hungary.32.a: "Наслаждаются ли они своими крошками?"
 ww1_hungary.33.t: "Смерть Габора Угрона"
 ww1_hungary.33.d: "Скончался известный политик Габор Угрон. Габор Угрон более всего запомнился своей борьбой за независимую политику и своим характером. С юных лет он был энергичен и присоединился к венгерскому парламенту в начале 1870-х годов. Во время русско-турецкой войны (1877) Габор Угрон и некоторые его коллеги, имевшие отличные связи с Англией, испытывали симпатию к Константинополю и разработали план набрать несколько тысяч секеев (венгров, живущих в Восточной Трансильвании) и вооружить их, чтобы они вторглись в Румынию и нарушили линии снабжения России, предоставив османам возможность контратаковать. Во время перевозки оружия лошади испугались, и ящики с оружием упали и разбились, раскрыв заговор. Премьер-министр того времени, Кальман Тиса (отец Иштвана Тиши) выяснил, что Габор Угрон был одним из заговорщиков. Неохотно он начал готовиться к аресту Габора Угрона; однако позаботился о том, чтобы дать ему достаточно времени, чтобы сбрить бороду, подстричься и купить очки, чтобы сбежать в Италию. В конце концов он вернулся в Венгрию. Габор Угрон поддерживал политику независимости и присоединился к F48P в 1884 году. 20 декабря 1891 года Габор Угрон дрался на дуэли с бароном Гезой Фейервари в казармах кавалерии Франца Иосифа, его секундантами были Корнель Абрани-младший и граф Габор Бетлен. Угрон также выступал против Тройственного союза и зависимости Австрии от Германии, поскольку Угрон предпочитал союз с Антантой, особенно с Францией. Угрон даже строил заговор с этой целью, хотя он и не осуществился. У него также было много неудачных деловых предприятий. Король Франц Иосиф предложил ему баронство. Угрон ответил: «Не давайте мне габсбургский титул, у моей семьи уже был титул и имя в этом регионе, когда ветер ещё не принёс новостей о вашей величественной семье сюда». Когда он произносил одну из своих последних речей, он неожиданно прервал себя и попросил перерыв, выйдя в коридор. Его сын (Угрон-младший) в ужасе выбежал за ним; старик, должно быть, плохо себя чувствует. Но нет. Он стоял у телефона в коридоре, набирая номер своей квартиры, чтобы сказать повару, чтобы ставил утку в духовку сейчас, чтобы она была в самом лучшем виде к тому времени, когда он закончит и доберётся домой."
 ww1_hungary.33.a: "Сегодня умер истинный венгр..."
 ww1_hungary.34.t: "Смерть Дежё Банфи"
 ww1_hungary.34.d: "Скончался бывший премьер-министр Дежё Банфи. Бывшего премьер-министра больше всего можно запомнить по ярким моментам его премьерства, где Банфи часто спорил с оппонентами, так что однажды это чуть не переросло в дуэль. После своей отставки он оставался актуальным из-за своего мнения, что мадьяризацию национальностей следует продвигать всеми доступными средствами, но в то же время не следует открывать ни малейшей бреши для культурных, языковых или иных устремлений национальностей. В качестве важного инструмента мадьяризации он рекомендует национализацию государственного образования в противовес конфессиональным школам, а также поселения, непрерывно вдоль границ венгерских этнических блоков. Он также обращает внимание на ускорение процесса мадьяризации фамилий и названий поселений. Он также рекомендует не нанимать домашнюю прислугу, не говорящую по-венгерски, и чтобы венгры не покупали у рыночных торговцев, не знающих венгерского. Его идеи принесли ему прозвище «Самый шовинистичный венгр». Несмотря на его спорные идеи, у него были классные усы."
 ww1_hungary.34.a: "Даже самые шовинистичные умирают"
 ww1_hungary.35.t: "Первый еврей — лорд-мэр Будапешта"
 ww1_hungary.35.d: "Ференц Хелтаи стал первым евреем, занявшим пост лорда-мэра Будапешта впервые в истории, несмотря на большое еврейское сообщество в городе, который даже называют «Юдапешт» критики и антисемиты. Ференц Хелтаи ранее заседал в Палате представителей, а теперь был назначен королём в Палату лордов, и он состоит в Национальной партии труда."
 ww1_hungary.35.a: "Воистину, мы живём в прогрессивное время!"
 ww1_hungary.36.t: "Смерть лорда-мэра Ференца Хелтаи"
 ww1_hungary.36.d: "Недавно назначенный лорд-мэр и член Палаты лордов Ференц Хелтаи скончался по естественным причинам в возрасте 52 лет."
 ww1_hungary.36.a: "Да упокоится он с миром"
 ww1_hungary.37.t: "Меньшинства и выборы"
 ww1_hungary.37.d: "Либеральная партия, которая теперь объединилась с Национальной партией труда, всегда получала большую поддержку от меньшинств; однако эти выборы неопределённы. Многие ожидают поражения Хуэна-Хедервари и очередного цикла компромиссного правительства. К счастью для Хуэна-Хедервари, F48P расколота, и меньшинства вполне могут стать нашим победным билетом. Румынская национальная партия, а также словацкая наиболее многообещающие и могут помочь нам нанести поражение социал-демократам..."
 ww1_hungary.37.a: "Ложные обещания приносят реальные результаты!"
 ww1_hungary.37.b: "Мы можем победить сами!"
 ww1_hungary.38.t: "Тиса и Хуэн-Хедервари ведут переговоры с Иоаном Миху"
 ww1_hungary.38.d: "В связи с растущими трансильванско-румынскими движениями в нашей стране стало очевидно, что их нельзя игнорировать. Они могут нарушить традиционную политическую среду, которую мы стремимся сохранить. Вести переговоры напрямую с Румынской национальной партией было бы ошибкой. Однако такой разумный, умеренный трансильванский землевладелец и банкир, как Иоан Миху, был бы уместен. За два дня до этого Миху встретился с Тисой в Будапеште; Тиса подчеркнул важность венгерско-румынского сближения и обратил внимание Миху на славянскую проблему в Империи, которая обострилась из-за боснийского кризиса 1908 года и российской агрессии. Тиса теоретизирует более сильный пакт Германии, Австро-Венгрии и Румынии, чтобы предотвратить российского монстра. Сегодня Миху обсудил потенциальное соглашение с премьер-министром Хуэном-Хедервари, но никаких обязательств взято не было отчасти из-за позиции Миху как посредника для истинной румынской оппозиции... Миху вернётся позже после разговора с Румынской национальной партией."
 ww1_hungary.38.a: "Посмотрим, как будут развиваться события...."
 ww1_hungary.39.t: "Франц Фердинанд получает письмо от Александру Вайда-Воевода"
 ww1_hungary.39.d: "Румынско-трансильванский политик, который годами боролся за автономию Трансильвании, Александру Вайда-Воевода был весьма разочарован усилиями венгерского политика Иштвана Тиши и премьер-министра Венгрии [HUN.GetLeader]. Он отправил это письмо в надежде получить разъяснения о том, как действовать дальше. Как и многие политики Румынской национальной партии, Вайда-Воевода поддерживает Франца и его планируемый метод федерализации и «Проект 1911»."
 ww1_hungary.39.a: "Мы примем это к сведению"
 ww1_hungary.40.t: "Меморандум Румынской национальной партии"
 ww1_hungary.40.d: "Румынская национальная партия (местная партия в Трансильвании и Банате, которая также имеет связи с [ROM.GetName]), после долгих размышлений, представила свои требования через Миху; требования следующие:\n1) Политическая автономия, включая легализацию Румынской партии и всеобщее избирательное право, а если избирательное право недостижимо или невозможно сразу, то прекращение избирательных злоупотреблений и расширение избирательного права; и создание пятидесяти румынских избирательных округов;\n2) Административная автономия — назначение румынских чиновников в районах, населённых румынами, и использование румынского языка во всех административных и судебных органах, имеющих прямой контакт с населением;\n3) Церковная автономия — управление внутренними делами в соответствии с нормами, гарантированными гражданским и церковным правом, и государственная финансовая поддержка в той же пропорции, что и протестантским церквям;\n4) Образовательная автономия — право церквей и общин создавать и содержать начальные школы; использование румынского языка в качестве языка обучения во всех начальных школах, обслуживающих румынских учеников; строительство за государственный счёт трёх средних школ в районах, населённых румынами, с румынским языком обучения; и создание румынской секции в Министерстве образования и культов;\n5) Экономическая автономия — предоставление регулярных государственных субсидий для развития районов, населённых румынами...\n\nОни ждут ответа..."
 ww1_hungary.40.a: "Только ограниченное расширение румынских церквей и образования"
 ww1_hungary.40.b: "Расширение церквей и образования и признание Румынской национальной партии"
 ww1_hungary.40.c: "Проклятые румыны не получат ничего!"
 ww1_hungary.41.t: "Миху встречается с Тисой для обсуждения меморандума"
 ww1_hungary.41.da: "Миху пришёл встретиться с Тисой для обсуждения меморандума Румынской партии. Миху понимает, что некоторые пункты неприемлемы, но призывает Тишу учесть, что румынские лидеры будут рассматривать окончательное урегулирование только в том случае, если получат надёжные гарантии существования и будущего развития их нации в составе Венгерского государства."
 ww1_hungary.41.db: "Миху пришёл встретиться с Тисой для обсуждения меморандума Румынской партии. Миху понимает, что некоторые пункты неприемлемы, но призывает Тишу учесть, что румынские лидеры будут продолжать добиваться дальнейших прав и будут использовать свою теперь признанную партию для продвижения таких прав и реформ."
 ww1_hungary.41.dc: "Миху пришёл встретиться с Тисой для обсуждения меморандума Румынской партии. Миху понимает, что некоторые пункты неприемлемы, но призывает Тишу учесть, что румынские лидеры будут рассматривать окончательное урегулирование только в том случае, если получат надёжные гарантии существования и будущего развития их нации в составе Венгерского государства. Если венгерское правительство просто откажется от сотрудничества, их лояльность угаснет, и они будут искать внешнюю помощь, будь то сама Румыния или Вена..."
 ww1_hungary.41.a: "Мы работаем в наших рамках!"
 ww1_hungary.41.b: "Мы можем предоставить немного больше прав..."
 ww1_hungary.41.c: "Они должны быть благодарны за то, что имеют!"
 ww1_hungary.42.t: "Визит трансильванского политика Иоана Миху"
 ww1_hungary.42.d: "В течение последнего года в венгерской Трансильвании происходили события; Румынская национальная партия базируется в Трансильвании и выступает за расширение прав румын, если не за автономию Трансильвании. Премьер-министр Венгрии [HUN.GetLeader] и лидер партии Иштван Тиса вели переговоры с Румынской национальной партией через трансильванского землевладельца, банкира и политика Иоана Миху. Иоан Миху посетил короля и премьер-министра и доложил о медленном прогрессе. Ситуация, за которой мы должны внимательно следить...."
 ww1_hungary.42.a: "Миху делает божье дело; посоветуйте ему продолжать"
 ww1_hungary.43.t: "Дуэль Иштвана Тиши и Михая Каройи"
 ww1_hungary.43.d: "После принятия армейского законопроекта Михай Каройи отказался пожать руку Иштвану Тише. Тиса почувствовал себя оскорблённым, но их вражда на этом не закончилась. После споров и столкновения мнений они назначили дуэль. По традиции дуэль была на саблях; они провели 34 раунда, пока Тиса не поранил Каройи в руку, нанеся ему неглубокий порез. Это удовлетворило и Тишу, и Каройи."
 ww1_hungary.43.a: "Интересно"
 ww1_hungary.44.t: "Основание газеты Românul"
 ww1_hungary.44.d: "Газета Românul была основана в Араде несколькими известными румынско-трансильванскими активистами «для установления отношений доверия и поддержки между всеми румынскими рекламными органами, которые искренне служат интересам национальной партии, идентичным политическим интересам румынской нации в Венгрии и Трансильвании»."
 ww1_hungary.44.a: "Не могли бы они не делать этого?"
 ww1_hungary.44.b: "Отправить К. Стере для объединения газет Românul и Tribuna"
 ww1_hungary.45.t: "Газета Tribuna объединена с газетой Românul"
 ww1_hungary.45.da: "После основания газеты Românul румынские общины столкнулись с небольшим кризисом: какую газету выписывать? По-видимому, Бухарест взял на себя инициативу и отправил своего доверенного агента К. Стере, чтобы насильно ликвидировать Tribuna и принудить её к слиянию с Românul. 25-летнее движение Tribuna подошло к концу. «Мир Стере» принёс лидерам Румынской национальной партии номинальную победу над более демократически ориентированной фракцией; несмотря на внутренние разногласия, комитет теперь проецирует образ единства..."
 ww1_hungary.45.db: "Операция Стере увенчалась успехом! К. Стере насильно ликвидировал Tribuna и принудил её к слиянию с Românul. 25-летнее движение Tribuna подошло к концу. «Мир Стере» принёс лидерам Румынской национальной партии номинальную победу над более демократически ориентированной фракцией; несмотря на внутренние разногласия, комитет теперь проецирует образ единства! Освободившись от бремени явной фракционности, руководство теперь получило некоторое пространство для манёвра и компромисса."
 ww1_hungary.45.a: "Плохие новости..."
 ww1_hungary.45.b: "Отлично!"
 ww1_hungary.46.t: "Собрание Румынской национальной партии в Трансильвании"
 ww1_hungary.46.d: "После организации многих румынских приходов под управлением греко-католической венгерской епархии эти приходы были сильно оскорблены и осознали усилия по ограничению их влияния. В ответ на это Румынская национальная партия организовала собрание для принятия резолюции. Резолюция «считает нападение на отечественную румынскую греко-католическую церковь самым варварским посягательством на этническое бытие румынской нации в Трансильвании»."
 ww1_hungary.46.a: "Какие же они плаксы!"
 ww1_hungary.46.b: "Не волнуйтесь! Их угнетение скоро закончится..."
 ww1_hungary.47.t: "Растратить государственные деньги на финансирование предвыборной кампании?"
 ww1_hungary.47.d: "По мере того, как предвыборная кампания Национальной партии труда растёт, чтобы противостоять бдительной партии F48P, средства становятся проблемой. К счастью, поскольку мы уже у власти, мы могли бы использовать государственные средства для финансирования предвыборной кампании..."
 ww1_hungary.47.a: "Это будет нашим маленьким грязным секретом!"
 ww1_hungary.47.b: "Нам не нужно жульничать, чтобы победить!"
 ww1_hungary.48.t: "Пилот-женщина Лили Штайншнайдер совершает полёт!?"
 ww1_hungary.48.d: "Пилот-женщина Лили Штайншнайдер совершила публичный взлёт в Орадя, где поднялась на высоту 50-60 метров на своём самолёте. После приземления сидячая аудитория около двух тысяч человек восторженно приветствовала её, и её на плечах отнесли к ангарам. Это был не её первый полёт. После успешного получения лицензии пилота она пролетела со своим инструктором около 1800 км (1120 миль); вероятно, в разное время. Она также была пассажиром у многих известных пилотов во время их рекордных попыток. Её молодой и восторженный характер характеризует рождение новой аэротехники и возникающих групп."
 ww1_hungary.48.a: "Летающая леди? Воистину диковинка!"
 ww1_hungary.49.t: "Поиск спонсора для нового артиллерийского завода"
 ww1_hungary.49.d: "В этот новый век индустриализации мы не можем отставать в развитии нашей армии. Хонведу не хватает существенной артиллерии; поэтому мы считаем необходимым заключить контракт с компанией, которая поможет построить новый артиллерийский завод в Дьёре. У нас есть несколько отличных кандидатов, но кого выбрать для контракта?"
 ww1_hungary.49.a: "Британская компания: Vickers and Maxim"
 ww1_hungary.49.b: "Чешская компания: Skoda Works"
 ww1_hungary.50.t: "Венгрия ищет спонсорство Vickers & Maxim для артиллерийского завода"
 ww1_hungary.50.d: "Стремясь усилить хонвед и оснастить его артиллерией, Венгрия предложила Vickers & Maxim заключить контракт на строительство завода в Дьёре. Принятие предложения может нарушить нашу отечественную военную промышленность, разбавив её британской промышленностью... Было бы гораздо лучше, если бы на внутренних заводах использовались исключительно отечественные компании или компании Германии..."
 ww1_hungary.50.a: "Венгрия должна разместить его в Прессбурге и использовать Skoda Works!"
 ww1_hungary.50.b: "Неважно"
 ww1_hungary.51.t: "Австрия отклоняет наше предложение; будет использована Skoda Works, но где?"
 ww1_hungary.51.d: "Австрийская военная и политическая элита не хочет слышать о таком стратегически важном оружейном заводе, основанном на технологиях страны, принадлежащей к враждебному военному блоку, и вместо английского оружейного завода они рекомендуют Skoda Works и разместить завод в Пожони (Словакия), а не в Дьёре (Трансданубия)."
 ww1_hungary.51.a: "Завод останется в Дьёре"
 ww1_hungary.51.b: "Пожонь подойдёт... наверное..."
 ww1_hungary.52.t: "Венгрия оставляет завод в Дьёре"
 ww1_hungary.52.d: "Несмотря на нашу просьбу, Венгрия решила оставить завод в Дьёре (Трансданубия), а не размещать его в Прессбурге (Словакия)."
 ww1_hungary.52.a: "Важно то, что они используют Skoda"
 ww1_hungary.53.t: "Венгрия переносит завод в Прессбург"
 ww1_hungary.53.d: "По нашей просьбе Венгрия перенесла запланированное строительство в Прессбург. Это место намного более стратегическое и удовлетворит наши интересы в Словакии."
 ww1_hungary.53.a: "Отлично"
 ww1_hungary.54.t: "Австрия принимает Vickers & Maxim в качестве спонсора"
 ww1_hungary.54.d: "Австрия приняла нашу просьбу использовать Vickers & Maxim в качестве спонсора для нашего планируемого завода в Дьёре!"
 ww1_hungary.54.a: "Мудрый выбор Австрии!"
 ww1_hungary.55.t: "Поезд экономического либерализма"
 ww1_hungary.55.d: "По мере нашего продвижения в новый век, наша экономика также развивается. Мы провели столетия при феодализме, когда вся экономическая власть находилась в руках дворян. Это всё ещё верно, но теперь экономическая власть контролируется не только дворянами, но и баронами. Которые в большинстве своём являются дворянами. Несмотря на наш прогресс, практика феодализма всё ещё связана с нами, только теперь в новую индустриальную эпоху. Грех индустриального феодализма: это периферия, которая остаётся в ловушке сельскохозяйственных методов бедных фермеров-натуралов. В то время как в городе растёт социализм, чтобы попытаться перераспределить дворянское богатство простому человеку. Только время покажет, как смешаются дворянский рыцарь феодализма и конь социализма с неудержимым монстром либерализма новой эпохи..."
 ww1_hungary.55.a: "Чух-чух?"
 ww1_hungary.56.t: "Кризис армейского вопроса сохраняется"
 ww1_hungary.56.d: "Кризис армейского вопроса всё ещё мучает нас. Он разделяет парламент и разрушает любую реальную надежду на двухпартийность. NMP хочет принять закон о финансировании армии; однако коалиция F48P и некоторые независимые члены NMP отказываются сотрудничать, если венгерский не будет признан официальным языком общей армии (как немецкий). Пока мы не достигнем конца, мы можем только ожидать тупика в парламенте..."
 ww1_hungary.56.a: "Боже правый..."
 ww1_hungary.57.t: "Господство баронов"
 ww1_hungary.57.d: "Великие промышленные бароны доминируют в нашей стране во всех отраслях. В то время как наша промышленная мощь превратилась в «венгерский золотой век» благодаря этим людям, они пожинают свои плоды в ущерб простому человеку. Именно простой человек работает 12-часовые смены на опасных фабриках или в поле — независимо от того, работает ли рабочий на сельской ферме или на городском предприятии, они содержатся в современном крепостном праве; добавьте к этому тот факт, что многие из этих баронов принадлежат к дворянству и ведут свою родословную на протяжении веков. В настоящее время баронов только поощряют многочисленные государственные контракты, которые мы им предоставляем, но рост профсоюзов и антибизнес-идеи представляют угрозу для их привилегий..."
 ww1_hungary.57.a: "Разве рабочие действительно имеют значение?"
 ww1_hungary.58.t: "Расцвет акционерных горнодобывающих компаний"
 ww1_hungary.58.d: "Начиная с середины 1800-х годов, горнодобывающая промышленность действительно начала развиваться в Венгрии. По мере того, как эти бароны пожинали плоды, они только укреплялись и расширяли свои владения на новые земли и диверсифицировали свою добычу с одного ресурса на многие, такие как: уголь, железо и известь. Венгерская генеральная угольная горнодобывающая акционерная компания (основана 9 июня 1891 года) стала ключевым игроком и одной из самых могущественных отраслей в нашей стране. Они не просто добывают ресурсы, они контролируют их. Они владеют большими участками земли и финансируют железные дороги, города, а также владеют универсальными магазинами, ресторанами и аптеками. Всё это для укрепления своего господства и владения промышленностью в этих городах. Кстати, о цементе: новый цементный завод открылся в Северной Венгрии, а также недавно были построены известковые печи, лесозаготовки и расширение угольных шахт Татабанья в Трансданубии."
 ww1_hungary.58.a: "Рад это слышать!"
 ww1_hungary.59.t: "Инаугурационная речь Иштвана Сабо в парламенте"
 ww1_hungary.59.d: "Иштван Сабо из Партии мелких фермеров имел привилегию открыть парламент превосходной речью: «Зал заседаний быстро наполнился, потому что по коридору разнеслась весть, что человек в сапогах, с отложным воротником и сомодьским акцентом говорит внутри очень умные вещи. Говорил Иштван Сабо, великий Атади, который объяснял лозунг и позицию Фермерской партии. Каким-то образом своими первыми предложениями он развеял дремоту, висевшую в комнате, его голос, этот глубокий, гибкий, полнозвучный орган, наполнил воздух и влил свежие краски в серость. Округлые, чеканные предложения просто, естественно следовали одно за другим и распространяли неискушённые истины Иштвана Сабо»"
 ww1_hungary.59.a: "Хорошо продуманная речь"
 ww1_hungary.59.b: "Кого волнует нытьё этого крестьянина?"
 ww1_hungary.60.t: "Открытие Будапештского международного лётного соревнования"
 ww1_hungary.60.d: "Впервые в истории Будапешт имеет захватывающую привилегию провести Международное лётное соревнование, привлекая авиаторов со всей Европы! Несмотря на палящую и почти невыносимую жару, многие самолёты летали и привлекали любопытных зрителей из всех социальных классов Будапешта!"
 ww1_hungary.60.a: "Воистину, вершина технологий!"
 ww1_hungary.61.t: "Завершение Будапештского международного лётного соревнования"
 ww1_hungary.61.d: "После 12 захватывающих дней истории авиации мероприятие подошло к концу. Оно дало интересное представление о зарождающейся авиационной практике и самих авиаторах, включая француженку! Мероприятие вызвало интерес по всей империи и Германии; однако ему мешала часто ужасная погода и множество невыплаченных долгов..."
 ww1_hungary.61.a: "Было весело!"
 ww1_hungary.62.t: "Обеспокоенность по поводу продовольственной стабильности"
 ww1_hungary.62.d: "Наша хрупкая экономика может не выдержать долгой войны. Поля недопроизводят, а угольные фабрики начинают подвергаться постоянному стрессу и находиться на грани краха. Мы не можем сидеть сложа руки, нам нужно либо перевести наши военные усилия на полную мощность, либо подготовиться к долгой и жестокой войне на истощение..."
 ww1_hungary.62.a: "Ну, это нехорошо!"
 ww1_hungary.63.t: "Лидер румынской партии (в венгерском парламенте) встретится с Иштваном Тисой и обратится за советом к Францу Фердинанду"
 ww1_hungary.63.d: "Лидеры румынских партий как из Трансильвании, так и из Румынии ведут переговоры с Иштваном Тисой и нынешним премьер-министром Венгрии Ласло Лукачем уже около 2 лет, но не достигли большого успеха. Наш союз с Румынией имеет решающее значение для противодействия России; однако из-за развивающихся движений в Трансильвании наш союз с ними находится под угрозой... Из-за упрямства Венгрии трансильванские румыны начинают ставить под сомнение весь формат дуалистической монархии. Петер Михайи, трансильванский румын в венгерском парламенте, скоро встретится с Тисой и Лукачем и ищет совета эрцгерцога по составлению списка требований для передачи Тише и Лукачу..."
 ww1_hungary.63.a: "Набор требований, который Венгрия может легко истолковать"
 ww1_hungary.63.b: "Набор очень мягких требований"
 ww1_hungary.64.t: "Петер Михайи встречается с Иштваном Тисой и Ласло Лукачем"
 ww1_hungary.64.d: "Петер Михайи (трансильванско-румынский член парламента и брат Виктора Михайи де Апша) и небольшой комитет встретились с Иштваном Тисой и Ласло Лукачем в квартире Тиши. Встреча была назначена после того, как Тиса заверил, что Михайи и Румынская национальная партия «иногда вынуждены занимать бескомпромиссный тон» из-за радикалов в партии, но тем не менее полностью поддерживают нынешнюю конституцию Венгрии»; Михайи представил Тише и Лукачу список из 11 требований. Они включали уроки румынского языка на всех уровнях в государственных, муниципальных и конфессиональных школах; большую автономию для Униатской церкви; использование румынского языка в государственном управлении и судах; полную свободу собраний и прессы; и около пятидесяти парламентских мест, чтобы отражать их долю населения..."
 ww1_hungary.64.a: "Они сошли с ума! Мы можем предложить только экономические и церковные уступки!"
 ww1_hungary.65.t: "Петер Михайи возвращается, чтобы проинформировать Франца Фердинанда"
 ww1_hungary.65.d: "Встреча Михайи с Тисой и Ласло Лукачем не оправдала его ожиданий. Когда Михайи представил свой список требований (которые были рекомендованы Францем Фердинандом), Тиса отклонил большинство из них и предложил только некоторые экономические и церковные уступки."
 ww1_hungary.65.a: "Если Венгрия хочет быть упрямой, посоветуйте Михайи прекратить переговоры!"
 ww1_hungary.66.t: "Учреждение Архиепархии Хайдудорог"
 ww1_hungary.66.d: "Около десятилетия предпринимались попытки учредить Архиепархию Хайдудорог, после долгого ожидания и некоторых убеждений с нашей стороны и со стороны Австрии Папа решил предоставить Архиепархию. Теперь всё, что нам нужно, — это чтобы Франц Иосиф создал её, а Папа официально признал это. Это значительно расширит влияние Греко-католической церкви в Трансильвании, но ценой лишения Румынской православной церкви значительной автономии. Не то чтобы нас это волновало."
 ww1_hungary.66.a: "Отличное развитие событий"
 ww1_hungary.67.t: "Архиепархия Хайдудорог"
 ww1_hungary.67.d: "Около десятилетия предпринимались попытки учредить Архиепархию Хайдудорог, после долгого ожидания и некоторых убеждений со стороны Австрии и Венгрии Папа решил предоставить Архиепархию. Новая Архиепархия будет охватывать большую часть Трансильвании и Альфёльда и значительно расширит католическое влияние в этом районе, но ценой лишения Румынской православной церкви некоторой автономии. Тем не менее, этого момента давно ждали, и он нуждается только в одобрении императора."
 ww1_hungary.67.a: "ius supremi patronatus"
 ww1_hungary.68.t: "Архиепархия Хайдудорог"
 ww1_hungary.68.d: "Около десятилетия предпринимались попытки учредить Архиепархию Хайдудорог в венгерской Трансильвании, после долгого ожидания и некоторых убеждений со стороны Австрии и Венгрии Папа решил принять её. Она была учреждена императором Францем Иосифом через ius supremi patronatus, и теперь наша очередь принять её Папской буллой."
 ww1_hungary.68.a: "Christifideles Graeci"
 ww1_hungary.69.t: "Учреждение Архиепархии Хайдудорог"
 ww1_hungary.69.d: "Около десятилетия предпринимались попытки учредить Архиепархию в венгерской Трансильвании и Альфёльде; наконец, после некоторых убеждений со стороны Австро-Венгрии Папские государства приняли это. Архиепархия была официально оформлена как австрийским императором и венгерским королём Францем Иосифом, так и Папой [PAP.GetLeader]. Однако последовала значительная реакция со стороны румын, живущих в Трансильвании, из-за того, что это лишает их церковь значительной автономии. Папа [PAP.GetLeader] сейчас рассматривает возможность пересмотра Архиепархии, но нет подтверждения, когда или произойдёт ли это."
 ww1_hungary.69.a: "Это возмутительно!"
 ww1_hungary.69.b: "Всё в порядке, как есть"
 ww1_hungary.69.c: "В Европе есть рыбы и поважнее..."
 ww1_hungary.69.e: "Это пик игрового процесса Папских государств?"
 ww1_hungary.70.t: "Петер Михайи возвращается, чтобы снова поговорить с Тисой"
 ww1_hungary.70.d: "Петер Михайи вернулся, чтобы обсудить с Тисой новую Архиепархию, поскольку она сильно разозлила трансильванских румын и привела к многочисленным протестам. Он призывает Тишу разрешить вернуть часть территории Архиепархии румынам..."
 ww1_hungary.70.a: "Наверное"
 ww1_hungary.70.b: "Н-Е-Т"
 ww1_hungary.71.t: "Смерть Йожефа Синньеи"
 ww1_hungary.71.d: "Сегодня скончался Йожеф Синньеи. Йожеф Синньеи был известным библиографом, написавшим множество замечательных научных и исторических работ. Он стал первым лейтенантом во время венгерской революции 1848 года. После этого он стал библиотекарем и библиографом/историком и приложил большие усилия для Национальной газетной библиотеки, собирая газеты из Трансильвании в конце 1880-х годов для ведения записей. В 1883 году он был членом-основателем Венгерского исторического общества, членом Венгерского геральдического и генеалогического общества с момента его основания в 1883 году, а также членом Национального совета музеев и библиотек."
 ww1_hungary.71.a: "Мы будем вечно благодарны за его работу!"
 ww1_hungary.72.t: "Иштван Тиса встречается с Румынской национальной партией"
 ww1_hungary.72.d: "Иштван Тиса снова решил встретиться с Румынской национальной партией в надежде раз и навсегда решить grievances трансильванских румын, поскольку это может быть его последний шанс. К нашему разочарованию, Румынская национальная партия представила ещё более длинный список требований, включая: обучение румынских учеников должно вестись на румынском языке; правительство должно изменить Статью XXVII от 1907 года и признать право двух румынских конфессий содержать школы даже там, где церковные школы уже были закрыты. Более того, румынские церкви должны быть наделены правом инспектировать церковные начальные школы, а государственные школьные инспекторы должны выбираться из тех, кто благосклонно относится к обучению на румынском языке. Государственные школьные инспекторы должны контролировать школы совместно с церквями и действовать единообразно в дисциплинарных процедурах. Также требовалось, чтобы священники могли временно наниматься в качестве учителей, а их церкви могли бы также создавать румыноязычные средние и профессиональные школы. Для достижения этой цели правительство должно оказывать финансовую помощь церквям. Обязательное преподавание румынского языка и литературы и право конфессий и обществ создавать школы-интернаты в румыноязычных регионах также были оговорены в меморандуме. Обучение румынских учеников религии должно повсеместно проводиться румынами. Должно уделяться должное уважение традициям румынского народа, и это должно быть должным образом отражено в учебных планах. В документе также повторялась необходимость вывода румынских приходов из Хайдудорогской епархии, и рассматривались grievances румынских церквей."
 ww1_hungary.72.a: "Ага, они слетели с катушек"
 ww1_hungary.72.b: "Если это абсолютно необходимо..."
 ww1_hungary.73.t: "Переговоры Венгрии с трансильванскими румынами не приносят плодов"
 ww1_hungary.73.d: "Иштван Тиса ведёт переговоры с Румынской национальной партией (в Венгрии) около 3 лет, но всё ещё не видит успеха. У Румынской национальной партии есть внушительный список требований, которые никогда не пройдут из-за упрямства Тиши и его стойкого антидемократического отношения. Если мы не сохраним лояльность румын, мы можем увидеть, как унионистское рвение Румынии приведёт их в Антанту..."
 ww1_hungary.73.a: "Посоветуйте Тише сделать перерыв в переговорах"
 ww1_hungary.74.t: "Переговоры Венгрии с трансильванскими румынами приносят плоды"
 ww1_hungary.74.d: "После 3 долгих лет Иштван Тиса добился прорыва с Румынской национальной партией. Правда, ценой значительной венгерской власти в Трансильвании; однако лояльность румын внутри Империи, наконец, может быть обеспечена. Или, по крайней мере, мы на это надеемся!"
 ww1_hungary.74.a: "Браво, Тиса!"
 ww1_hungary.75.t: "Значительный прорыв для румын в Трансильвании"
 ww1_hungary.75.d: "Румыны венгерской Трансильвании добились значительного прорыва, поскольку Румынской национальной партии (Венгрии) удалось успешно договориться о значительной румынской автономии, проживающей в Трансильвании, в их церквях, школах и местном управлении. Это, конечно, отлично; однако крик о воссоединении с их родиной теперь утих..."
 ww1_hungary.75.a: "Палка о двух концах..."
 ww1_hungary.79.t: "Treuga Dei"
 ww1_hungary.79.d: "Долгожданная война наконец наступила. Европа была на взводе последнее десятилетие, но теперь искры разожгли мировой пожар. Несмотря на явную оппозицию со стороны социалистов и некоторых социал-демократов, общественное отношение и отношение оппозиции к войне довольно обнадёживающие. Правительство едино в борьбе против наших врагов... достигнуто Treuga Dei (Божественный мир). Пока мы можем отложить наши разногласия и объединиться, чтобы отразить атаки врагов и сохранить наше венгерское государство... но если мы не будем действовать быстро, единство разрушится..."
 ww1_hungary.79.a: "Священный союз"
 ww1_hungary.80.ta: "Удержание власти в хаосе"
 ww1_hungary.80.da: "Национальная партия труда проделала отличную работу, осуществляя и укрепляя свою власть по всему королевству, но теперь, с началом Великой войны, весь наш прогресс поставлен на карту. Крайне важно, чтобы мы держали под контролем не только оппозицию, но и народ, потому что если война обернётся против нас либо на фронте, либо в тылу, наше правительство рискует рухнуть и быть заменённым..."
 ww1_hungary.80.a: "Мы примем это к сведению"
 ww1_hungary.81.t: "Провал Национальной партии труда"
 ww1_hungary.81.d: "Последние два года в Венгрии были абсолютным политическим хаосом. Национальная партия труда использовала железный кулак, чтобы доминировать в политике, и делала это в значительной степени при поддержке короля, который хотел видеть результаты после катастрофических 4 лет Веркле и политического кризиса 1905-06 годов. Но после хорватского хаоса, провала с армейским законопроектом после 2 лет и теперь убийства Иштвана Тиши и Кровавого четверга... этого достаточно. NMP провалилась, и Ласло Лукач подал прошение об отставке королю..."
 ww1_hungary.81.da: "Последние два года в Венгрии были абсолютным политическим хаосом. Национальная партия труда использовала железный кулак, чтобы доминировать в политике, и делала это в значительной степени при поддержке императора, который хотел видеть результаты после катастрофических 4 лет Веркле и политического кризиса 1905-06 годов. Но после хорватского хаоса, провала с армейским законопроектом после 2 лет и теперь убийства Иштвана Тиши и Кровавого четверга... этого достаточно. NMP провалилась, и Ласло Лукач подал прошение об отставке императору..."
 ww1_hungary.81.a: "Господин Хадик?"
 ww1_hungary.81.b: "Кто теперь выйдет на арену в Венгрии?"
 ww1_hungary.82.t: "Тупик в парламенте"
 ww1_hungary.82.d: "Компромиссное правительство теперь может быть успешно назначено, но проблемы, которые мучили парламент последние 5 лет, всё ещё сохраняются. Из-за жёсткого тупика между F48P и NMP и слабой Конституционной партии ясно, что премьер-министр, [HUN.GetLeader], должен вести переговоры, чтобы чего-то добиться в парламенте. Раздражающий, но необходимый шаг..."
 ww1_hungary.82.a: "Почему мы не можем все быть друзьями?"
 ww1_hungary.83.t: "F48P и NMP приглашены к столу переговоров"
 ww1_hungary.83.d: "Поскольку решения не видно, наш единственный выход — дискурс...\n\nКризис армейского вопроса: Мы должны финансировать общую армию, которую мы разделяем с Австрией; однако F48P решительно против этого, поскольку они требуют, чтобы венгерский был командным языком, как и немецкий. NMP хочет принять этот законопроект без каких-либо уступок и отказывается сотрудничать, пока это не будет сделано.\n\nЗаконопроект об избирательном праве: F48P и демократы-социалисты давно добиваются всеобщего избирательного права для мужчин, чему NMP противится, поскольку они опасаются, что это ослабит политическую элиту. Чего также опасается Конституционная партия, но они более склонны к компромиссу по этому вопросу.\n\nПромышленные регламенты: NMP продвигает либерализм и отменила регламенты, чтобы сохранить промышленность сильной и в руках власти. F48P, с другой стороны, хочет ввести регламенты, чтобы поднять рабочий класс...\n\nПерво-наперво: Армейский законопроект..."
 ww1_hungary.83.a: "Лоббировать Австрию для признания венгерского командным языком"
 ww1_hungary.83.b: "Армейский законопроект в обмен на регламенты..."
 ww1_hungary.83.b.tt: "Мы попытаемся принять армейский законопроект в обмен на больше промышленных регламентов"
 ww1_hungary.83.c: "Армейский законопроект в обмен на расширенное избирательное право..."
 ww1_hungary.83.c.tt: "Мы попытаемся принять армейский законопроект в обмен на умеренно расширенное избирательное право"
 ww1_hungary.83.e: "Никаких корректировок не требуется..."
 ww1_hungary.83.e.tt: "Мы попытаемся принять законопроект как есть"
 ww1_hungary.84.t: "Отправить жандармерию в Трансильванию"
 ww1_hungary.84.d: "С началом войны мы должны уделить первостепенное внимание обороне нашей земли. Особенно Трансильвании, на которую, без сомнения, засматривается Румыния и которая испытывает цыганские симпатии. 40 тысяч человек были отправлены в Трансильванию для её охраны на случай тяжёлых времён..."
 ww1_hungary.84.a: "Это необходимо"
 ww1_franz_austria_rework.1.t: "Австрия готовит возмутительные требования к Сербии!"
 ww1_franz_austria_rework.1.d: "После убийства Франца Фердинанда Австрия готовит предъявить Сербии крупные требования; такие, которые они, без сомнения, не смогут принять и которые спровоцируют вмешательство России. Когда мы оказываемся на грани войны, наша реакция критична..."
 ww1_franz_austria_rework.1.a: "Советовать осторожность!"
 ww1_franz_austria_rework.1.b: "Мы настроены решительно!"
 ww1_franz_austria_rework.2.t: "Венгрия призывает нас быть более снисходительными"
 ww1_franz_austria_rework.2.d: "Венгрия призывает нас дать Сербии больше времени, чтобы дистанцироваться от убийства, и решить проблему дипломатическим путём, а если война неизбежна, избегать любой аннексии Сербии или Черногории. Венгрия также нервничает из-за неопределённой позиции Румынии и Болгарии"
 ww1_franz_austria_rework.2.a: "Мы можем согласиться на отсутствие аннексий"
 ww1_franz_austria_rework.2.b: "Будь я проклят, если позволю Венгрии указывать мне!"
 ww1_franz_austria_rework.3.t: "Венгрия обещает полную поддержку"
 ww1_franz_austria_rework.3.d: "В условиях быстро растущего хаоса Венгрия пообещала свою полную поддержку в случае будущей войны против Антанты..."
 ww1_franz_austria_rework.3.a: "Великие умы мыслят одинаково!"
 ww1_franz_austria_rework.4.t: "Австрия соглашается на отсутствие аннексий"
 ww1_franz_austria_rework.4.d: "Австрия соглашается на отсутствие аннексий Сербии и Черногории; однако они по-прежнему весьма настроены на войну, и позиция Румынии и Болгарии всё ещё неопределённа... Похоже, Германии придётся применить свою магию к ним..."
 ww1_franz_austria_rework.4.a: "Впереди неопределённые времена..."
 ww1_croatia.1.t: "Результаты хорватских выборов"
 ww1_croatia.1.d: "Политическая нестабильность в хорватском банате после эпохи авторитарного правления и сербофобии Павла Рауха привела к ужасной ситуации. Никола Томашич вступил в должность бана в феврале 1910 года, но его преследовали внутренние распри внутри его собственной партии, Хорватско-сербской коалиции, что привело его к роспуску парламента дважды и теперь к назначению выборов. Выборы увенчались успехом, позволив его партии получить большинство; однако проблемы всё ещё сохраняются..."
 ww1_croatia.1.a: "Хорваты требуют слишком многого!"
 ww1_croatia.1.b: "Хорваты спели..."
 ww1_croatia.2.t: "Внеочередные выборы в Хорватии"
 ww1_croatia.2.d: "Продолжая нарастать нестабильность в хорватском банате, бан доктор Никола Томашич из Кораны назначил очередные выборы с целью получения его партией (Партия народного прогресса) безоговорочного большинства; однако, вопреки его цели, партия теперь оказалась в меньшинстве по отношению к Партии чистых прав и Хорватско-сербской коалиции..."
 ww1_croatia.2.a: "Очередная неудачная попытка..."
 ww1_croatia.2.b: "Я думал, Венгрия держит это под контролем?"
 ww1_croatia.3.t: "Хорватская конституция приостановлена"
 ww1_croatia.3.d: "После отставки хорватского бана Томашича Славко Цувай из Иванске взошёл на пост бана. Он немедленно попытался разорвать хорватско-сербскую коалицию, но безуспешно. Затем он распустил парламент и теперь решил приостановить хорватскую конституцию на время..."
 ww1_croatia.3.a: "Ситуация быстро накаляется"
 ww1_croatia.4.t: "Покушение на Славко Цувая"
 ww1_croatia.4.ta: "Славко Цувай убит"
 ww1_croatia.4.d: "Славко Цувай немедленно сделал себя врагом хорватского народа, распустив парламент и приостановив действие конституции. Масла в огонь подлила и недавняя агрессия Сербии. Славко Цувай должен был присутствовать на торжественном праздновании 25-летия деятельности провинциального школьного суперинтенданта Антуна Цувая, брата бана, и по этому случаю в Загребе собралось около 800 учителей со всей страны. Церемония проходила в большом зале Учительской школы на улице Медуличева. Бан должен был прибыть на мероприятие на машине, но когда он проезжал мимо, потенциальный убийца, Лука Юкич, выстрелил в машину из пистолета. К счастью, бан не пострадал, но советник бана был ранен и впал в кому. Юкич затем побежал по улице, когда люди начали его преследовать. Городской стражник попытался остановить его, но был застрелен, а другой полицейский был ранен в руку. Погоня закончилась у здания университета, где его поймали учитель и коммивояжёр. Позже он заявил, что намеренно бежал туда, потому что хотел оказаться там, где всё началось..."
 ww1_croatia.4.da: "Славко Цувай немедленно сделал себя врагом хорватского народа, распустив парламент и приостановив действие конституции. Масла в огонь подлила и недавняя агрессия Сербии. Опасаясь кризиса, он вскоре был уволен; однако его действия не были забыты так скоро. По пути на ужин с государственными чиновниками, включая нового бана, он был застрелен вместе со своей женой и их охранником неизвестным убийцей..."
 ww1_croatia.4.a: "Сколько же насилия!"
 ww1_croatia.4.b: "Ну...."
 ww1_croatia.5.t: "Студенческие протесты в Загребе"
 ww1_croatia.5.d: "Из-за беспорядков в Хорватии и разочарования правлением Славко Цувая студенты Загреба заняли Загребский университет, рассчитывая на неприкосновенность университетской территории после того, как полиция запретила объявленный протестный митинг. При первых словах первого оратора полиция ворвалась в университетский сад с обнажёнными саблями, 15 студентов были ранены, а рассредоточившаяся молодёжь демонстрировала по всему городу весь вечер. Столкновения продолжались всю ночь, а на следующий день была объявлена забастовка. Студенты ворвались в здание университета, забаррикадировались и вывесили чёрный флаг, заявив, что ответят силой на силу. Такая твёрдая позиция удивила власти. В здании находилось более 300 студентов, и осада длилась 36 часов. Такая ситуация была совершенно новой для властей. Ситуация разрешилась тем, что профессоров попросили выступить посредниками между студентами, и им было дано удовлетворение; полиция покинула территорию университета. Студенты разошлись, и конкретных последствий пока нет..."
 ww1_croatia.5.a: "Этим радикальным славянам нужно преподать урок!"
 ww1_croatia.6.ta: "[HUN.GetLeader] назначает Ивана Скерлеца хорватским баном"
 ww1_croatia.6.tb: "[HUN.GetLeader] изгоняет «Совершенно правую» коалицию и назначает Ивана Скерлеца"
 ww1_croatia.6.da: "Хорватский хаос не был утихомирен. Хотя конституция приостановлена, Хорватия не избавилась от проблем, вызвавших это приостановление. Теперь, когда Скерлец стал баном, мы можем попытаться вести переговоры с хорватскими чиновниками и восстановить сердечные отношения, столь важные для Аусглейха...."
 ww1_croatia.6.db: "Спорная «Совершенно правая коалиция», которую мы допустили к власти в Хорватии, мало кого осчастливила. Она успокоила радикальных сербов и хорватов, но они не будут удовлетворены, пока не добьются либо триализма, либо независимости, и это расстроило католическое духовенство и всё ещё влиятельную старую гвардию. Их время прошло, и теперь мы можем назначить умеренного, который удовлетворит лучшие стороны обоих миров..."
 ww1_croatia.6.a: "Пришло время восстановить порядок в Хорватии"
 ww1_croatia.6.b: "Кто вообще назначил этих дураков?"
 ww1_croatia.7.t: "Тиса начинает переговоры со Скерлецем и хорватскими чиновниками"
 ww1_croatia.7.d: "Недавно назначенный хорватско-словацкий бан Скерлец взялся за работу с одной ключевой целью. Решить хорватскую проблему под руководством Тиши. Но чтобы что-то получить, нужно что-то дать. После принятия Железнодорожной прагматики (закона, предписывающего использовать только венгерский язык для железнодорожной системы в Хорватии) сербы и хорваты alike протестовали против него. Возможно, если мы отменим этот закон, мы сможем восстановить лояльность хорватских оппозиционных партий..."
 ww1_croatia.7.a: "Если это удовлетворит хорватов..."
 ww1_croatia.7.b: "Мы не будем поддаваться таким требованиям!"
 ww1_croatia.8.t: "Иван Скерлец формирует коалицию"
 ww1_croatia.8.d: "После отмены Железнодорожной прагматики ХСК (Хорватско-сербская коалиция) потеплела к Скерлецу и согласилась не нарушать единство баната при условии, что хорватская конституция будет восстановлена."
 ww1_croatia.8.da: "После отмены Железнодорожной прагматики ХСК (Хорватско-сербская коалиция) потеплела к Скерлецу и согласилась не нарушать единство баната при условии, что Хорватский сабор будет восстановлен."
 ww1_croatia.8.a: "Похоже, у нас есть сделка!"
 ww1_croatia.9.t: "Хорватская конституция восстановлена"
 ww1_croatia.9.d: "После переговоров со Скерлецем и официальными лицами ХСК было достигнуто соглашение о восстановлении хорватской конституции; без сомнения, благодаря политическому гению Иштвана Тиши. Тщательное единство между Венгрией и Хорватией было сохранено! Иван Скерлец достиг соглашения с ХСК не ущемлять хорватские права при условии, что ХСК не будет поднимать пагубно разделяющие вопросы. Скерлец останется неприсоединившимся ни к какой партии, но в следующем месяце проведёт выборы."
 ww1_croatia.9.a: "Одно из многих чудес Тиши!"
 ww1_croatia.9.b: "Рад, что Венгрия решила эту проблему"
 ww1_croatia.10.t: "ХСК доверено правительство"
 ww1_croatia.10.d: "Видя, что хорватский кризис не решается сам собой, необходимо, видимо, изменить нашу политику. Милан Ройц из хорватского Департамента культов и образования стал новым баном. ХСК всегда был слегка непокорным по отношению к Будапешту; однако они могут быть эффективны в умиротворении Хорватии. Пока..."
 ww1_croatia.10.a: "Будем надеяться, что эта попытка окупится"
 ww1_croatia.11.t: "Иштван Тиса начинает переговоры с ХСК"
 ww1_croatia.11.d: "ХСК не пытался скрывать свои попытки добиться дальнейшей хорватской автономии; что отражено в их предложениях, которые они представили Иштвану Тише. У ХСК есть некоторые весомые требования:\n 1. Отменить Железнодорожную прагматику (закон, предписывающий использование венгерского языка в железнодорожных системах)\n 2. Ослабить визовые требования для Сербии и Черногории\n 3. Увеличить единовременную выплату Хорватии (деньги, разделяемые между Хорватией и Венгрией) с 44% до 48%"
 ww1_croatia.11.a: "Предложить 1 и 3, если Ройц уйдёт в отставку"
 ww1_croatia.11.b: "Приостановить их парламент, пока они не подчинятся"
 ww1_croatia.12.t: "ХСК трещит под давлением"
 ww1_croatia.12.d: "После приостановки работы их парламента ХСК быстро стал непокорным и протестовал, но после подавлений и изоляции политиков для переговоров был достигнут прогресс, и они согласились сформировать коалицию с кандидатом по нашему выбору, при условии, что Железнодорожная прагматика будет отменена"
 ww1_croatia.12.a: "Мы используем авторитарное в авторитарно-демократическом!"