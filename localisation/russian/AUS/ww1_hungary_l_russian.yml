 HUN_treuga_dei_modifier: "Treuga Dei"
 HUN_corpus_separatum_fiume: "Corpus Separatum Фиуме"
 HUN_corpus_separatum_fiume_desc: "Основанный как Corpus separatum (Фиуме) в 1779 году, город Фиуме был включён в состав венгерских коронных земель, будучи отделённым от остальных хорватских земель, которые его окружали. Это порт, соединяющий Венгрию с морем, и богатый город с высоким торговым потенциалом в землях Святого Иштвана."
