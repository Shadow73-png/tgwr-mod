 HUN_prevent_economic_canabalization: "Предотвратить экономическое самоуничтожение"
 HUN_prevent_economic_canabalization_desc: "Ситуация стала довольно... отчаянной. Если говорить мягко, наша политика против баронов настроила их против нас, разрушая нашу экономику по мере уменьшения их влияния. Чтобы предотвратить полный экономический коллапс, мы должны взять небольшие кредиты и стимулировать и без того слабую экономику."
