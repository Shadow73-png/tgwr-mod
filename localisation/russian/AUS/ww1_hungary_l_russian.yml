 HUN_treuga_dei: "Treuga Dei"
 HUN_treuga_dei_desc: "Божественный мир (Treuga Dei) достигнут в парламенте! По крайней мере, на данный момент... Тем не менее, партии в парламенте объединились для поддержки военных усилий, за исключением радикальных социал-демократов. Чтобы выиграть эту войну, мы не можем тратить время на распри. Но мы не можем быть друзьями вечно. Чтобы сохранить единство парламента, мы должны победить, и быстро!"
