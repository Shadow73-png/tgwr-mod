 HUN_army: "Затенённая армия"
 HUN_army_desc: "Венгерская армия или силы внутренней обороны в настоящее время не более чем хорошо содержимое ополчение, без какого-либо тяжёлого вооружения, полностью зависящее от австрийских войск. Войска хорошо обучены, но им катастрофически не хватает огневой мощи."
 HUN_transitioning_economy: "Переходная экономика"
 HUN_transitioning_economy_desc: "Главной силой Венгрии всегда было её сельское хозяйство. Однако у правительства есть планы индустриализации, в основном в крупнейших городах страны. Сельское хозяйство тоже не в лучшей форме: свиная лихорадка и недавние засухи также затрудняют положение фермеров."
 HUN_modify_eco_tt: "Изменить §Y$HUN_transitioning_economy$§! на"
 HUN_serb_states_modifiers: "Разгневанные сербские общины"
 HUN_rail_state_bonus: "Значительное развитие железных дорог"
