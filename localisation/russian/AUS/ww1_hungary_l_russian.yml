 HUN_assist_urbanization: "Содействовать урбанизации"
 HUN_stimulate_beet_sugar_production: "Помочь свеклосахарным магнатам"
 HUN_stimulate_beet_sugar_production2: "Стимулировать производство свекловичного сахара"
 HUN_pass_minor_military_bills: "Принять законопроекты о снабжении и закон о жандармерии"
 HUN_gratify_greek_catholics: "Удовлетворить греко-католиков"
 HUN_accept_galacian_refugees: "Принять галицийских беженцев"
 HUN_croatian_electoral_law: "Расширение избирательных прав в Хорватии"
 HUN_croatian_electoral_law_desc: "Наши первые реформы будут включать широкое внедрение демократических институтов, создание избирательных центров в Хорватии, удовлетворяя население, которое чувствовало себя обделённым. Это также создаст более дружественную атмосферу в Белграде, позволяя нам вести переговоры и остановить многие атаки в южных регионах."
 HUN_tax_reform_of_get_year: "Налоговая реформа [GetYear] года"
 HUN_tax_reform_of_get_year_desc: "Чтобы раскрыть весь экономический потенциал венгерских территорий, мы используем нашу власть для проведения широкомасштабной налоговой реформы, чтобы быстро увеличить наши доходы, давая нам потенциал для дальнейшего развития."
 HUN_prepare_for_balkan_volatility: "Подготовиться к балканской нестабильности"
