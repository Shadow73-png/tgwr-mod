 HUN_constitution_party_fallout_avoided: "Залатать разрыв между традиционными §Cлибералами§! и §Gдиссидентами§!"
 HUN_croatian_constitution_suspended: "Конституция [CRO.GetFlag]§YХорватии§! §Rприостановлена§!"
 HUN_constitutional_party_fallout: "Конституционная партия НЕ в оппозиции"
 HUN_people_dont_like_tisza: "Не в оппозиции к текущему правительству"
 HUN_war_economy_cat: "Продовольствие и неминуемый кризис"
 HUN_war_economy_cat_desc: "Экономика §YВенгрии§! (не говоря уже об Империи) не может выдержать затяжную войну: экономика медленно пожирает сама себя, а военная усталость и ненадёжное снабжение продовольствием создают деликатную ситуацию, чреватую полным коллапсом. Либо быстрое завершение этой войны, либо удержание наших меньшинств и правительства на плаву ещё немного — абсолютно необходимо...\n\n£consumer_goods_texticon §NПродовольственная стабильность:§!§Y [?HUN_food_stab_var]%§!\n\n§YПродовольственная стабильность, популярность идеологий, стабильность и поддержка войны§! — всё это может привести к полному §Rколлапсу!§!"
 HUN_alt_parliment_cat: "Орсагдьűлеш"
 HUN_alt_parliment_cat_desc: "Венгерский парламент — это двухпалатный законодательный орган, состоящий из нижней палаты из [?HUN_parliment_total_seats] мест. После прохождения через нижнюю палату законопроект передаётся в верхнюю палату, известную как Палата лордов (иногда переводится как Палата магнатов); эта палата является пережитком «управляемой демократии». Палата лордов редко имеет право отклонить законопроект, но может задержать его или подвергнуть тщательному рассмотрению.\n\n[HUN_parliment_desc]"
 HUN_parliment_desc_1: "§YВсего мест: 413\nНеобходимо для большинства: 207§!\n\n§YКоалиция F48P:§!\n§QF48P(Кошут)-[?HUN_F48P_k_seats]\nF48JP(Юст)-[?HUN_F48P_j_seats]§!\n048FG-[?HUN_048FG_seats]\nKNP-[?HUN_knp_seats]\n\n§Y«Партии 67-го года»:§!\n§CNMP-[?HUN_nmp_seats]§!\n§GКонституционная партия(OA)-[?HUN_oa_seats]§!\n\n§YПартии меньшинств:§!\n§6Румынская национальная партия-[?HUN_pnr_seats]§!\n§nСловацкая национальная партия-[?HUN_sns_seats]§!\n\nПрочие и независимые-[?HUN_other_independent_seats]\n[HUN_compromise_bill_alt]"
 HUN_compromise_bill_progress: "\nДолжна быть достигнута сделка между сталкивающимися F48P и NMP для принятия Армейского законопроекта и Законопроекта об избирательном праве, делая уступки и выдвигая требования по мере необходимости...\nКомпромисс по армейскому законопроекту: [HUN_army_bill_alt]\nЗаконопроект об избирательном праве: [HUN_suffrage_bill_alt]"
 HUN_compromise_bill_no: ""
