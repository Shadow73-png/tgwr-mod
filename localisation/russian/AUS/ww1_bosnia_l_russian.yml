 BOS_first_diet_elections: "Открытие Сейма"
 BOS_first_diet_elections_desc: "Учреждённый в феврале 1910 года Ландтаг фон Босниен унд дер Херцеговина, или Босанско-херцеговачки сабор на сербохорватском, является представительным собранием Боснийского кондоминиума. Выборы запланированы на май. Распределение голосов, вероятно, будет не по идеологическим линиям, а скорее по этническим, при этом каждая этническая группа планирует иметь одну доминирующую партию (или более) в законодательном органе."
 BOS_sno_name_focus: "Сербская народная организация"
 BOS_mpo_name_focus: "[BOS_muslim_party_name]"
 BOS_the_croatian_parties_focus: "Хорватские партии"
 BOS_sno_name_focus_desc: "Крупнейшая этническая группа в Боснии и Герцеговине добилась впечатляющих результатов на выборах. Все возможные места были выиграны ныне самой крупной фракцией в Боснийском сейме, насчитывающей 31 место. Сербы — самая непокорная национальность в кондоминиуме по отношению к Вене, поэтому мы опасаемся, как мы будем работать с таким большим объединённым блоком, который выступает против Вены ещё до того, как сессия началась."
 BOS_mpo_name_focus_desc: "[BOS_mpo_party], или [BOS_mpo_party_long], одержала впечатляющую победу над Мусульманской независимой партией на этих выборах, завоевав все места, отведённые для мусульман. Большинство руководителей партии и избранных лиц — беи и богатые мусульманские землевладельцы, но это не имело значения для народа. Возможной причиной такой убедительной победы может быть известная газета '[BOS_mpo_party]' 'Мусават', печатающаяся на кириллице и латинице. На первый взгляд, политическая партия кажется нейтральной по отношению к Вене, что может стать проблемой, если мы не решим её вовремя."
 BOS_the_croatian_parties_focus_desc: "После выборов хорваты оказались единственной национальностью, у которой не оказалось единой партии, возглавляющей все их места. Их голос разделился, потому что у ХНЗ возникла ссора с архиепископом Юраем Штадлером по поводу принятия католицизма как партийной ценности. ХНЗ пренебрёг требованиями, заявив, что все хорваты всех вероисповеданий могут вступать в партию и участвовать в её деятельности. Не довольный ответом, Штадлер создал ХКУ, партию, которая будет представлять схожие консервативные ценности, но с большим акцентом на веру. Хотя голосование, кажется, разделилось, пока мы не можем наблюдать глубоких разногласий между двумя хорватскими партиями."
 only_austria_can: "Только §Y[AUS.GetNameWithFlag]§! может завершить этот фокус"
 agree_on_budget_BOS: "Состоялась §YПервая сессия Боснийского сейма§!"
 BOS_if_bill_passes: "Если законопроект §Gпройдёт§! в §YБоснийском сейме§!:\n"
 BOS_road_construction_bill: "Законопроект о дорожном строительстве"
 BOS_road_construction_bill_desc: "Этот законопроект о дорожном строительстве, представленный нам Бурьяном, является крупной инвестиционной программой по строительству дорог. Бурьян потребовал от Сейма абсолютной поддержки. Этот законопроект, хотя и является всеобъемлющим и огромным улучшением для инфраструктуры, содержит трудноприемлемое требование. В законопроекте указано, что языком, используемым на вывесках и на железных дорогах, должен быть только немецкий и венгерский: нам ещё предстоит увидеть последствия такого требования."
 second_diet_session_ends: "§YВторая сессия Боснийского сейма§! заканчивается"
 third_diet_session_ends: "§YТретья сессия Боснийского сейма§! заканчивается"
 BOS_compulsory_education_law: "Законопроект об обязательном образовании"
 BOS_compulsory_education_law_desc: "Уровень грамотности в Кондоминиуме соответствует уровню грамотности в колониях других великих держав: почти 88% населения нашей страны неграмотны и не готовы к переменам от сельского, застойного и отсталого образа жизни. С этим предложенным законом мы закладываем краеугольный камень всего образования, делая существующее образование обязательным, по крайней мере, для первых четырёх классов. Это не принудительное изменение, поскольку оно учитывает разнообразие культур в регионе: женщины мусульманского вероисповедания, инвалиды и некоторые другие исключения разумно освобождаются от этого закона. Сейм, кажется, едины в этом вопросе, будем надеяться, что так всё и останется."
 BOS_allow_conversion_of_kmets: "Разрешить выкуп кметов"
 BOS_allow_conversion_of_kmets_desc: "В 1908 году, когда Австро-Венгрия официально аннексировала Боснию и Герцеговину, многие были разочарованы бездействием в вопросе крепостного права и перераспределения земель с целью замены феодальной системы. Одни защищают Вену, говоря, что Вена не допускает крепостного права и не форсирует этот вопрос, чтобы сохранить баланс в регионе. Другие считают, что Вене просто всё равно на эту землю. Что мы знаем, так это то, что Сейм вскоре проголосует по предложенному компромиссному закону, касающемуся этого вопроса."
 BOS_purge_german_in_communication: "Искоренить немецкий во внутренней коммуникации"
 BOS_purge_german_in_communication_desc: "Одной из многих проблем мусульманских, сербских и некоторых хорватских членов Сабора является присутствие немецкого языка практически во всей официальной внутренней коммуникации. Для страны, которая неграмотна даже на своём собственном языке, требование использовать немецкий для официальной деятельности неразумно. Сейм готовится отправить в Вену требование по этому вопросу. Некоторые рассматривают это как ответ на австрийский колониализм."
 BOS_postal_savings_bank: "Почтовый сберегательный банк"
 BOS_postal_savings_bank_desc: "Экономика этого региона отсталая и несовместима с остальной частью Империи, до такой степени, что здесь не существует собственного банка. Министерство финансов готовит предложение наконец-то построить его, но на не очень благоприятных для этносов кондоминиума условиях, поскольку они требуют большей автономии в экономике кондоминиума. Переговоры, безусловно, будут долгими, и этот закон может пройти не так гладко, как предыдущие."
 BOS_remove_hungarian_lang_from_railways: "Убрать венгерский с железных дорог"
 BOS_remove_hungarian_lang_from_railways_desc: "Политика венгерской короны предписывает использование венгерского языка на железнодорожных указателях, и поскольку большинство боснийских железных дорог считаются 'продолжением' железных дорог земель Святого Иштвана, боснийские указатели также пали жертвой мадьяризации. Боснийские железные дороги в основном используются для перевозки товаров, в основном древесины. Бизнесмены, говорящие на венгерском, уж точно не делают тяжёлую работу: её делают не говорящие по-венгерски трудолюбивые боснийцы, будь то сербы, хорваты или мусульмане, которые помогают перевозить товары. Этот законопроект предлагает, чтобы язык, используемый на вывесках, был языком земли, то есть основной язык для вывески в регионе будет зависеть от того, сколько на нём говорят, с соответствующими латино-кириллическими адаптациями. Компании по производству вывесок описывают эту перепалку как 'прибыльную'."
 BOS_appease_croats: "Умиротворить хорватов-католиков"
 BOS_appease_croats_desc: "Хорватские члены нашего парламента, как правило, лояльны Вене и принимают законы, предлагаемые Веной. Эту лояльность необходимо хвалить и вознаграждать, смещая наши интересы немного в их сторону, но ни в коем случае не потакая их идеям Триализма и подобной ерунды."
 BOS_appease_muslims: "Умиротворить боснийских мусульман"
 BOS_appease_muslims_desc: "Боснийские мусульмане, в отличие от сербов и хорватов в кондоминиуме, не являются националистической группой, а скорее хаотичным набором очагов, разбросанных по кондоминиуму, где они образуют относительное большинство в лучшем случае. Поскольку они не экспансионисты, их лучший выбор — постоять за себя. Это не будет изменением курса, поскольку Вена продвигала эту идею в течение долгого времени."
 BOS_form_the_control_committee: "Сформировать Контрольный комитет"
 BOS_form_the_control_committee_desc: "Иностранные компании слишком долго имели свободу извлекать боснийские ресурсы, такие как её роскошные леса, при этом соблюдая лишь самый минимум регулирования. Пришло время сформировать контрольный комитет, чтобы контролировать и наблюдать за исполнением контрактов иностранных компаний."
 BOS_cvijet_hrvatske: "Урок истории"
 BOS_cvijet_hrvatske_desc: "Утверждение, что северо-западные боснийские мусульмане являются этническими хорватами, — одно из самых разумных утверждений на полуострове, полном сказок. Это утверждение будет поддержано и использовано, чтобы стравить местное население друг с другом. Идея, по сути, в том, чтобы 'Разделяй и властвуй' с дополнительными шагами. Другим возможным побочным продуктом может стать постоянная хорватско-мусульманская коалиция, которая раз и навсегда может решить угрозу сербского обструкционизма. В любом случае, это авантюра, но, по крайней мере, хорошо просчитанная."
 BOS_tolerate_agitators: "Дать второй шанс"
 BOS_tolerate_agitators_desc: "Сербам здесь приходится нелегко, и у чиновников тоже были с ними проблемы. Большинство их организаций находятся под наблюдением, поскольку они часто не слишком мирные. Пришло время предложить возможность сотрудничества; ограничения на сербские СМИ будут ослаблены, при условии, что они останутся мирными и сблизятся с интересами Вены. Утверждается, что сделка одинаково щедра и наивна, что ещё предстоит выяснить..."
 BOS_begin_second_session: "Начать второй раунд"
 BOS_begin_second_session_desc: "Первая сессия Сейма прошла не так гладко, как многие надеялись. Было принято много законов, но проблемный законопроект о дорожном строительстве оказался слишком болезненным, чтобы с ним разбираться, настолько, что он в одиночку положил конец сессии. В конечном итоге законопроект должен быть принят, желательно как можно скорее в ходе этой сессии."
 BOS_dealing_with_protestors: "Реакция на столкновения студентов с полицией"
 BOS_dealing_with_protestors_desc: "Все видели, что произошло на улицах Сараево. Никто не ожидал такого ожесточённого сопротивления протестующих за дело, которое не связано напрямую с их правами или обязанностями. Такая смелая позиция против сомнительного закрытия венграми Хорватского сабора, тем не менее, должна быть осуждена, поскольку такие протесты угрожают разрушить и без того шаткую стабильность кондоминиума. С другой стороны, большинство мест в нашем Сейме не одобряют действия полиции во время этих событий. В любом случае, официальный и осторожный ответ Сейма должен быть направлен общественности."
 BOS_elect_council_boards: "Избрать советы управлений"
 BOS_elect_council_boards_desc: "Чтобы уменьшить нагрузку на администрацию Империи, на нас возложена задача постепенного улучшения текущего перенапряжения. В настоящее время во многих местах даже нет надлежащей администрации, например, региональных советов управлений. Такие простые выборы станут хорошим сигналом для Вены и улучшат административный хаос в регионе."
 BOS_send_memorandum: "Подготовить меморандум"
 BOS_send_memorandum_desc: "Назначен новый министр финансов. Сейм готовится проверить почву с помощью масштабного реформистского меморандума, сосредоточенного на расширении его полномочий, большей автономии в экономике кондоминиума и полной реорганизации многих аспектов рабочей этики Сейма и его выборов. Вероятно, этот меморандум будет представлен после дальнейшего обсуждения на отложенной межпартийной конференции."
 BOS_send_memorandum_tt: "§YПодготовить меморандум§!"
 BOS_inner_party_conference: "Межпартийная конференция"
 BOS_inner_party_conference_desc: "Дружеская межпартийная конференция была организована для обсуждения будущих законов в нерабочее время Сейма. Нужно обсудить некоторые вещи и, конечно же, подписать и одобрить меморандум как можно большим количеством членов прошлой сессии. Сразу после этой конференции планируется доставить меморандум новому генерал-губернатору Боснии, [BOS.GetLeader]."
 BOS_hospital_construction_bill: "Законопроект о строительстве больниц"
 BOS_hospital_construction_bill_desc: "Состояние кондоминиума требует модернизации всеми возможными способами. Здравоохранение — один из главных приоритетов, на котором нам нужно больше сосредоточиться. Такой законопроект был бы кстати, поскольку принятие universally accepted закона после стольких междоусобиц могло бы сгладить некоторые проблемы."
 BOS_second_road_bill: "Попытка второго законопроекта о дорогах"
 BOS_second_road_bill_desc: "Билински начал своё пребывание в должности решительно, возможно, слишком решительно и жёстко. Отклонив меморандум, предложенный Сеймом, с угрозами, он продолжал неуклонно продвигать законопроекты, вопросы и конфронтацию с оппозицией лицом к лицу. Сербская, в основном обструкционистская, сторона не одобряет эту смену руководства. Но бюджет должен быть принят, и этот предстоящий законопроект о дорогах — тоже. Это переработка старого законопроекта, который разорвал на части первую сессию Сейма..."
 BOS_third_times_the_charm: "Третий раз — не промах"
 BOS_third_times_the_charm_desc: "Вторая сессия Сейма разделила братьев и сестёр на ситуации, подобные смертельной схватке. Она в беспорядке, и мир кажется немыслимым. И всё же каким-то образом мы здесь, открываем сессию. Эта третья сессия открывается по необходимости, в основном из-за долгожданного принятия бюджета, о котором говорят только из-за того, что политикам больше даже не платят. Сейм зажат между молотом и наковальней, и пространство для манёвра всё меньше."
 BOS_something_here: "Закон об отставке членов Сейма"
 BOS_something_here_desc: "Недавно поступило предложение об установлении правил отставки члена Сейма. Это, безусловно, не вопрос высокой важности, но с ним нужно разобраться и обсудить его, потому что в настоящее время правила не очень хорошо определены и приносят пользу оппозиции."
 BOS_first_language_law: "Закон о первом языке"
 BOS_first_language_law_desc: "Языковой вопрос, который обсуждался с первых дней первой сессии, снова на столе. Уступки, возможно, наконец-то готовы быть сделаны, и пространство для прогресса видно. Неужели настало время наконец преодолеть это болезненное препятствие?"
 BOS_attract_austrian_investors: "Оставшиеся австрийские фонды"
 BOS_attract_austrian_investors_desc: "Из всех средств, выделенных Боснийскому сейму, некоторые всё ещё не потрачены. Их можно было бы использовать для улучшения уровня жизни, но для небольших вещей. Сейму также нужно заключить сделку с Веной и сделать лесное хозяйство и горнодобывающую промышленность немного более прибыльными. Да, на это, вероятно, и будут потрачены средства, если честно."
 BOS_law_on_language_of_condominum: "Закон о языке Кондоминиума"
 BOS_law_on_language_of_condominum_desc: "Согласно мнению некоторых, определённый прогресс был достигнут по предыдущему закону, связанному с этой языковой проблемой. Хорватские партии перешли к полному обструкционизму только из-за того, что государственным языком должен был стать сербохорватский вместо хорватского. Да, такое, казалось бы, неважное требование, поддерживаемое многими мусульманами, на самом деле является одним из многих источников великого раскола между хорватами и сербами. От старых обид нужно отказаться, поскольку для обоих, несомненно, хуже иметь немецкий или, упаси боже, венгерский в качестве официального языка. Этот закон предлагает сделать сербохорватский единственным признанным языком в кондоминиуме, что Вене не очень понравится, но это не должно вызывать беспокойства, поскольку принятие его в Сейме является текущим приоритетом."
 BOS_railway_bill: "Железнодорожный законопроект"
 BOS_railway_bill_desc: "С тех пор как австрийские власти пришли в Боснию и Герцеговину, велись некоторые работы по улучшению инфраструктуры. Теперь пришло время завершить большую часть этих проектов с помощью новой линии Яйце-Срнетица и дополнительного финансирования линии Сараево до Славонии."
 BOS_ff_power: "Петиция о Триализме"
 BOS_closure_from_above: "Закрытие сверху"
 BOS_closure_from_above_desc: "Непокорный Сейм пригрозил Вене отклонением бюджета на 1913 год в случае отклонения Веной предложения о языковом законе. Мягко говоря, Вена в ярости от таких действий, настолько, что многие права Сейма будут ограничены, возможно, даже произойдёт закрытие сессии."
 BOS_attempt_negotiations: "Восстановление отношений"
 BOS_attempt_negotiations_desc: "Некоторые говорят, что Вена обошлась с Боснийским сабором слишком сурово, в то время как другие согласны с принятыми мерами. Что ясно, так это то, что бюджет в конечном итоге должен быть принят, и для этого необходимо начать переговоры с обструкционистами."
 BOS_renegotiate_language: "Решить нерешаемое"
 BOS_renegotiate_language_desc: "Чтобы исправить ситуацию, особенно в области проблемного языкового закона, Билински возвращается с некоторыми уступками с другой стороны. По-видимому, они признают, что местное население не говорит на венгерском или австрийском, поэтому он принимает сербохорватский в качестве единственного официального языка, за некоторыми административными исключениями, которые всё ещё обсуждаются, насколько мы можем судить. Что ясно, так это то, что эту проблему необходимо решить до открытия четвёртой сессии Сейма с новым большинством в Сейме."
 language_bill_no_pass: "Языковой законопроект был §Yзаблокирован§! хорватами"
 BOS_SER_word_issue: "Медийный скандал радикалов"
 BOS_SER_word_issue_desc: "Все в последнее время читают новости в ожидании новых увольнений и запретов [BOS.GetLeader] на всё, что он (обоснованно!) считает предательским. Больше всего пострадали СМИ, особенно сербские. Поскольку ограничения никуда не денутся, многие члены СНО говорят об отставке в знак протеста против этих так называемых 'тоталитарных мер'. Сербское последнее предупреждение наносит удар снова."
 BOS_election_for_empty_seats: "Выборы на освободившиеся места"
 BOS_election_for_empty_seats_desc: "12 членов партии СНО оставили свои места в Сейме вакантными! На эти сенсационные новости нужно ответить новыми выборами, по крайней мере, частичными, на их места. Чтобы обеспечить баланс, они будут проводиться только среди сербских избирателей из-за многих сложностей избирательной системы Сейма. СНО, скорее всего, вернёт свои потерянные места, но не все так уверены в этом, поскольку в список для голосования вошла новая партия; более провенская и значительно более умеренная. Тем не менее, мы ничего не знаем и можем только надеяться на лучшее."
 BOS_approach_new_party: "Флиртовать с умеренными"
 BOS_approach_new_party_desc: "Частичные выборы стали неожиданностью для всех. Уже есть обвинения в фальсификации и подтасовке выборов, которые, как было доказано, не соответствуют действительности. Новая партия, хотя и провенская, никак не связана с властителями. Правда в том, что полиция присутствовала повсюду во время выборов и наказывала за недостойное поведение, что могло разозлить или напугать некоторых сторонников всё ещё более крупной обструкционистской СНО."
 BOS_fourth_ses_begin: "Четвёртый раз — не промах..."
 BOS_fourth_ses_begin_desc: "...или что-то вроде того. Четвёртая сессия наконец открывает первое заседание на стабильной основе. Новая партия открыла гораздо более широкие возможности для сотрудничества всех национальностей. Благодаря их голосам, голосам большинства назначенных религиозных чиновников, хорватов и нескольких умеренных мусульман, Сейм достиг стабильного большинства, поскольку все члены текущей коалиции, за исключением новой партии, были вовлечены практически во все законы, когда-либо принятые. Давайте приступим к делу!"
 BOS_land_redistribution: "Частичное перераспределение земли"
 BOS_land_redistribution_desc: "После долгих переговоров с мусульманами и смягчения их позиций наконец-то пришло время заняться законопроектом о перераспределении земли. Когда австрийцы только пришли сюда в 1878 году, более 90% земли в Боснии принадлежало мусульманам, даже несмотря на то, что они не были большинством или относительным большинством. Вопрос наконец-то будет решён, но, естественно, как компромисс."
 BOS_law_on_investments: "Закон об инвестициях"
 BOS_law_on_investments_desc: "Многие случайные законы и постановления всё ещё не существуют, что нормально для недавно организованных систем. Один из них — закон об инвестициях, или, лучше сказать, постановления об инвестициях. Сейчас самое время принять такую вещь, поскольку ходят слухи о дальнейших инвестициях в наши земли, и Сейм в последнее время в основном сосредоточен на состоянии экономики кондоминиума."
 BOS_indigenous_and_free_bank_law: "Закон о местном и свободном банке"
 BOS_indigenous_and_free_bank_law_desc: "Наш долгожданный Почтовый банк наконец-то построен после всего этого времени ожидания! Теперь Сейм стремится потребовать как можно больше умеренных реформ, чтобы получить хотя бы какой-то разумный уровень контроля за своей работой. Никто не слишком оптимистичен, поскольку напряжённость в Европе растёт, что означает, что Австрия может не одобрить идею больших свобод для этого Сейма..."
 BOS_the_show_goes_on: "Шоу продолжается"
 BOS_politics: "Политика"
 BOS_school_rework: "Начать реформу школьной системы"
 BOS_offer_manpower: "Предложить Австрии рабочую силу"
 BOS_offer_forest_concesions: "Предложить лесные концессии"
 BOS_village_patrols: "Организовать деревенские патрули"
 BOS_regional_schools: "Продолжить школьную реформу"
 BOS_second_election: "Вторые выборы"
 BOS_get_ready: "Подготовка сцены"
 BOS_tipping_the_scale: "Склонение чаши весов"
 BOS_le_ze_success: "Сложная паутина"
 BOS_pat_on_the_back: "Похлопывание по плечу"
 BOS_trialism: "Создать фракцию триализма"
 BOS_multiethnic: "Успешный многоэтнический проект"
 BOS_martial_law: "Ввести военное положение"
 BOS_trials: "Суды над нелояльными элементами"
 BOS_police_state: "Под бдительным оком"
 BOS_the_show_goes_on_desc: "Каким-то образом мы снова встретились. Многое произошло с момента внезапного окончания последней сессии. К счастью, стабильное большинство с прошлой сессии всё ещё держится твёрдо и едино. Министерство финансов попросило возобновить сессию Сейма, за что мы будем благодарны. Ужасы войны и раскол сербского голосования между проавстрийской примирительной стороной и враждебной оппозицией даёт больше пространства для манёвра проблемным политическим альянсам. Будем надеяться, что эта сессия принесёт реальные перемены."
 BOS_politics_desc: "Мы снова живы и активны! Чтобы обеспечить наше политическое существование, мы должны выйти за пределы кондоминиума. Чтобы достичь такого охвата, мы должны консолидировать то, что ещё не сделано в Сейме, и продвигаться везде, где можем."
 BOS_foreignstuff_desc: "Никто не знает, сколько ещё времени у нас есть, прежде чем министерство финансов или генерал-губернатор найдут причину закрыть сессию, поэтому мы должны быть максимально активными. Контакты с политиками со схожими целями за пределами кондоминиума должны стать новой целью и утверждением нашего присутствия на политической карте Австро-Венгерской империи, какой бы нелепой ни звучала такая фраза. Был бы полезен и своего рода балансирующий акт между обеими половинами Империи..."
 BOS_school_rework_desc: "Несколько проблем привлекли наше внимание в последнее время: непропорциональное соотношение учителей-иностранцев к 'нашим', неподобающая литература, старые школы и холодный и чрезмерно строгий подход к образованию. Всё это, безусловно, не будет решено так быстро, но Сейм сделает всё возможное."
 BOS_offer_manpower_desc: "Генерал-губернатор [BOS.GetLeader] недавно понял, что если бы он отправил несколько боснийских солдат в k.u.k., отношения между кондоминиумом и Веной, безусловно, улучшились бы, как и его собственный имидж в глазах других чиновников. Поэтому его решение было принято давно, и, кажется, пришло время претворить эту идею в жизнь. Сейм примет это с целью улучшить натянутые отношения с его генерал-губернатором."
 BOS_offer_forest_concesions_desc: "Лесное хозяйство становится крупным работодателем в кондоминиуме, и, по слухам, Сейм знает, что Австрия планирует инвестировать больше в этот сектор экономики. Чтобы получить большие инвестиции, Сейм в настоящее время обсуждает законопроект, в рамках которого планирует предложить большую поддержку компаниям Империи, заинтересованным в боснийских лесах. Это горячая тема, но все согласны с тем, что такой законопроект значительно улучшит наши натянутые отношения с Веной."
 BOS_village_patrols_desc: "Млада Босна, Чёрная рука, часть СНО и кто знает, сколько ещё граждан в настоящее время подрывают наше правление на этих землях! Многие из этих действий полагаются на слабый пограничный контроль, на который Вена уже дала несколько решений. Тем не менее, мы не можем быть уверены, и создание деревенских патрулей в определённых районах очень помогло бы. Мы отправим это предложение в Вену и организуем большую его часть независимо от ответа."
 BOS_regional_schools_desc: "Ещё один необходимый шаг в улучшении системы образования — строительство更多的 региональных школ. Региональные школы, хотя и охватывают только первые несколько лет обучения, достаточно, чтобы значительно повысить уровень грамотности. Со временем эти региональные школы станут полноценными школами и, проще говоря, станут подарком, который продолжает дарить."
 BOS_second_election_desc: "Прошло много времени с момента последних выборов, если не считать частичных выборов между третьей и четвёртой сессиями Сейма. Куриальная система всё ещё будет нетронутой, и из-за того, что партия СНО в последнее время выступает не очень хорошо, Вена одобрила эти выборы, чего, мягко говоря, не ожидалось. Подготовка к этим выборам скромная, как и к прошлым, поскольку политический состав кондоминиума в целом следует этническим линиям с незначительными отклонениями."
 BOS_get_ready_desc: "Мы не можем позволить судьбе контролировать исход, особенно когда на кону существование Сейма. Прежде чем опустить руку в избирательную урну, необходимы некоторые меры предосторожности. Партнёры по коалиции должны быть найдены до того, как будет отдан хотя бы один голос. Партия Димовича всё меньше и меньше довольна преследованием сербов в Империи, поэтому мы должны найти новые слова, чтобы укротить его, или найти нового партнёра..."
 BOS_tipping_the_scale_desc: "Последние выборы были своего рода катастрофой, и многие не очень уверены в исходе этих выборов. Вена предложила помощь в фальсификации выборов, и мы могли бы также согласиться, если властители дали зелёный свет. Что наиболее важно, так это то, что оппозиция не вынашивает подобных идей..."
 BOS_le_ze_success_desc: "Улыбайтесь и машите. Если кто-то спросит, отвечайте, что чудеса действительно случаются. Важно продвигать повестку дня, не тревожа вышестоящих. Все люди на своих местах, и всё, что нам сейчас нужно, — это достаточно большая платформа, чтобы сказать то, что мы хотим."
 BOS_pat_on_the_back_desc: "Было бы преуменьшением сказать, что Сейм работает хорошо. Ситуация не идеальна и никогда не будет, но у императора и министерства сложилось впечатление. Некоторые слухи говорят о том, что нашему скромному Сейму могут скоро предложить похлопывание по плечу, доверие и дополнительные инвестиции."
 BOS_trialism_desc: "sidz note to self"
 BOS_multiethnic_desc: "sidz note to self"
 BOS_martial_law_desc: "Босния и Герцеговина в опасности. Антисербские протесты достигают неприемлемых высот даже по балканским стандартам. Порядок в Сараево в основном восстановлен, но население кипит. Чтобы предотвратить возможные восстания, неподчинение приказам и мародёрство, необходимо ввести военное положение на всей территории кондоминиума."
 BOS_trials_desc: "sidz note to self"
 BOS_police_state_desc: "sidz note to self"
 BOS_investigate_tuzla_saltworks: "Расследовать деятельность Тузлинского солеваренного завода"
 BOS_investigate_tuzla_saltworks_desc: "Тузлинский солеваренный завод находится в аренде уже более десяти лет. Древние соляные копи в этом районе являются значительной частью местной экономики, но сербы в этом районе вызывают подозрения, что фирма нарушает свои договорные обязательства. Большинству чиновников нет особого дела до таких вещей, поэтому Сейм подумывает о том, чтобы написать несколько писем причастным и начать небольшое расследование по собственной инициативе."
 BOS_vienna_restrict_lumber: "Потребовать законы о лесном хозяйстве"
 BOS_vienna_restrict_lumber_desc: "Леса Боснии являются первозданным и неиспользованным источником дохода для карманов Вены. Лес, почти нетронутый османским правлением, является нетронутым и уникальным местом для развития лесной промышленности. Венгерские и австрийские компании уже строят планы, как нажиться на этом. Эта ситуация требует немедленного требования протекционистских законов, чтобы эти отрасли не злоупотребляли территорией больше, чем разрешено. Сербы годами требовали таких ограничений и, безусловно, будут рады услышать такое предложение."
 BOS_crackdown_serb_media: "Голоса тихой оппозиции"
 BOS_crackdown_serb_media_desc: "Оппозиция была очень громкой во всех формах СМИ с тех пор, как этот проклятый конфликт начался в регионе. Чтобы предотвратить любую радикализацию и другие подрывные меры, пропагандируемые сербскими демагогами, генерал-губернатор [BOS.GetLeader] планирует ввести запреты, штрафы и аресты, чтобы принудить к миру в уже нестабильном кондоминиуме. Говорят, что многим не нравится цензура."
 BOS_crush_serb_media: "Раздавить сербские СМИ"
 BOS_crush_serb_media_desc: "Мало того что Балканская лига вышла победительницей, так она ещё и пренебрегает мирным договором! Шкодерский кризис, как называют эту ситуацию в регионе, стал последним гвоздём в крышку гроба терпения [BOS.GetLeader]. Немедленное закрытие всех сербских СМИ — радикальная, но эффективная мера, поскольку величайшая сила лжеца — это его язык."
 BOS_chaos_in_sarajevo: "Хаос в Сараево"
 BOS_chaos_in_sarajevo_desc: "Вена приказала закрыть Боснийский сейм после недавних событий, вызвавших большую нестабильность в Империи. Воевать и так достаточно тяжело, поэтому Сейм должен быть закрыт. Будет ли это решение постоянным или временным, ещё предстоит выяснить."
