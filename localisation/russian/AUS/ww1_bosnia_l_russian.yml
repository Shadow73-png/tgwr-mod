 BOS_ask_for_sanjak: "Возвращение вилайета"
 BOS_integrate_sanjak: "Интеграция Санджака"
 BOS_taslica_occupation: "Неожиданное расширение"
 BOS_doboj_prisons: "Тюрьмы Добоя"
 BOS_doboj_prisons_desc: ""
 set_1913_election_BOS_effects: "Удаляет 8 членов из СНО и добавляет 8 членов в СНП"
 BOS_ugar_treeworks: "Деревообработка Угар"
 BOS_ugar_treeworks_desc: "После дебатов о протекционизме боснийских лесов и всех связанных с этим темах появилась компания, которая соответствует критериям даже самых твердолобых членов Сейма, с предложением. Компания кажется разумной и надёжной, но Сейм всё равно должен быть проинформирован, а объединённое министерство финансов в Вене должно одобрить и подписать все документы."
 BOS_fragile_peace_shattered: "Хрупкий мир"
 BOS_fragile_peace_shattered_desc: "Из-за недавнего немыслимого события наши чиновники были ошеломлены его последствиями. Необходимо принять меры вместе с расширением полиции и других защитников хрупкой стабильности кондоминиума. Расследование всё ещё продолжается..."
 BOS_council_boards: "Советы управлений"
 BOS_landesstatut_constitution: "Ландесстатут Боснии"
 BOS_landesstatut_constitution_desc: "Подчинённая Австрии и Венгрии, Босния-Герцеговина считается колонией, находящейся в совместном владении двух держав. У неё нет армии или военной промышленности, тем не менее, она остаётся объектом рекрутского набора в общевойсковую армию."
 BOS_diet_dm: "Консультативный Сабор"
 BOS_diet_dm_desc: "Консультативный Сейм представляет собой единственную демократическую ноту государства, состоящую из этнического и религиозного представительства населения.\n\nБольшая часть власти сосредоточена в руках губернатора §Y[BOS.GetLeader]§!, который сам неспособен вести переговоры по указаниям двойной монархии."
 AUS_condominum: "Австро-Венгерский кондоминиум"
 AUS_condominum_desc: "Босния и Герцеговина управляются совместно Австрией и Венгрией через объединённое Министерство финансов."
 BOS_agrarian_colonists_dm: "Аграрные колонисты"
 BOS_agrarian_colonists_dm_desc: "То, что начиналось как объявление в религиозном журнале немецкого священника, призывающего благочестивых фермеров селиться в Боснии, теперь превратилось в полноценную аграрную политику. Немецкие семьи, в основном из Силезии и Рейнской области, начали селиться в Боснии и создали поселения, такие как Рудольфсталь. Немецкие протестанты из Венгрии также присоединились и создали поселение под названием Францйозефсфельд. В 1890 году был создан закон, предоставляющий этим семьям налоговые льготы и предлагающий до 12 гектаров на семью, бесплатно в течение первых трёх лет и низкую ипотеку, которая будет длиться всего 10 лет, если они примут боснийское гражданство. Вслед за этим поляки, чехи и русины начали мигрировать. По мере того как всё больше мигрантов прибывает в Боснию и увеличивает религиозный и этнический котёл, местные лидеры начинают беспокоиться и выступать против этой политики..."
 BOS_reminiscence_of_TUR: "Воспоминания об османской эпохе"
 BOS_reminiscence_of_TUR_desc: "Османская оккупация Боснии оставила 97% населения страны неграмотным и народ, который не доверял новым австрийским властителям. Это доверие нужно было строить с помощью компромиссов."
 BOS_postal_bank_idea: "Почтовый сберегательный банк"
 BOS_student_protests: "Студенческие протесты"
 BOS_suppressed_riots: "Подавленные студенческие беспорядки"
 BOS_war_req_act: "Акт о военных требованиях Боснии"
 BOS_the_bosnian_diet_dec: "Боснийский сейм"
 BOS_the_bosnian_diet_dec_desc: "Ландтаг фон Босниен унд дер Херцеговина, или 'Сабор Босне и Херцеговины' на сербохорватском, или 'Сейм Боснии и Герцеговины' на английском, является представительным собранием в австро-венгерском кондоминиуме Боснии и Герцеговины. Учреждён 17 февраля 1910 года как единственная истинная свобода народа в кондоминиуме, поскольку другие должности контролируются назначенным Веной генерал-губернатором и объединённым министром финансов.\n\n[BOS_the_bosnian_diet_dec_desc_sl]\n[BOS_ethnic_opinions_sl][BOS_bills_passed_sl]§LСейм также состоит из 20 других членов, помимо избранных министров, которыми являются представители всех религиозных конфессий, председатель Верховного суда, председатель Коллегии адвокатов, председатель Торговой палаты и мэр Сараево.§!"
 BOS_the_bosnian_diet_dec_desc_1: "\nВ настоящее время парламент насчитывает §Y[?BOS_parliament_total]§! избранных членов парламента.\n\n§RСербская народная организация§! (СНО) имеет §Y[?BOS_parliament_sno_seats]§! место(а);\n§6[BOS_muslim_party_name]§! [BOS_muslim_party_name_2] имеет §Y[?BOS_parliament_mpo_seats]§! место(а);\n§cХорватская народная община§! (ХНЗ) имеет §Y[?BOS_parliament_hnz_seats]§! место(а);\n§8Хорватская католическая ассоциация§! (ХКА) имеет §Y[?BOS_parliament_hku_seats]§! место(а);\n§3Независимые кандидаты§! имеют §Y[?BOS_parliament_ind_seats]§! место(а)."
 BOS_the_bosnian_diet_dec_desc_2: "\nВ настоящее время парламент насчитывает §Y0§! избранных членов парламента, так как выборы ещё не проводились."
 BOS_the_bosnian_diet_dec_desc_3: "\nВ настоящее время парламент насчитывает §Y[?BOS_parliament_total]§! избранных членов парламента.\n\n§6[BOS_muslim_party_name]§! [BOS_muslim_party_name_2] имеет §Y[?BOS_parliament_mpo_seats]§! место(а);\n§RСербская народная организация§! (СНО) имеет §Y[?BOS_parliament_sno_seats]§! место(а);\n§cХорватская народная община§! (ХНЗ) имеет §Y[?BOS_parliament_hnz_seats]§! место(а);\n§1Сербская национальная партия§! (СНП) имеет §Y[?BOS_parliament_snp_seats] место(а);\n§8Хорватская католическая ассоциация§! (ХКА) имеет §Y[?BOS_parliament_hku_seats]§! место(а);\n§3Независимые кандидаты§! имеют §Y[?BOS_parliament_ind_seats]§! место(а)."
 BOS_bills_passed_tt: "\n\nБоснийский сейм принял в общей сложности §Y[?BOS_bills_passed]§! законопроектов. §R[?BOS_bills_rejected]§! из них были отклонены австрийцами.\n\n"
