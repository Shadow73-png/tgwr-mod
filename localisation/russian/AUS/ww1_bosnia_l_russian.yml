 AUS_HUN_bosnia_mechanic_help_tt: "Этот счётчик представляет отношения Министерства финансов и самого Сейма. Чтобы увеличить его, принимайте законы, одобряющие правление Вены, и не принимайте те, которые ему противоречат. Чем ниже становится счётчик, тем выше шансы, что Вена отнимет те ограниченные права, которыми пользуется этот Сейм. Чем он выше, тем выше шансы, что Вена предоставит нам больше свобод, закроет глаза или просто даст второй шанс..."
 BOS_austro_hungarian_influence: "Отношения с Веной"
 BOS_austro_hungarian_influence_desc: "Как кондоминиум, и Австрия, и Венгрия должны иметь равное господство над нами, но это не так. Вена держит большую часть власти в империи, что означает, что она держит большую часть власти и здесь, в Сараево."
