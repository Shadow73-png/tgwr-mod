 BOS_bill_rejected_boo: "Этот законопроект §rпровалился§!!"
 ww1_bosnia.1.d: "Покушение едва не произошло в окрестностях Сейма. Сразу после того, как наш генерал-губернатор, Мариян Варешанин, открыл Сейм и отправился обратно в своей карете в свою резиденцию, знаменитый 'Конак'. На мосту Богдан Жерайич выпустил пять пуль в сторону генерал-губернатора. Варешанин, в шоке, вышел из машины ошеломлённый, только чтобы увидеть мёртвое тело своего убийцы. Жерайич покончил с собой последней пулей. Эта неопределённость избавила нас от больших потрясений по всему региону. Возможно, он действовал в одиночку, но более вероятно, что у него была какая-то поддержка. Необходимо дальнейшее расследование, и немедленно!"
 ww1_bosnia.1.a: "Этим сербам нужно взять себя в руки!"
 ww1_bosnia.2.t: "Тревожный рост 'Млада Босна'"
 ww1_bosnia.2.d: "Во многих школах и университетах по всей Боснии начала усиливаться политическая оппозиционная агитация со стороны новой группы, называющей себя 'Млада Босна'. Популярная среди студентов, эта группа вызывает боснийско-националистическую агитацию и распространяет пагубные убеждения, такие как отделение от австро-венгерского кондоминиума, разжигание революции, чтобы вырваться из австрийских цепей, и даже объединение с независимыми балканскими славянскими нациями, такими как Сербия."
 ww1_bosnia.2.a: "Есть ли в этой стране хоть кто-то умеренный?"
 ww1_bosnia.3.t: "-- Трансляция от разработчиков --"
 ww1_bosnia.3.d: "Здравствуйте, уважаемый игрок: спасибо, что играете за Боснию.\nБосния является кондоминиумом Австрии и Венгрии, что означает, что обе страны имеют (на бумаге) равное господство над Боснией. В реальности объединённое министерство финансов, сам император и назначенный императором генерал-губернатор — единственные люди, имеющие право голоса в политике кондоминиума.\n\nБосния переживает трудные времена авторитаризма в этот период времени, с цензурой в боснийском парламенте (Сейме), и их власть крайне ограничена, в то время как губернатор и министерство финансов занимаются свободной эксплуатацией страны, как какой-то колонии.\n\n\nВы уверены, что хотели играть за Боснию? Мы понимаем. Всё в порядке."
 ww1_bosnia.3.a: "Я знаю, что делаю!"
 ww1_bosnia.3.b: "Хотел играть за Черногорию!"
 ww1_bosnia.4.t: "Парламентские выборы в Боснии 1910 года"
 ww1_bosnia.4.d: "По результатам выборов в боснийский парламент было избрано 72 члена парламента. На избирательных участках баллотировались 3 основные политические партии: Сербская народная организация, Мусульманская народная организация и Хорватская народная община. СНО получила 31 место, Мусульманская народная организация — 24 места, Хорватская народная община — 12 мест, а новая партия Хорватская католическая ассоциация — 4 места. Также один независимый еврейский кандидат получил одно место."
 ww1_bosnia.4.a: "Прогресс!"
 ww1_bosnia.5.t: "Начинается первая сессия Сейма"
 ww1_bosnia.5.d2: "Напряжённость между хорватскими и сербскими членами ослабла, поскольку все, казалось, объединялись в коалицию для защиты большей автономии и самоуправления для государства Босния. Император [AUS.GetLeader] недавно посетил город, и его присутствие всё ещё ощущается. Сейм был открыт генерал-губернатором Марияном Варешанином, и у него, возможно, сложилось благоприятное впечатление, поскольку трём партиям удалось прийти к соглашению по бюджету на 1910 год. Надеемся, что это хорошее начало и темп сохранятся в Сейме."
 ww1_bosnia.5.a: "Многообещающее начало!"
 ww1_bosnia.6.t: "Боснийский сейм направляет меморандум"
 ww1_bosnia.6.d: "После отставки Бурьяна с поста главы Боснии в австрийских столпах власти, министры Боснийского сейма, должно быть, подумали, что сегодня их счастливый день, и отправили нам меморандум, отстаивающий многие права, такие как изменение избирательной системы Сейма, общее расширение прав Сейма, более высокая автономия экономики кондоминиума и другие немыслимые идеи. Они, должно быть, думали, что наш новый министр наивен и зелен, но ситуация совершенно противоположная."
 ww1_bosnia.6.a: "Разочаровывает"
 ww1_bosnia.7.t: "Австрия отклоняет меморандум"
 ww1_bosnia.7.d: "Австрия отказалась принять наши требования, изложенные в меморандуме, который мы отправили им вчера, с просьбой о многих необходимых реформах парламентской и правительственной системы страны. Они назвали это 'оскорбительным' и 'возмутительным'."
 ww1_bosnia.7.a: "Что за..?"
 ww1_bosnia.8.t: "Стефан Бурьян уходит в отставку"
 ww1_bosnia.8.d: "Австрийский объединённый министр, который вроде как наш начальник, ушёл в отставку из-за усталости от управления гневом боснийского населения, гневом австрийских бюрократов и, конечно же, этого красочного Сейма."
 ww1_bosnia.8.a: "Прощайте"
 ww1_bosnia.9.t: "Боснийский сейм предлагает переговоры"
 ww1_bosnia.9.d: "После того как мы отклонили их наивную попытку добиться большей внутренней автономии, некоторые политики Сейма вернулись для переговоров. Должно пройти время, и все члены Сейма поймут, что они теряют гораздо больше, чем Вена, без бюджета для кондоминиума. В настоящее время у них недостаточно средств для 'стабильного' правительства, поэтому уступки с их стороны также могут потребоваться..."
 ww1_bosnia.9.a: "Давайте послушаем"
 ww1_bosnia.10.t: "Третья сессия Сейма"
 ww1_bosnia.10.d: "Эта третья сессия Сейма проходит в трудное время для боснийской политики, поскольку растущая открытая вражда между этим Сеймом и Веной привела к многочисленным ограничениям, наложенным венскими властителями. Недавно был принят второй вариант законопроекта о дорожном строительстве, но только благодаря манипулятивным тактикам нынешнего министра финансов. Почти все становятся всё более далёкими от Вены, и шаткое большинство, формирующее эту сессию Сейма, полно сомнений. Чтобы исправить эту надвигающуюся катастрофу, планируется наконец решить языковой вопрос, главную причину бесчисленных гневных голосов в Боснии и Герцеговине."
 ww1_bosnia.10.a: "Надежда умирает последней"
 ww1_bosnia.13.t: "Языковой вопрос"
 ww1_bosnia.13.d: "Сегодня законодателями-сербами и другими членами парламента был поднят языковой вопрос. Их требование — полная языковая свобода и использование сербохорватского языка во всех делах кондоминиума! Не удалось достичь соглашения: сербы решили бойкотировать и блокировать вторую сессию Сейма."
 ww1_bosnia.13.a: "Jebiga..."
 ww1_bosnia.14.t: "Законопроект об обязательном образовании"
 ww1_bosnia.14.d: "Этот новый принятый закон вводит обязательное образование для детей Боснии, за исключением всех лиц, принадлежащих к духовным званиям, мусульманок и любых студентов-инвалидов. Это укрепляет наш контроль над школами, делая систему более политически ориентированной, по крайней мере, на нашей стороне. Сделать школьное образование обязательным повысит текущий низкий уровень посещаемости. Мы надеемся расширить включение образования из Сибьян-мектебов и духовных школ в более централизованную, федерально финансируемую систему, которая поможет повысить ужасающий уровень грамотности, напоминающий османскую эпоху."
 ww1_bosnia.14.a: "Мы всё ещё отстаём как минимум на век."
 ww1_bosnia.15.t: "Учителя подают петицию о лучшем положении"
 ww1_bosnia.15.d: "В Боснии положение учителя всё ещё очень недооценивается правительством и боснийским обществом. Трудолюбивые учителя Боснии требуют лучшего положения в обществе и более высокой заработной платы. Мы должны сплотиться вокруг этого дела, чтобы помочь повысить уровень грамотности и в конечном итоге переместить население в нечто иное, кроме сельского хозяйства."
 ww1_bosnia.15.a: "Яблоко в день"
 ww1_bosnia.16.t: "Сейм решает аграрный вопрос"
 ww1_bosnia.16.d: "В Боснии нерешённый аграрный вопрос тяготел над фермерами с тех пор, как австрийцы сменили османов: большая часть земли находилась под крестьянской системой, известной как система кметов, при которой несколько мусульман владели большими участками пахотной земли, на которой работало много сербов. Боснийский сейм сегодня принял закон, разрешающий добровольный выкуп кметами земли в собственность."
 ww1_bosnia.16.a: "Наконец-то!"
 ww1_bosnia.17.t: "Вторая сессия Сейма заканчивается"
 ww1_bosnia.17.d: "Вторая сессия Сейма завершилась сегодня в проблемной и неспокойной боснийской политической обстановке. Нерешённый языковой вопрос, аграрный вопрос и публичный конфликт с Веной оставили парламент разделённым, но сессия всё ещё проходит, главным образом, чтобы определить, что должно произойти с Веной. Тем не менее, было принято несколько законов, но, за исключением этих немногих, большинство никогда даже не приблизится к большинству в эту сессию Сейма."
 ww1_bosnia.17.a: "Ничего не происходит"
 ww1_bosnia.18.t: "Третья сессия Сейма заканчивается"
 ww1_bosnia.18.d: "Третья сессия Сейма заканчивается практически ничем, не завершённым за время её работы. Ниже среднего 'прогресс' завершил принятие почти нулевого количества законов и законопроектов. С таким прогрессом Вена действительно пересматривает решение о переброске бюджетов из Сараево, чёрной дыры для инвестиций. Языковой вопрос всё ещё не решён, и, возможно, мы упустили наш последний шанс исправить это..."
 ww1_bosnia.18.a: "Разберёмся с этим позже..."
 ww1_bosnia.19.t: "Потиорек сменяет Варешанина"
 ww1_bosnia.19.d: "После покушения на него в прошлом году Мариян Варешанин попросил об отставке, которая вскоре была принята. Преемник был поспешно найден — генерал Оскар Потиорек, кандидат на должность начальника Генерального штаба. Чешский лоялист, известный как один из вероятных кандидатов на должность начальника штаба австро-венгерских вооружённых сил."
 ww1_bosnia.19.a: "Пожелаем ему удачи!"
 ww1_bosnia.20.t: "Начинается четвёртая сессия Сейма"
 ww1_bosnia.20.d: "Четвёртая сессия начинается с хороших новостей: Сейм обеспечил стабильное и лояльное большинство, так что у нас не будет обструкционизма, который преследовал предыдущую сессию Сейма. Но массы волнуются, и у нас может быть не так много времени, прежде чем где-то поблизости взорвётся пороховая бочка."
 ww1_bosnia.20.a: "Чего мы ждём?"
 ww1_bosnia.21.t: "Законопроект о дорожном строительстве"
 ww1_bosnia.21.d: "Сегодня Сейму был представлен большой пакет планов по строительству дорог и железных дорог. Проблема в том, что использование языка в этих инфраструктурных проектах неадекватно для боснийского населения. Дорожные и железнодорожные указатели, а также общение с работниками железных дорог, согласно законопроекту, осуществляется только на немецком или венгерском языках, которых почти никто не знает в Боснии и Герцеговине, кроме генерал-губернатора и его приспешников. Этот упомянутый законопроект, хотя и щедрый, по мнению большинства Сейма, неприемлем в его нынешней форме. Это может считаться катастрофой, поскольку Вена потребовала от генерал-губернатора, чтобы этот закон был принят без возражений."
 ww1_bosnia.21.a: "Катастрофа!"
 ww1_bosnia.22.t: ""
 ww1_bosnia.22.d: ""
 ww1_bosnia.22.a: ""
 ww1_bosnia.23.t: "Расследование соляных копей в Тузле"
 ww1_bosnia.23.d: "Настойчивое требование Кочича о расследовании предполагаемых нарушений в соляных копях Тузлы наконец-то удовлетворяется. Копи находятся под управлением Solana JSC Tuzla, основанной в 1884 году и оставшейся под прямым австрийским контролем. Поскольку это государственное коммерческое предприятие, расследование может быть несколько перенаправлено..."
 ww1_bosnia.23.a: "Это не так серьёзно"
 ww1_bosnia.23.b: "Оставайтесь верны себе"
 ww1_bosnia.24.t: "Мусульманские партии объединяются"
 ww1_bosnia.24.d: "Две соперничающие фракции, Мусульманская народная организация (МНО) и Мусульманская независимая партия, сегодня объединились, чтобы сформировать Объединённую мусульманскую организацию. Этот факт не должен никого беспокоить, поскольку у Мусульманской независимой партии не было мест в Сейме, поэтому во многих вопросах это просто формальное изменение, которое в конечном итоге может привести к появлению более или менее умеренных членов Сейма. Мера была отчасти непродуктивной, поскольку некоторые нынешние члены Сейма, входящие в МНО, оставили свои места вакантными в знак протеста против этого спорного слияния. Места будут заполнены партией почти автоматически, но что-то нужно сделать с этими непокорными вакансиями в будущем."
 ww1_bosnia.24.a: "Интересно"
 ww1_bosnia.25.t: "Хорватские партии обращаются к нам"
 ww1_bosnia.25.d: "Хорватские партии ХНЗ и ХКА, каждая в разное время, пообещали поддержку Вене и генерал-губернатору, чтобы помочь принимать законы в Сейме, по-видимому, без какой-либо выгоды. Обе партии поддерживают австрийскую аннексию Боснии, поскольку они видят в ней прогресс на пути к объединению с остальными хорватами под австрийским престолом. Некоторые сомневаются в этой щедрости, но на самом деле мы должны принять как можно больше поддержки, чтобы обойти более 30 членов оппозиции из православного блока. Если им можно доверять, у нас теперь около 30 лояльных членов Сейма, чего недостаточно, но это прогресс."
 ww1_bosnia.25.a: "Посмотрим, как долго это продлится..."
 ww1_bosnia.26.t1: "Обструкционизм приводит к закрытию Сейма"
 ww1_bosnia.26.t2: "[BOS.GetLeader] приказывает приостановить деятельность Сейма"
 ww1_bosnia.26.d1: "Если этот Сейм представляет кондоминиум, то кровопролитие между его национальностями неизбежно. Недавно на сессии Сейма хорватские представители заблокировали сессию, потому что сербы потребовали, чтобы будущий языковой закон кондоминиума назывался сербохорватским, а не хорватским. Обе хорватские партии, на которые Вена всегда полагалась для принятия законов, взбунтовались из-за языкового вопроса. Хуже всего то, что это предложение требовало удаления венгерского и австрийского языков, с чем согласились все три национальности."
 ww1_bosnia.26.d2: "После принятия предложенного языкового закона, попытки исправить проблему, которая мучила Боснию годами, австро-венгерские чиновники заблокировали принятие законопроекта, поскольку он ставит под вопрос их управление этой территорией и требует беспрецедентного уровня автономии для любого региона Империи. Был отдан приказ о бессрочном закрытии. Теперь снова Билински предстоит исправить ситуацию и вернуть сессии в порядок, несмотря на то, что это может быть самый нестабильный момент существования кондоминиума."
 ww1_bosnia.26.a: "Неслыханно!"
 ww1_bosnia.27.t: "Начинается вторая сессия Сейма"
 ww1_bosnia.27.d: "Первая сессия завершилась катастрофически из-за попытки принять законопроект о дорогах. Конфликты были и до голосования по нему, но в таком масштабе — определённо нет. Тем не менее, законы были приняты, и некоторые лояльности пережили сессию, но ни один здравомыслящий человек не назвал бы ту сессию удовлетворительной или чем-то подобным. Вторая сессия начинается с шатким большинством и нерешёнными вопросами о том, как справиться с сербским обструкционизмом и как принять законопроект о дорожном строительстве."
 ww1_bosnia.27.a: "Надеюсь, всё пройдёт хорошо!"
 ww1_bosnia.28.t: "Смерть Али-бега Фирдуса"
 ww1_bosnia.28.d: "Сегодня утром в Сараево скончался Али-бег Фирдус. Родившийся в османской Боснии, он был видным деятелем, защищавшим права боснийских мусульман, и помог основать Мусульманскую народную организацию. Он протестовал против аннексии Боснии Австрией в 1908 году, но всё равно стал первым спикером Боснийского сейма. К сожалению, большую часть своего короткого пребывания в должности он провёл в постели из-за тяжёлых недугов. Нация скорбит об этом любимом и мирном деятеле, часто рассматриваемом как объединяющая сила мусульман всех национальностей."
 ww1_bosnia.28.a: "Počivao u miru"
 ww1_bosnia.28.b: "Airqud fi salam"
 ww1_bosnia.29.t: "Сулейман Шарац уходит в отставку с поста Великого муфтия Боснии"
 ww1_bosnia.29.d: "Сулейман Шарац, влиятельная фигура для ислама в Боснии, ушёл в отставку с поста Великого муфтия Боснии. Он оставляет после себя должность, полную чести в исламском мире, поскольку он был высшим исламским религиозным авторитетом в Боснии. Он заявляет, что ушёл в отставку, потому что хочет сосредоточиться на семейных делах и науке."
 ww1_bosnia.29.a: "Печально"
 ww1_bosnia.30.t: "Частичные выборы 1913 года - Результаты"
 ww1_bosnia.30.d: "Предстоящие выборы, что интересно, не важны для населения. Люди кажутся искренне умиротворёнными, конечно, лишь на мгновение. Этот дух можно было бы использовать в наших интересах; наконец-то добиться надлежащего большинства в Сейме, свободного от радикалов СНО. Технически ответвление СНО, газета и действительно группа людей, сосредоточенная вокруг Данило Димовича, единственного провенского сербского политика с какой-либо поддержкой, — наша надежда на этих выборах. Места открыты для 12 сербов в конкретных регионах, поэтому проведение какой-либо кампании может быть практически невозможным и неэффективным."
 ww1_bosnia.30.a: "Будем надеяться на лучшее"
 ww1_bosnia.31.t: "Австрия блокирует запрет на немецкий во внутренней коммуникации"
 ww1_bosnia.31.d: "Согласно ответу властителей Сейма, немецкий является 'единственным нейтральным языком в Боснии', что является ложным утверждением. Однако верно, что мы разделены во мнениях о том, какой язык использовать в качестве основного, поскольку существуют сербский и хорватский. Сейм в настоящее время так же доволен ответом, как и Вена, когда получила первоначальный запрос. Это разделение может вызвать дальнейшее недоверие наших политиков к нашим австрийским властителям."
 ww1_bosnia.31.a: "Scheiße!"
 ww1_bosnia.32.t: "Боснийский сейм отменяет использование немецкого во внутренней коммуникации"
 ww1_bosnia.32.d: "С начала оккупации Боснии нами внутренние правительственные документы писались на местном языке Вены: немецком. Это создало определённую степень разделения между нами, правителями, и боснийским населением и политиками, управляемыми. Боснийский сабор определил многие точки зрения для удаления немецкого языка в их внутренней коммуникации. Во-первых, они говорят, что это означает, что местные жители, не владеющие немецким, не могут работать на государственных должностях, и именно ковровые коврики из Богемии и Зальцбурга или что-то в этом роде могут захватить боснийские государственные должности. В-третьих, они говорят, что перевод коммуникации с немецкого на сербохорватский часто затруднён и может вводить в заблуждение. Конечно, те, кто заседает в Вене, считают это требование оскорбительным, так что нам делать с их запросом?"
 ww1_bosnia.32.a: "Заблокировать этот законопроект!"
 ww1_bosnia.32.b: "Пусть говорят на чём хотят"
 ww1_bosnia.33.t: "Будапешт блокирует удаление венгерского на боснийских железных дорогах"
 ww1_bosnia.33.d: "Несмотря на то, что антивенгерский законопроект был принят, это предложение задело за живое властителей в Будапеште, потому что ответ был унизительным. Они не сочли это разумным запросом, как это есть, утверждая, что это кондоминиум, а не заморская колония. Что ж, все это знают, но венгерский здесь больше похож на шутку, чем на серьёзный способ общения. Даже тогда он, вероятно, используется неправильно. В любом случае, Сейму следует воздерживаться от любых запросов, которые Будапешт может счесть наглыми (итак, всё, что имеет смысл)."
 ww1_bosnia.33.a: "Baszd meg!"
 ww1_bosnia.34.t: "Боснийский сейм планирует удалить венгерские указатели на железных дорогах"
 ww1_bosnia.34.d: "Боснийский сабор потребовал удалить венгерский язык с их указателей, заменив его языком земли или тем, на чём там говорят. Это было бы вполне логично, поскольку Босния, как и остальная часть Империи, представляет собой компактную мешанину из разных языков и этнических групп, и они также уточнили, что немецкий может использоваться в качестве второго языка. Но этот законопроект необходимо заблокировать, поскольку он идёт вразрез с нашей политикой мадьяризации и"
 ww1_bosnia.34.a: "Они о себе возомнили!"
 ww1_bosnia.35.t: "Законопроект о Почтовом сберегательном банке"
 ww1_bosnia.35.d: "Почтовый сберегательный банк, о котором так мечтали все члены Сейма, может оказаться большей проблемой, чем мы думали. Сначала все были согласны с австрийским предложением о столь необходимом банке, базирующемся в Боснии и Герцеговине, но вскоре, ознакомившись с остальной частью законопроекта, многие поняли, что автономии в этом законопроекте будет не так много. Планируемый банк привязан к Вене и не имеет никакой связи с Сеймом. Лояльные элементы отмахнулись от этого, но сербские члены Сейма, входящие в текущее большинство, в ярости от такого предложения. Если законопроект пройдёт, это может быть больше связано с доброй волей, чем с честностью членов Сейма."
 ww1_bosnia.35.a: "Они раздувают из этого проблему!"
 ww1_bosnia.36.t: "Второй законопроект о дорожном строительстве"
 ww1_bosnia.36.d: "Рейхсфинанцминистр Билински сохраняет свой темп, и, кажется, ему удаётся успешно заставить оппозицию принять его новый законопроект. Ну, не совсем новый законопроект, а скорее замаскированную версию печально известного законопроекта о дорожном строительстве. Есть небольшие изменения, но на этот раз он не провалится! Причина — бюджет, страх потерять зарплату, роспуск Сейма и несколько других (возможно, пустых) угроз, которые делают его принятие неизбежным."
 ww1_bosnia.36.a: "Отлично сработано, Билински!"
 ww1_bosnia.37.t: "Голосование по законопроекту о больницах"
 ww1_bosnia.37.d: "На столе простой законопроект, предлагающий финансирование плохо содержащихся больниц кондоминиума и дальнейшее улучшение здравоохранения, а также строительство совершенно нового 'Павильона К' в Земельном госпитале Сараево. Все стороны довольны этим реальным прогрессом, который, несомненно, спасёт много жизней в будущем."
 ww1_bosnia.37.a: "Кто сказал, что Сейм дисфункционален?"
 ww1_bosnia.38.t: "Собственный меморандум Сейма"
 ww1_bosnia.38.d: "Леон фон Билински, объединённый министр финансов, встретился с нами на межпартийной конференции и потребовал, чтобы мы приняли законопроект о дорожном строительстве. Он предложил бы свою полную поддержку, как это делал Стефан Бурьян, но, цитируя его слова, 'его руки связаны, и он не может предложить большего'. Хотя темой был меморандум, Билински пренебрёг им и сказал простое нет, призывая нас принять его законопроект."
 ww1_bosnia.38.a: "Неслыханно!"
 ww1_bosnia.39.t: "Студенческие протесты выходят из-под контроля"
 ww1_bosnia.39.d: "Венгерский флаг горит в Сараево прямо сейчас! На всех общественных местах огромные группы протестующих, в основном студентов, скандирующих фразы, объединённые независимо от их этнической принадлежности. Каждый венгр, немецкий человек и чиновники до смерти напуганы таким зрелищем перед собой. Призывы к насилию, объединению всех славян, миру между национальностями, радикализирующие публичные речи и полное неповиновение — вот что видят все! Эти студенты призвали к всеобщей забастовке. Тайные общества вербуют, а общественное недоверие достигло исторического максимума. Нужно что-то делать с этой ситуацией!"
 ww1_bosnia.39.a: "Подавить это любой ценой!"
 ww1_bosnia.40.t: "Второй законопроект о дорожном строительстве"
 ww1_bosnia.40.d: "Благодаря тому, как Билински форсировал вопросы, теперь строительство может быть завершено. Технически дороги строились ещё до того, как законопроект был принят или даже поставлен на голосование, сдерживали только дорожные указатели и, в некоторой степени, официальный язык. Что ж, закон принят, но мусульмане и сербы в ярости, а хорватам не легче. Новой целью должно стать восстановление отношений, чтобы продолжить сессии."
 ww1_bosnia.40.a: "Буря закончилась. Так ведь?"
 ww1_bosnia.41.t: "Роспуск Сейма!"
 ww1_bosnia.41.d: "Билински спас Боснию, приняв бюджет и законопроект о дорогах, но ценой того, что почти половина МНО и все члены СНО покинули сессию Сейма прямо в середине обсуждения второстепенных вопросов и компенсаций. По всему зданию были слышны крики и даже несколько угроз. Члены, вышедшие из сессии, заявили, что вторая сессия окончательно завершена. Чувство предательства было преобладающей чертой на лицах обструкционистов наряду с гневом. Сессия действительно закончена, но что теперь делать?"
 ww1_bosnia.41.a: "Немного по-детски"
 ww1_bosnia.42.t: "Хорватский сабор распускается"
 ww1_bosnia.42.d: "Бан Хорватии-Славонии, Славко Кувай, распустил хорватский сабор вскоре после того, как был избран на эту должность, и приостановил действие конституции, по сути, введя прямое правление. На улицах хорватских городов и посёлков, а также в боснийских городах, где часть населения говорит по-хорватски, росла оппозиция. Вскоре к протестующим, не являющимся хорватами, присоединились всеобщие протесты против действий Бана."
 ww1_bosnia.42.a: "Много таких случаев."
 ww1_bosnia.43.t: "Студенческие демонстрации в Боснии"
 ww1_bosnia.43.d: "В ответ на то, что Бан Хорватии-Славонии по указанию Будапешта распустил хорватский парламент и приостановил действие конституции, в Боснии, где проживает большое хорватское население, прошли многочисленные демонстрации. Пока неясно, как долго продлятся эти демонстрации и какой уровень интенсивности они достигнут."
 ww1_bosnia.43.a: "Они уже закончили?"
 ww1_bosnia.44.t: "Теория о северо-западных мусульманах"
 ww1_bosnia.44.d: "В северо-западном углу Боснии существует почти однородная группа (аномалия для Балкан) боснийских мусульман. Эти мусульмане, согласно многочисленным историкам, все являются потомками местных жителей, принявших ислам. Хорватским политикам нравится такая интерпретация, настолько, что даже Анте Старчевич назвал этот район 'Цвиет Хрватске'; поддерживая утверждение, что эти люди являются родственниками средневековых хорватов, в отличие от большей части хорватских земель, где население много мигрировало. Продвигая эту теорию, мы получим подавляющую поддержку хорватов и возможности для постоянного хорватско-мусульманского партнёрства, будь то политического или повседневного. Это может противодействовать югославским идеям, посеяв больший раскол между хорватами и сербами, ценой гнева населения..."
 ww1_bosnia.44.a: "Отлично, внедряйте это сейчас!"
 ww1_bosnia.44.b: "Подходите к этому медленно, это игра с огнём..."
 ww1_bosnia.45.t: "Сейм голосует по языковому законопроекту"
 ww1_bosnia.45.d: "Боснийский сейм составил новый законопроект об использовании официального языка в кондоминиуме. Пока только подписи СНО стоят за ним, среди представителей Сейма ведётся масштабная кампания. Законопроект предлагает сделать сербохорватский единственным языком в делах кондоминиума, что не очень нравится 20 неизбранным чиновникам и 16 хорватским членам, которые требуют, чтобы официальным стал хорватский. Мусульмане, всегда придерживающиеся нейтралитета, могут стать решающим фактором, если они наладят отношения с сербами..."
 ww1_bosnia.45.a: "Обречено на провал..."
 ww1_bosnia.45.b: "Хорваты уступают!"
 ww1_bosnia.46.t: "Сейм голосует по языковому законопроекту"
 ww1_bosnia.46.d: "Последнее заседание по языковому вопросу было встречено яростными мнениями со всех сторон. В конце концов, законопроект провалился, даже не дойдя до Вены. На этот раз хорваты немного более сговорчивы, и, кажется, людям Боснии и Герцеговины наконец-то может быть позволено говорить на своём собственном языке, поскольку частичный языковой законопроект проходит в Сейме."
 ww1_bosnia.46.a: "Очередная пиррова победа."
 ww1_bosnia.47.t: "Процесс о государственной измене [GetYear] года"
 ww1_bosnia.47.d: ""
 ww1_bosnia.47.a: ""
 ww1_bosnia.48.t: "кто-то важный умер в тюрьме или что-то в этом роде, не знаю"
 ww1_bosnia.48.d: ""
 ww1_bosnia.48.a: ""
 ww1_bosnia.49.t: "Железнодорожный законопроект принят!"
 ww1_bosnia.49.d: "После напряжённых переговоров железнодорожный законопроект был принят. В законопроекте снова были проблемы с языком, но в меньшей степени, чем в прошлый раз. Тем более что на этот раз законопроект практически не включал указателей, только новые железные дороги и финансирование, что никого не волнует. Части железных дорог, включённые в законопроект, — это новая линия Срнетица-Яйце и улучшение линий Сараево-Босански-Брод, которые соединяют столицу кондоминиума со Славонией и остальной частью Империи."
 ww1_bosnia.49.a: "Рад это слышать!"
 ww1_bosnia.50.t: "Первая сессия Сейма проваливается"
 ww1_bosnia.50.d: "Первая парламентская сессия Боснийского сейма провалилась из-за внутренних конфликтов за или против законопроекта о дорожном строительстве."
 ww1_bosnia.50.a: "Нехорошо!"
 ww1_bosnia.51.t: "Борьба с боснийским терроризмом"
 ww1_bosnia.51.d: "Ровно две недели прошло с тех пор, как генерал-губернатора Марияна Варешанина по воле случая не задели пять пуль. Событие было совершенно неожиданным. Жерайич, называвший себя анархистом, по данным источников, также находился в Сараево неделю назад, когда приезжал Франц Иосиф, но не осмелился убить императора, хотя планировал. Большинство СМИ изобразили это событие как действие одинокого и психически неуравновешенного человека. Возможно, мотив Жерайича кроется в статье Ристо Радуловича, где автор писал о трагедиях как о необходимости для закалки борьбы боснийских сербов. Как бы страшно это ни было, мы не можем слишком зацикливаться на этом событии и должны увести СМИ от этой темы, поскольку это может быть радикализирующим фактором, необходимым для многих нелояльных элементов этой части Империи."
 ww1_bosnia.51.a: "Ужасно!"
 ww1_bosnia.52.t: "Босния запрашивает расширение банка"
 ww1_bosnia.52.d: "Боснийский сейм потребовал модернизировать их почтовый банк, вероятно, с намерением получить больше автономии. Действительно, банковское дело в Боснии находится в плачевном состоянии, но мы не можем осыпать их подарками, они будут восприняты как должное. Согласиться ли нам, будет предоставлена дополнительная модернизация, но также и большая автономия с более высокой ценой. Если отказать, частные иностранные банки могут оттолкнуть этот регион, но избавят нас от административных проблем."
 ww1_bosnia.52.a: "Что ж, мы должны помочь"
 ww1_bosnia.52.b: "Более жёсткая узда всегда лучший выбор"
 ww1_bosnia.53.t: "Вена принимает расширение банка"
 ww1_bosnia.53.d: "Вена прислала своего делегата, чтобы объявить нам: они принимают расширение Боснийского почтового банка, чтобы помочь стране. Убедительность и почти умоляние боснийских дипломатов принесли свои плоды. Реальный прогресс для экономики кондоминиума был достигнут, и шаг к надлежащей модернизации тоже."
 ww1_bosnia.53.a: "Не буду врать, это было неожиданно"
 ww1_bosnia.54.t: "Вена отказывается расширять банк"
 ww1_bosnia.54.d: "Предсказуемым образом Вена отклонила наш запрос на расширение нашего банковского обслуживания. Почтовым банком будут управлять центральные банки за пределами кондоминиума, как и было согласовано ранее, без какой-либо заботы о людях, которые им пользуются и зависят от него. Никто не доволен таким объявлением, и надвигается волна недоверия."
 ww1_bosnia.54.a: "Время снова склонить головы"
 ww1_bosnia.55.t: "Немедленное закрытие Боснийского сабора"
 ww1_bosnia.55.d1: "После сегодняшних трагических событий в Сараево Вена приказала закрыть и прекратить любые текущие или будущие заседания и обсуждения Боснийского сейма. Из-за сочетания всеобщего недоверия, плохих отношений и нестабильности, которую в значительной степени можно объяснить нами самими, это может стать эффективным концом всей автономии кондоминиума Боснии и Герцеговины.\n\nБалансирующий акт не удался, и в результате остальные возможные для принятия законы заблокированы. Что ж, это была хорошая игра."
 ww1_bosnia.55.d2: "В связи с участием Вены в войне они обеспокоены тем, что многие сербы, которые также являются членами Сейма, саботируют их миссию по достижению победы. Они приостановили работу Боснийского сейма в короткие сроки, лишь вскользь заметив, что эта приостановка может быть не постоянной..."
 ww1_bosnia.55.a: "Не каждый же Гаврило!"
 ww1_bosnia.55.b: "Трагедия для демократии..."
 ww1_bosnia.56.t: "Босния просит контроль над [760.GetName]"
 ww1_bosnia.56.d: "Босния попросила передать под контроль оккупированные нами земли [760.GetName], поскольку [761.GetName] уже находится под их частичной юрисдикцией. Крупные военачальники, такие как Конрад фон Готцендорф, и многие боснийские мусульмане поддерживают эту идею. Эта территория входила в состав Боснийского вилайета, который технически является предшественником кондоминиума, но из-за обстоятельств австрийской кампании 1878 года по захвату Боснии и её аннексии в 1908 году она осталась в составе османских владений на Балканском полуострове. Поскольку этот район населён сербами и боснийскими мусульманами, мало что изменится, и вопрос администрации территории решится сам собой."
 ww1_bosnia.56.a: "Почему бы и нет?"
 ww1_bosnia.56.b: "Они и так достаточно хрупки"
 ww1_bosnia.57.t: "[FROM.GetName] передаёт оккупированные сербские земли"
 ww1_bosnia.57.d: "Передача принята! Событие достойно празднования, но мы не можем медлить. Некоторая интеграция наших обществ необходима независимо от их будущего положения в кондоминиуме, которое ещё предстоит определить."
 ww1_bosnia.57.a: "Обновите карты, мы расширились!"
 ww1_bosnia.58.t: "[FROM.GetName] отказывается от передачи сербской территории"
 ww1_bosnia.58.d: "[FROM.GetName], в настоящее время оккупирующий эту землю, отказался принять передачу её законному контролёру. Неожиданно для многих, территории не будут воссоединены с бывшей границей Боснийского вилайета, приятным воспоминанием об османской администрации для многих в Санджаке и прилегающих районах."
 ww1_bosnia.58.a: "Ну, это было несколько амбициозно..."
 ww1_bosnia.59.t: "Голосование по перераспределению земли"
 ww1_bosnia.59.d: "Мы наконец-то ввели земельную реформу в обсуждение! После долгого времени мы наконец-то собрали достаточно поддержки, чтобы начать первоначальные предложения по проведению земельной реформы. Единственной помехой могла бы стать оппозиция мусульман, но они, вероятно, уступят перед уступками, которые мы подготовили."
 ww1_bosnia.59.a: "Давайте внедрим это побыстрее!"
 ww1_bosnia.60.t: "Начало пятой сессии"
 ww1_bosnia.60.d: "шары большой эфир время большой эфир, примечание для себя: собраться и прекратить ерунду, твой собственный дедлайн уже прошёл, третья сессия всё ещё не готова, отстой. :snooper_fish:"
 ww1_bosnia.60.a: "я психически здоров и способен"
 ww1_bosnia.61.t: "Пересмотреть языковой закон"
 ww1_bosnia.61.d: "Чтобы начать четвёртую сессию, Министерство финансов потребовало завершить языковой вопрос. Наконец, Вена уступает, признавая, что местное население не знает немецкого и венгерского, но всё же требует их в некоторых второстепенных аспектах повседневной боснийской жизни. Мы ближе к компромиссу, тем более что мы достигли уверенного большинства в Сейме."
 ww1_bosnia.61.a: "Билински, мне это нужно, пожалуйста, моя страна безграмотна"
 ww1_bosnia.62.t: "Первая сессия Сейма заканчивается, Вена злится"
 ww1_bosnia.62.d: "Первая сессия Сейма завершается неудовлетворительными результатами: не было никаких больших дебатов о реальных проблемах. Вена злится, что мы не обсуждали законопроект о дорожном строительстве или любые другие важные вопросы."
 ww1_bosnia.62.a: "Нам нужно наверстать упущенное"
 ww1_bosnia.63.t: "Управление оккупацией Таслицы"
 ww1_bosnia.63.d: "Черногорская часть Санджака теперь заключена в границах кондоминиума, хотя, как нам сообщили, только на временной основе. На оккупированной территории существует большое меньшинство боснийских мусульман, наряду с черногорскими сербами. Замешательство по поводу этой оккупации царит повсеместно, поскольку она может изменить состав правительства. Если немного подтолкнуть, это тоже может случиться, поскольку она уже была частью османского 'Боснийского вилайета' и может быть включена в кондоминиум без особых проблем."
 ww1_bosnia.63.a: "Я не против расширения!"
 ww1_bosnia.64.t: "'Шкодерский кризис'"
 ww1_bosnia.64.d: "Сербия и Черногория отказываются отдавать свои албаноязычные земли независимому албанскому государству, как того требует Вена. Реагируя яростно на эту новость, [BOS.GetLeader] объявляет чрезвычайное положение, приостанавливает деятельность сербских культурных ассоциаций и распускает Сабор из-за сербской воинственности."
 ww1_bosnia.64.a: "Заставить их замолчать"
 ww1_bosnia.65.t: "Запланирована вторая сессия Сейма"
 ww1_bosnia.65.d: "Вторая сессия Сейма запланирована примерно через 50 дней. Для боснийских законодателей настало время подготовить то, что они предложат собранию, поскольку здесь всё требует вечности, чтобы даже быть рассмотренным теми, у кого есть власть что-либо реализовать."
 ww1_bosnia.65.a: "Не будем загадывать"
 ww1_bosnia.66.t: "Запланирована третья сессия Сейма"
 ww1_bosnia.66.d: "После окончания предыдущей сессии запланирована третья сессия Сейма. На следующей сессии мы должны раз и навсегда решить языковой вопрос, поскольку затянувшиеся дебаты по нему перекрыли и заняли время, отведённое на другие насущные вопросы."
 ww1_bosnia.66.a: "Что-то происходит."
 ww1_bosnia.67.t: "Босния присылает нам рабочую силу"
 ww1_bosnia.67.d: "Скорее всего, в попытке расположить нас к себе, кондоминиум через своего генерал-губернатора отправил нам несколько тысяч душ для службы в нашей армии. Они были набраны сверх существующих квот, как 'добавка'. Будем надеяться, что это станет одним из признаков того, что прежние проблемы решены и больше не будет препятствий. Будет ли это знаком или нет, эта рабочая сила, безусловно, пригодится."
 ww1_bosnia.67.a: "Может, мы сможем выжать из них ещё несколько батальонов!"
 ww1_bosnia.68.t: "Билински непоколебим!"
 ww1_bosnia.68.d: "Объединённый министр финансов Империи, Леон Билински, непоколебим в своей позиции по языковому вопросу в кондоминиуме. Среди таких действий, как угрозы удержать зарплату, уволить и арестовать оппозицию и 'закрыть сейм', он также пригрозил привлечь к ситуации генерал-губернатора, который ещё более непреклонен в этом вопросе. Если [BOS.GetLeader] вмешается, угрозы могут быть приведены в исполнение, уничтожив весь прогресс, достигнутый до сих пор. Возможно закрытие Сейма..."
 ww1_bosnia.68.a: "Это может плохо кончиться."
 ww1_bosnia.69.t: "Возмущение сербов по поводу хорватско-мусульманского учения"
 ww1_bosnia.69.d: "Сербская часть нашего населения жалуется на мусульманское учение в наших школах, предназначенное для хорватов и боснийских мусульман. Идея государственной пропаганды, направленной против сербов, не нова и даже не ошибочна, но идея мусульманского индоктринации — настолько глупая жалоба, насколько это вообще возможно."
 ww1_bosnia.69.a: "Игнорировать их."
 ww1_bosnia.70.t: "Дать второй шанс"
 ww1_bosnia.70.d: "Сербское меньшинство в кондоминиуме всегда было самым оппозиционным и агрессивным, несмотря на его относительно небольшую долю населения. Чтобы сохранить администрацию кондоминиума, правительство протягивает оливковую ветвь лидерам сербской общины с согласия Вены. Будем надеяться, что отношения удастся восстановить. Если нет, то может наступить худшее..."
 ww1_bosnia.70.a: "Я всё ещё скептически настроен..."
 ww1_bosnia.71.t: "Борьба Потиорека"
 ww1_bosnia.71.d: "Оскар Потиорек, старый чешский стражник, — новый генерал-губернатор кондоминиума. Ярый противник Конрада фон Готцендорфа, в основном из-за его бредового мнения, что он должен быть начальником Генерального штаба. Поскольку Конрад недавно был уволен и назначен Шемуа, Потиорек не может перестать ворчать, ещё больше разрывая свои связи с другими генералами. Любое повышение — хорошее повышение, поэтому он немедленно подал заявку на текущую должность, где у него есть реальная власть и он мог бы получить важные услуги."
 ww1_bosnia.71.a: "Мы мало что можем с ним поделать"
 ww1_bosnia.72.t: "Закон об отставке членов Сейма"
 ww1_bosnia.72.d: "В связи с непрекращающимися бойкотами и спонтанными отставками в нашем законодательном органе часто возникает несколько вакантных мест, которые юридически не могут быть заполнены до следующих выборов. Был принят закон, решающий эту проблему, согласно которому будут проводиться внеочередные выборы для заполнения вакантных мест, оставленных оппозицией или правительством."
 ww1_bosnia.72.a: "Просто перестаньте уходить в отставку..."
 ww1_bosnia.73.t: "Закон об ограничениях на лесозаготовки"
 ww1_bosnia.73.d: "Сейм попытался решить 'лесной вопрос' Боснии. До австро-венгерской оккупации 1878 года управление лесами в Боснии регулировалось Османским лесным регламентом 1869 года. Он требовал, чтобы местные чиновники проверяли правоустанавливающие документы (тапу) и записывали их в реестры. Когда австрийцы захватили власть, они посмотрели на боснийские леса с долларовыми знаками в глазах: они могли только представить прибыль, которую принесёт эксплуатация молодой боснийской древесины. Они переквалифицировали эти земли в государственную собственность и криминализировали ранее принятые методы. С тех пор как Сейм был избран, этот вопрос объединил и мусульманскую, и сербскую партии. Сербы поддерживают это, потому что их крестьяне буквально банкротятся. Между тем, мусульмане поддерживают лесной закон, потому что из-за банкротства крестьян им не могут платить. Предлагаемый законопроект был описан как ответ на австрийскую колонизацию Боснии. Он предлагает значительное сокращение штрафов за нарушение этого закона и признание сервитутов."
 ww1_bosnia.73.a: "Защищать леса!"
 ww1_bosnia.74.t: "Законопроект о реформе школ"
 ww1_bosnia.74.d: "Школьная система по некоторым меркам византийская и идеально подходит для создания инакомыслия среди учеников. Большинство учителей — иностранцы, им не хватает сочувствия к местному населению, они считают их ниже себя. Хотя в Боснии и Герцеговине недостаточно образованных людей для заполнения учительских должностей, следует отдавать приоритет приёму на работу местных жителей. Также, учитывая наши изменения в языковом законе, некоторые ограничения должны быть сняты."
 ww1_bosnia.74.a: "Пусть будут благодарны за это!"
 ww1_bosnia.75.t: "Скандал с сербским словом"
 ww1_bosnia.75.d: "Из-за запретов [BOS.GetLeader] на каждую сербскую организацию, некоторые гордые члены Сейма и пострадавшие газеты ушли в отставку со своих постов. Причина — честь и какая-то плохо продуманная клятва приостановленным газетам. Следствием этой детской игры стало 12 вакантных мест для сербского меньшинства, самое большое число со времён открытия Сейма. Эти 12 вакантных мест не будут унаследованы другими членами СНО, как думали большинство, из-за недавно принятого закона об отставке, который требует проведения выборов на места в случае одновременной отставки нескольких членов."
 ww1_bosnia.75.a: "Гордость воистину грех"
 ww1_bosnia.76.t: "Запрет на немецкий язык одобрен"
 ww1_bosnia.76.d: "Неожиданно Вена одобрила наш запрет на использование немецкого языка в нашей внутренней коммуникации. Мы ожидали большего сопротивления со стороны реальных носителей языка, но это приятный сюрприз."
 ww1_bosnia.76.a: "Отлично!"
 ww1_bosnia.77.t: "Раскрыты планы о Шуцкоре"
 ww1_bosnia.77.d: "Шуцкор были военным подразделением, использовавшимся в 1908 и 1909 годах для жестокого подавления и наказания 'подрывных элементов' в кондоминиуме. Известные своей жестокостью, эта леденящая кровь тема снова в заголовках новостей. Недавно обсуждалось возвращение Шуцкора и мобилизация хорватов и мусульман для 'превентивного' решения проблемы с непокорными сербами. Потиорек поддерживает эту идею, но текущая общественная реакция из-за утечки этой информации в прессу, надеюсь, остановит это обескураживающее предложение."
 ww1_bosnia.77.a: "Он маньяк!"
 ww1_bosnia.78.t: "Наша оккупация Таслицы"
 ww1_bosnia.78.d: "Во время всего хаоса Балканской войны Конрад фон Готцендорф предложил использовать окружающий хаос, чтобы выхватить спорные османско-черногорские земли. Сегодня утром наши силы вошли в город с минимальным сопротивлением. Реальная цель — максимально возможное географическое разделение двух уже слишком близких врагов, Черногории и Сербии."
 ww1_bosnia.78.a: "Ограбление такого уровня, которому даже румыны завидуют!"
 ww1_bosnia.79.t: "Деревообработка Угар"
 ww1_bosnia.79.d: "После принятия наших правил по деревообработке к министерству обратилась приличная фирма. Хотя мы не имеем права голоса в этом вопросе, они были достаточно вежливы, чтобы показать нам предложение и спросить, есть ли у нас какие-либо обоснованные возражения. Никаких не было, поэтому работа начинается немедленно. Нравится нам это или нет, но именно такие вещи нам и нужны для улучшения отношений с Веной."
 ww1_bosnia.79.a: "Без разницы"
 ww1_bosnia.80.t: "Деревообработка Угар"
 ww1_bosnia.80.d: "Министерство финансов и Сейм приняли сделку с фирмой Ugar Treeworks, которая, как мы надеемся, принесёт изменения в лесную промышленность. Концессии были беспорядком, а протесты местных жителей превратили боснийские леса из идеальной возможности в скучную и утомительную битву. Но теперь, когда ограничения введены и реестры находятся в §gболее или менее§! приемлемом состоянии, деньги наконец-то могут потечь."
 ww1_bosnia.80.a: "Наконец-то что-то от боснийцев!"
 ww1_bosnia.81.t: "Запланирована четвёртая сессия Сейма"
 ww1_bosnia.81.d: "Консенсус достигнут, и расписание четвёртой сессии Сейма наконец-то официально утверждено. Ситуация может значительно улучшиться, поскольку впервые Сейм пользуется обещанием стабильного и единого прокоролевского большинства. К сожалению, это не имеет значения, если мир находится на острие ножа, особенно здесь, где стабильность — вымысел, а мир — всего лишь временная иллюзия."
 ww1_bosnia.81.a: "Ведь не так уж и плохо, правда?"
 ww1_bosnia.82.t: ""
 ww1_bosnia.82.d: ""
 ww1_bosnia.82.a: ""
 ww1_bosnia.83.t: "Сейм требует расследования правоустанавливающих документов"
 ww1_bosnia.83.d: "Землевладельцы в Боснии в панике, так как Сабор призвал провести расследование правоустанавливающих документов. Османы не особенно заботились о своём населении, особенно на этих отдалённых землях. Сербы и некоторые хорваты требовали расследования уже десятилетиями, поэтому давление, чтобы исправить эту 'замятую под ковёр' проблему, более чем неотложно."
 ww1_bosnia.83.a: "Интересно..."
 ww1_bosnia.84.t: "Приглашение Франца Фердинанда в Сараево"
 ww1_bosnia.84.d: "Потиорек наконец принял решение. Пригласив наследника престола проинспектировать местный гарнизон и посетить отдалённые части Империи, которой он будет править, Потиорек докажет свою компетентность и, возможно, даже завоюет некоторое уважение в глазах следующего императора. План кажется ему идеальным, за исключением того, что напряжённость в регионе слишком велика для такого громкого события. Фердинанд, который не очень любит такие парады, никогда не согласился бы принять приглашение, если бы Потиорек не распространил приглашение на Софи, герцогиню Гогенберг, жену Франца Фердинанда, которую редко куда-либо приглашают."
 ww1_bosnia.84.a: "Его Императорское и Королевское Высочество? Здесь?"
 ww1_bosnia.85.t: "Сессия Сейма отменена"
 ww1_bosnia.85.d: "Наследник престола был застрелен людьми этого кондоминиума на глазах у генерал-губернатора. Сейм частично несут ответственность, хотя на самом деле члены Сейма ничего не могли сделать, чтобы предотвратить такое ужасное деяние. Вена приостановила всю деятельность Боснийского сабора на неопределённый срок. Сейм ещё не распущен, но сессии точно приостановлены как минимум на несколько месяцев."
 ww1_bosnia.85.a: "А я думал, здесь дела идут лучше"
 ww1_bosnia.86.t: "Пятая сессия Сейма приостановлена"
 ww1_bosnia.86.d: "Пятая сессия завершилась в соответствии с ограничениями, наложенными на неё Веной. Многие последствия наших действий во время этой сессии всё ещё ждут своего часа, но мы не можем просить о продолжении из-за военного времени. У нас всё ещё есть некоторый голос в политике, хотя и нет никакой власти. Надеемся, что эта война закончится и наш Сейм встанет на ноги."
 ww1_bosnia.86.a: "Печально"
 ww1_bosnia.87.t: "Роспуск Сейма"
 ww1_bosnia.87.d: "Сегодня генерал-губернатор [BOS.GetLeader] распустил Боснийский сабор: по мнению Вены, этим землям больше не будут давать шансов в течение долгого времени, намекая на то, что Вена может не открывать парламент снова даже после неизбежного окончания войны. [BOS.GetLeader] защищал Сейм, но его руки были связаны, так как неповиновение приказам было бы самоубийством карьеры. Остаётся только заботиться о себе и пытаться выжить в эти смутные времена."
 ww1_bosnia.87.a: "Прощайте, наверное"