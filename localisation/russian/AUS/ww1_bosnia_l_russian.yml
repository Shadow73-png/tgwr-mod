 BOS_POWDERKEG_DESC: "В 1878 году Берлинский конгресс разрешил Австро-Венгрии оккупировать Боснийский вилайет, который после аннексии 1908 года стал Кондоминиумом Боснии и Герцеговины, находящимся под совместным управлением Цислейтании и Транслейтании.\n\nС момента оккупации 1878 года к этим землям относились как к далёкой колонии, и ситуация не улучшилась. Хорваты, Сербы и Боснийские мусульмане составляют королевство, каждый противоборствует друг другу, но при этом все презирают Австрию ещё больше. Кроме того, националистические группы каждой этнической группы испытывают на прочность административные способности Австро-Венгрии, терроризируя сельскую местность и провоцируя насилие в городах..."
