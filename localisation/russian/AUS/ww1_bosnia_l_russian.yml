 BOS_diet_help_tt: "Мнения могут варьироваться от -5 до 5.\n§r-5§! — §rОчень отрицательно§!;\n§Q-4§! до §Q-3§! — §QОтрицательно§!;\n§o-2§! до §o-1§! — §oСлегка отрицательно§!;\n§Y0§! — §YНейтрально§!;\n§G1§! до §G2§! — §GСлегка положительно§!;\n§n3§! до §n4§! — §nПоложительно§!;\n§55§! — §5Очень положительно§!.\n\nЕсли мнение пытается превысить свой §Yмаксимум§! (§55§!), вместо этого будут применены следующие эффекты:\n£stability_texticon Добавить стабильность: §G+2.00%§!\n£political_power_texticon Добавить политическую власть: §G+25§!\n\nС другой стороны, если мнение пытается опуститься ниже своего §Yминимума§! (§r-5§!), вместо этого будут применены следующие эффекты:\n£stability_texticon Добавить стабильность: §R-2.00%§!\n£political_power_texticon Добавить политическую власть: §R-25§!"
